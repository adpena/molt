[package]
name = "simd-ops"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false
license = "Apache-2.0"
description = "WASM SIMD vectorized ops for Falcon-OCR inference (Rust source)"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"      # The single browser artifact retains the tiled and fused kernels.
lto = true
codegen-units = 1
panic = "abort"
strip = true
