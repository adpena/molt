# The native launch ABI: the runtime entry points a native program's launch
# calls, in call order, and how the development JIT runner is started. The AOT
# main stub (src/molt/cli/native_main_stub.py) and the JIT runner
# (runtime/molt-jit/src/launch.rs) both follow it; tools/gen_native_launch_abi.py
# generates their declarations and the runner's command line and image format
# for Python (run_tier.py, jit_image.py) and Rust (runtime/molt-jit).
#
# Types: u64 (unsigned long long), i32 (int), argv (const char**),
# c_string_array (const char* const*), bytes (const unsigned char*).
schema = 1

# The JIT runner's command line and its image format:
#   molt-jit [<start_receipt_flag> <path>] <image_flag> <image> [args...]
#   molt-jit <probe_flag>
# A JIT image's first line is `#!<runner> <image_flag>`, so execve of the image
# runs that command; its second line starts with `image_marker`. With a start
# receipt the runner creates `<path>` holding `start_receipt` right before the
# program starts. `allocator_restart_flag` is the runner's own: it restarts
# itself with it once on macOS (runtime/molt-jit/src/main.rs), and no caller
# passes it. `probe_flag` alone runs one compiled function in executable
# memory: the CLI's admission probe (src/molt/cli/backend_binary.py).
[runner]
image_flag = "--image"
probe_flag = "--probe"
start_receipt_flag = "--start-receipt"
allocator_restart_flag = "--allocator-restarted"
start_receipt = "{\"schema\":\"molt.jit-start.v1\"}\n"
image_marker = "#molt.jit-image.v3"

# Called in this order, after the launch environment is installed and before
# the program's entry (`molt_main`).
[[start]]
name = "molt_register_compiled_sources"
returns = "void"
params = ["c_string_array", "u64"]

[[start]]
name = "molt_set_app_callable_resolver"
returns = "u64"
params = ["u64"]

[[start]]
name = "molt_module_registry_install"
returns = "u64"
params = ["bytes"]

[[start]]
name = "molt_runtime_init"
returns = "u64"
params = []

[[start]]
name = "molt_runtime_ensure_gil"
returns = "void"
params = []

[[start]]
name = "molt_set_argv"
returns = "void"
params = ["i32", "argv"]

# Called after the entry returns (the stub's `molt_finish`): the runtime
# reports an exception the entry left pending (CPython's PyErr_Print) and
# returns the exit status; its exit then runs teardown and ends the process.
[[finish]]
name = "molt_main_exit_status"
returns = "u64"
params = []

[[finish]]
name = "molt_runtime_exit"
returns = "u64"
params = ["u64"]
