  { name = "invoke_ffi_bridge_capability_denied", semantic = "counter" },
  { name = "guard_tag_type_mismatch", semantic = "counter" },
  { name = "guard_dict_shape_layout_mismatch", semantic = "counter" },
  { name = "guard_dict_shape_layout_fail_null_obj", semantic = "counter" },
  { name = "guard_dict_shape_layout_fail_non_object", semantic = "counter" },
  { name = "guard_dict_shape_layout_fail_class_mismatch", semantic = "counter" },
  { name = "guard_dict_shape_layout_fail_non_type_class", semantic = "counter" },
  { name = "guard_dict_shape_layout_fail_expected_version_invalid", semantic = "counter" },
  { name = "guard_dict_shape_layout_fail_version_mismatch", semantic = "counter" },
