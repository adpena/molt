[package]
name = "molt-wasm-facts"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"

[dependencies]
molt-artifact-publish = { path = "../molt-artifact-publish", optional = true }
serde_json = { workspace = true, optional = true }
molt-host-process = { path = "../molt-host-process", optional = true }
serde = { version = "1.0", features = ["derive"] }
wasmparser = "0.262.0"
wasm-encoder = { version = "0.262.0", features = ["wasmparser"] }

# The library remains usable without host executable admission dependencies.
[features]
default = []
host-tool = ["dep:molt-artifact-publish", "dep:serde_json", "dep:molt-host-process"]

[[bin]]
name = "molt-wasm-facts"
path = "src/main.rs"
required-features = ["host-tool"]

[[test]]
name = "wasm_link_facts_cli"
required-features = ["host-tool"]

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
