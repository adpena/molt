[package]
name = "molt-backend-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
molt-backend = { path = "..", features = ["wasm-backend"] }
molt-codegen-abi = { path = "../../molt-codegen-abi" }
arbitrary = { version = "1", features = ["derive"] }
wasm-encoder = "0.261.0"
wasmparser = "0.261.0"

# Prevent this from interfering with workspace, if any
[workspace]

[[bin]]
name = "fuzz_nan_boxing"
path = "fuzz_targets/fuzz_nan_boxing.rs"
doc = false

[[bin]]
name = "fuzz_wasm_type_section"
path = "fuzz_targets/fuzz_wasm_type_section.rs"
doc = false

[[bin]]
name = "fuzz_tir_passes"
path = "fuzz_targets/fuzz_tir_passes.rs"
doc = false

# Cargo applies [patch] only in the workspace it resolves, so this standalone
# workspace repeats the root Cargo.toml [patch.crates-io] entries for the
# vendored crates it reaches; tools/check_cargo_locks.py checks them.
[patch.crates-io]
cranelift-object = { path = "../../../vendor/rust/cranelift-object" }
object = { path = "../../../vendor/rust/object" }
