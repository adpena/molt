[package]
name = "molt-ir"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"

# Leaf IR vocabulary and SimpleIR transport for the compiler crate graph
# decomposition. This crate must stay free of workspace dependencies so parser,
# pass, lowering, backend, and binary-analysis work can share one immutable IR
# authority without recompiling the whole pipeline.

[package.metadata.molt]
# Files outside this crate that its build reads, relative to this crate as
# cargo:rerun-if-changed paths are. Every source closure that reaches the
# crate keys them, and Cargo's own reads verify the list after each build.
# build.rs embeds the backend environment catalog.
build-inputs = [
  "../../src/molt/backend_environment.json",
]

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
rmp-serde = "1"
sha2 = "0.11"

[build-dependencies]
# Generates the closed backend environment key set (build.rs).
serde_json = { workspace = true }

[features]
default = []
native-backend = []
llvm = []
wasm-backend = []
test-util = []
