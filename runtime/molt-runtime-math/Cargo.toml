[package]
name = "molt-runtime-math"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Math/numeric module group for the Molt runtime (math, cmath, fractions, colorsys, random, decimal)"

[dependencies]
# Core runtime types used by the math implementations
molt-runtime-core = { path = "../molt-runtime-core" }
molt-obj-model = { package = "molt-lang-obj-model", path = "../molt-obj-model" }

# Numeric deps
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
libm = "0.2"

# SHA-512 seed hashing for random.seed(str|bytes|bytearray) and
# statistics seeding. NON-optional: CPython's `random.seed` version=2 semantics
# require `int.from_bytes(a + sha512(a).digest())`; a feature-gated digest that
# no crate enables silently compiled the digest-less fallback (a non-CPython MT
# stream with no error — POISON). These must ALWAYS compile so the correct
# seed-hash path is the only path.
digest = "0.11"
sha2 = "0.11"

[features]
default = []
