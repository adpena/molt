[package]
name = "molt-runtime-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

[dependencies]
libfuzzer-sys = "0.4"
molt-runtime = { path = ".." }
molt-obj-model = { package = "molt-lang-obj-model", path = "../../molt-obj-model" }

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "string_ops"
path = "fuzz_targets/string_ops.rs"
test = false
doc = false

[[bin]]
name = "fuzz_vfs_caps"
path = "fuzz_targets/fuzz_vfs_caps.rs"
test = false
doc = false

[workspace]
members = ["."]

# Cargo applies [patch] only in the workspace it resolves, so this standalone
# workspace repeats the root Cargo.toml [patch.crates-io] entries for the
# vendored crates it reaches; tools/check_cargo_locks.py checks them.
[patch.crates-io]
object = { path = "../../../vendor/rust/object" }
zlib-rs = { path = "../../../vendor/rust/zlib-rs" }
