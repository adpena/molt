[package]
name = "molt-runtime-core"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"

[features]
# Count every attached runtime entry compiled code calls (`call_census`, HF-198).
call-census = []

[dependencies]
molt-codegen-abi = { path = "../molt-codegen-abi" }
crc32fast = "1.5"
molt-obj-model = { package = "molt-lang-obj-model", path = "../molt-obj-model" }
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"

[lints]
workspace = true
