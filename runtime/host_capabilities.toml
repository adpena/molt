# Canonical host-permission grant families shared by Python configuration and
# the native/WASM runtime. Capability tokens remain namespace-extensible: this
# authority owns only built-in profiles and runtime tiers, not a closed token
# universe.

schema_version = 1
default_tier = "none"
explicit_policy_tier = "none"
maximum_builtin_tier = "full"

[[profile]]
name = "core"
description = "No host permissions."
grants = []

[[profile]]
name = "fs"
description = "Broad filesystem read and write permission aliases."
grants = ["fs.read", "fs.write"]

[[profile]]
name = "env"
description = "Broad environment read and write permission aliases."
grants = ["env.read", "env.write"]

[[profile]]
name = "net"
description = "Exact network, TLS, WebSocket, polling, and asyncio operations."
grants = [
  "net.socket",
  "net.socketpair",
  "net.resolve",
  "net.bind",
  "net.listen",
  "net.connect",
  "net.poll",
  "net.asyncio",
  "ssl.connect",
  "ssl.listen",
  "ssl.read",
  "ssl.write",
  "websocket.connect",
  "websocket.listen",
]

[[profile]]
name = "db"
description = "Broad database read and write permission aliases."
grants = ["db.read", "db.write"]

[[profile]]
name = "time"
description = "Wall-clock access."
grants = ["time.wall"]

[[profile]]
name = "random"
description = "Nondeterministic randomness."
grants = ["random"]

[[tier]]
name = "none"
description = "No ambient host permission; explicit grants only."
inherits = []
grants = []

[[tier]]
name = "safe"
description = "Read-only development host surface."
inherits = ["none"]
grants = [
  "env.read",
  "env.len",
  "env.snapshot",
  "fs.read",
  "fs.stat",
  "fs.readdir",
  "glob.glob",
  "os.access",
  "os.getcwd",
  "os.getpid",
  "os.getppid",
  "os.getuid",
  "os.geteuid",
  "os.getgid",
  "os.getegid",
  "os.getlogin",
  "os.getpgrp",
  "os.getloadavg",
  "os.uname",
  "os.readlink",
  "os.listdir",
  "os.scandir",
  "os.walk",
  "shutil.which",
  "time.wall",
]

[[tier]]
name = "standard"
description = "Safe plus ordinary local-development mutation and concurrency."
inherits = ["safe"]
grants = [
  "env.write",
  "env.clear",
  "env.popitem",
  "env.expanduser",
  "env.expandvars",
  "fs.write",
  "os.mkdir",
  "os.makedirs",
  "os.rmdir",
  "os.removedirs",
  "os.link",
  "os.symlink",
  "os.chmod",
  "os.utime",
  "os.chdir",
  "os.umask",
  "os.truncate",
  "os.ftruncate",
  "os.lseek",
  "shutil.copy",
  "shutil.copyfile",
  "shutil.copytree",
  "shutil.move",
  "tempfile.mkdtemp",
  "tempfile.mkstemp",
  "tempfile.named",
  "tempfile.tempdir",
  "tempfile.cleanup",
  "signal.signal",
  "signal.raise",
  "signal.alarm",
  "signal.pause",
  "signal.set_wakeup_fd",
  "thread.spawn",
  "thread.shared",
]

[[tier]]
name = "full"
description = "Standard plus built-in network, process, database, and FFI permissions."
inherits = ["standard"]
grants = [
  "net.socket",
  "net.socketpair",
  "net.resolve",
  "net.bind",
  "net.listen",
  "net.connect",
  "net.poll",
  "net.asyncio",
  "ssl.connect",
  "ssl.listen",
  "ssl.read",
  "ssl.write",
  "websocket.connect",
  "websocket.listen",
  "process.exec",
  "process.asyncio",
  "process.spawn",
  "gui.window",
  "module.extension.exec",
  "random",
  "os.kill",
  "os.waitpid",
  "os.sendfile",
  "os.setpgrp",
  "os.setsid",
  "select.select",
  "select.poll",
  "select.epoll",
  "select.devpoll",
  "db.read",
  "db.write",
  "db.query",
  "db.exec",
  "ffi.unsafe",
  "ffi.require",
  "ffi.sizeof",
  "fcntl.fcntl",
  "python.bridge",
]

