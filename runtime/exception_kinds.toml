# Exception identity authority (HF-207).
#
# Every exception class the runtime raises, matches or constructs has exactly one
# row here. `tools/gen_exception_kinds.py` renders the closed Rust types
# `BuiltinExc`, `ModuleExc` and `ExcKind` (one dense u16 code space), the builtin
# schema table, the module binding table and one bind intrinsic per owning
# module. Runtime raise sites pass a typed kind, never a spelling.
#
# [[builtin]] rows are classes the runtime constructs itself, lazily, on first
# use: the builtins namespace, plus native classes whose namespace is another
# module (as CPython's C modules create `_io.UnsupportedOperation` or
# `binascii.Error`). Fields:
#   name          the class __name__/__qualname__
#   variant       the Rust variant (default: name)
#   bases         zero (the root), one or two builtin row names
#   layout_root   the ExceptionLayoutRoot this row introduces (default: inherited)
#   str_slot      the ExceptionStrSlot this row declares (default: inherited)
#   declares_repr the row declares __repr__ (default false)
#   module        the class __module__ (default "builtins"); another module makes
#                 the class a heap type that is not bound in builtins
#   builtin_binding  bound in the builtins namespace (default: module == "builtins")
#   heap_type     a heap type although its module is builtins (default false)
#   since_minor   first Python 3.x minor that binds the name (default 12)
#   name_lookup   string boundaries (C API, string op kinds) resolve `name` to
#                 this row (default true); false when `name` is not a builtins
#                 spelling, as for `binascii.Error`
#
# [[alias]] rows are extra builtins spellings of one canonical builtin class.
#
# [[module]] rows are classes a Python stdlib module defines. On the first raise
# of a row, the runtime takes the class from its owning module, which must
# already be in sys.modules (nothing is imported), checks its __module__,
# __qualname__ and base, and keeps it in the row's slot for the life of the
# runtime, as CPython's `_asyncio` and `_zoneinfo` keep such classes in module
# state. A row whose owner has not run raises SystemError: no class is minted
# and no other namespace is searched. Fields:
#   owner     the Python module that defines the class
#   name      the class __qualname__ (an attribute of the owner)
#   variant   the Rust variant
#   base      the builtin row the class must derive from

schema_version = 1

[[builtin]]
name = "BaseException"
bases = []
str_slot = "Base"
declares_repr = true

[[builtin]]
name = "BaseExceptionGroup"
bases = ["BaseException"]
layout_root = "BaseExceptionGroup"
str_slot = "Group"

[[builtin]]
name = "Exception"
bases = ["BaseException"]

[[builtin]]
name = "ExceptionGroup"
bases = ["BaseExceptionGroup", "Exception"]
heap_type = true

