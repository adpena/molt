# Exception identity authority (HF-207).
#
# Every exception class the runtime raises, matches or constructs has exactly one
# row here. `tools/gen_exception_kinds.py` renders the closed Rust types
# `BuiltinExc`, `ModuleExc` and `ExcKind` (one dense u16 code space), the builtin
# schema table, the module binding table and one bind intrinsic per owning
# module. Runtime raise sites pass a typed kind, never a spelling.
#
# [[builtin]] rows are classes the runtime constructs itself, lazily, on first
# use: the builtins namespace, plus native classes whose namespace is another
# module (as CPython's C modules create `_io.UnsupportedOperation` or
# `binascii.Error`). Fields:
#   name          the class __name__/__qualname__
#   variant       the Rust variant (default: name)
#   bases         zero (the root), one or two builtin row names
#   layout_root   the ExceptionLayoutRoot this row introduces (default: inherited)
#   str_slot      the ExceptionStrSlot this row declares (default: inherited)
#   declares_repr the row declares __repr__ (default false)
#   module        the class __module__ (default "builtins"); another module makes
#                 the class a heap type that is not bound in builtins
#   builtin_binding  bound in the builtins namespace (default: module == "builtins")
#   heap_type     a heap type although its module is builtins (default false)
#   since_minor   first Python 3.x minor that binds the name (default 12)
#   name_lookup   string boundaries (C API, string op kinds) resolve `name` to
#                 this row (default true); false when `name` is not a builtins
#                 spelling, as for `binascii.Error`
#
# [[alias]] rows are extra builtins spellings of one canonical builtin class.
#
# [[module]] rows are classes a Python stdlib module defines. On the first raise
# of a row, the runtime takes the class from its owning module, which must
# already be in sys.modules (nothing is imported), checks its __module__,
# __qualname__ and base, and keeps it in the row's slot for the life of the
# runtime, as CPython's `_asyncio` and `_zoneinfo` keep such classes in module
# state. A row whose owner has not run raises SystemError: no class is minted
# and no other namespace is searched. Fields:
#   owner     the Python module that defines the class
#   name      the class __qualname__ (an attribute of the owner)
#   variant   the Rust variant
#   base      the builtin row the class must derive from
#
# [[layout]] rows are the typed payload families after the common
# BaseException prefix, in physical order. `kind` is the ExceptionLayoutKind,
# `roots` the ExceptionLayoutRoot rows that use it. Each member:
#   field        the ExceptionTypedField variant; `tag` its stable u8 identity
#   name         the Python attribute
#   storage      "message" (the common message word), "object" (a boxed word)
#                or "py_ssize" (a raw Py_ssize_t)
#   writable, deletable, keyword (a constructor keyword of the owner)
#   missing      "none" (an absent member reads None) or "attribute_error"
#   windows_only the member exists on Windows targets only
# Compiled code reads a member at the slot this order fixes
# (molt-codegen-abi builtin_field); the runtime allocates by the same order.

schema_version = 1

[[layout]]
kind = "Base"
roots = ["Base"]
members = []

[[layout]]
kind = "Group"
roots = ["BaseExceptionGroup"]
members = [
  { field = "GroupMessage", tag = 0, name = "message", storage = "message", writable = false, deletable = false, keyword = false, missing = "none" },
  { field = "GroupExceptions", tag = 1, name = "exceptions", storage = "object", writable = false, deletable = false, keyword = false, missing = "none" },
]

[[layout]]
kind = "Syntax"
roots = ["SyntaxError"]
members = [
  { field = "SyntaxMessage", tag = 2, name = "msg", storage = "message", writable = true, deletable = true, keyword = false, missing = "none" },
  { field = "SyntaxFilename", tag = 3, name = "filename", storage = "object", writable = true, deletable = true, keyword = false, missing = "none" },
  { field = "SyntaxLineNumber", tag = 4, name = "lineno", storage = "object", writable = true, deletable = true, keyword = false, missing = "none" },
  { field = "SyntaxOffset", tag = 5, name = "offset", storage = "object", writable = true, deletable = true, keyword = false, missing = "none" },
  { field = "SyntaxEndLineNumber", tag = 6, name = "end_lineno", storage = "object", writable = true, deletable = true, keyword = false, missing = "none" },
  { field = "SyntaxEndOffset", tag = 7, name = "end_offset", storage = "object", writable = true, deletable = true, keyword = false, missing = "none" },
  { field = "SyntaxText", tag = 8, name = "text", storage = "object", writable = true, deletable = true, keyword = false, missing = "none" },
  { field = "SyntaxPrintFileAndLine", tag = 9, name = "print_file_and_line", storage = "object", writable = true, deletable = true, keyword = false, missing = "none" },
]

[[layout]]
kind = "Import"
roots = ["ImportError"]
members = [
  { field = "ImportMessage", tag = 10, name = "msg", storage = "message", writable = true, deletable = true, keyword = false, missing = "none" },
  { field = "ImportName", tag = 11, name = "name", storage = "object", writable = true, deletable = true, keyword = true, missing = "none" },
  { field = "ImportPath", tag = 12, name = "path", storage = "object", writable = true, deletable = true, keyword = true, missing = "none" },
  { field = "ImportNameFrom", tag = 13, name = "name_from", storage = "object", writable = true, deletable = true, keyword = true, missing = "none" },
]

[[layout]]
kind = "Unicode"
roots = ["UnicodeDecodeError", "UnicodeEncodeError", "UnicodeTranslateError"]
members = [
  { field = "UnicodeEncoding", tag = 14, name = "encoding", storage = "object", writable = true, deletable = true, keyword = false, missing = "none" },
  { field = "UnicodeObject", tag = 15, name = "object", storage = "object", writable = true, deletable = true, keyword = false, missing = "none" },
  { field = "UnicodeStart", tag = 16, name = "start", storage = "py_ssize", writable = true, deletable = false, keyword = false, missing = "none" },
  { field = "UnicodeEnd", tag = 17, name = "end", storage = "py_ssize", writable = true, deletable = false, keyword = false, missing = "none" },
  { field = "UnicodeReason", tag = 18, name = "reason", storage = "object", writable = true, deletable = true, keyword = false, missing = "none" },
]

[[layout]]
kind = "SystemExit"
roots = ["SystemExit"]
members = [
  { field = "SystemExitCode", tag = 19, name = "code", storage = "object", writable = true, deletable = true, keyword = false, missing = "none" },
]

[[layout]]
kind = "OSError"
roots = ["OSError"]
members = [
  { field = "OSErrorErrno", tag = 20, name = "errno", storage = "object", writable = true, deletable = true, keyword = false, missing = "none" },
  { field = "OSErrorStrError", tag = 21, name = "strerror", storage = "object", writable = true, deletable = true, keyword = false, missing = "none" },
  { field = "OSErrorFilename", tag = 22, name = "filename", storage = "object", writable = true, deletable = true, keyword = false, missing = "none" },
  { field = "OSErrorFilename2", tag = 23, name = "filename2", storage = "object", writable = true, deletable = true, keyword = false, missing = "none" },
  { field = "OSErrorWinError", tag = 24, name = "winerror", storage = "object", writable = true, deletable = true, keyword = false, missing = "none", windows_only = true },
  { field = "OSErrorCharactersWritten", tag = 25, name = "characters_written", storage = "py_ssize", writable = true, deletable = true, keyword = false, missing = "attribute_error" },
]

[[layout]]
kind = "StopIteration"
roots = ["StopIteration"]
members = [
  { field = "StopIterationValue", tag = 26, name = "value", storage = "object", writable = true, deletable = true, keyword = false, missing = "none" },
]

[[layout]]
kind = "NameError"
roots = ["NameError"]
members = [
  { field = "NameErrorName", tag = 27, name = "name", storage = "object", writable = true, deletable = true, keyword = true, missing = "none" },
]

[[layout]]
kind = "AttributeError"
roots = ["AttributeError"]
members = [
  { field = "AttributeErrorObject", tag = 28, name = "obj", storage = "object", writable = true, deletable = true, keyword = true, missing = "none" },
  { field = "AttributeErrorName", tag = 29, name = "name", storage = "object", writable = true, deletable = true, keyword = true, missing = "none" },
]

