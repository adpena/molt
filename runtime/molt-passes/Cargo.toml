[package]
name = "molt-passes"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"

[package.metadata.molt]
build-inputs = ["../../src/molt/backend_cache_layout.json"]

# Pass/fact/orchestration layer. This crate depends only on the immutable IR
# vocabulary in molt-ir plus std/data dependencies needed by analyses and cache
# logic. Lowering and backend crates consume this layer; it never depends on
# lowering or backend code.

[dependencies]
hashlink = "0.12.2"
libc = "0.2"
molt-artifact-publish = { path = "../molt-artifact-publish" }
molt-codegen-abi = { path = "../molt-codegen-abi" }
molt-ir = { path = "../molt-ir" }
molt-host-process = { path = "../molt-host-process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
rmp-serde = "1"
sha2 = "0.11"

[features]
default = []
native-backend = ["molt-ir/native-backend"]
llvm = ["molt-ir/llvm"]
test-util = ["molt-ir/test-util"]

[lints]
workspace = true
