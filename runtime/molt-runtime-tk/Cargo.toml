[package]
name = "molt-runtime-tk"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"

[dependencies]
molt-runtime-platform = { path = "../molt-runtime-platform", optional = true, default-features = false }
molt-runtime-core = { path = "../molt-runtime-core" }
molt-obj-model = { package = "molt-lang-obj-model", path = "../molt-obj-model" }
libloading = { version = "0.9", optional = true }
libc = "0.2"

[features]
default = ["tk", "native-tcl"]
tk = []
native-tcl = ["tk", "dep:libloading", "dep:molt-runtime-platform"]

# Tk imports stay explicit: a glob import would let a module draw on an
# ambient set of names that changes with the headless and native-Tcl feature
# lanes. clippy.toml extends this lint to re-exports and prelude paths.
[lints.clippy]
wildcard_imports = "deny"
