[package]
name = "molt-runtime-compression"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"

[dependencies]
molt-runtime-capi = { path = "../molt-runtime-capi" }
molt-cpython-abi = { package = "molt-lang-cpython-abi", path = "../molt-cpython-abi" }
molt-runtime-core = { path = "../molt-runtime-core" }

# Compression backends (all optional)
bzip2 = { version = "0.6", optional = true }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"], optional = true }
libz-rs-sys = { version = "0.6.8", default-features = false, features = ["rust-allocator"], optional = true }
zip = { version = "9.0.4", default-features = false, features = ["deflate"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
xz2 = { version = "0.1", optional = true, features = ["static"] }

[features]
flate2 = ["dep:flate2", "dep:libz-rs-sys"]
default = ["bzip2", "flate2", "xz2", "zip"]
