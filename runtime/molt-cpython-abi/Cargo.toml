[package]
name = "molt-lang-cpython-abi"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "CPython binary ABI compatibility shim for Molt — enables dlopen-loading real CPython C extensions"

[lib]
name = "molt_cpython_abi"
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Enable SIMD-accelerated type-tag batch checking (x86_64 SSE4.1 / ARM NEON)
simd = []
# Enable dlopen-based loading of pre-built CPython .so extensions
extension-loader = ["dep:libloading"]
# Compile the shared calibration and execution-control authority only for
# explicit L7 verification. The C overlay witness remains an ABI-only probe.
l7-attestation-core = []
l7-test-probe = ["l7-attestation-core", "dep:molt-cpython-abi-test-support"]
runtime-test-support = []

[dependencies]
molt-lang-obj-model = { path = "../molt-obj-model" }
# molt-lang-runtime is NOT listed here to avoid circular dependency.
# Runtime integration (type IDs, heap object allocation) is injected via
# the AbiRuntimeHooks trait at load time.
libc                = "0.2"
once_cell           = "1.21"
parking_lot         = "0.12"
unicode-properties  = { version = "0.1", default-features = false, features = ["general-category"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = { version = "0.9", optional = true }
molt-cpython-abi-test-support = { path = "../molt-cpython-abi-test-support", optional = true }

[dev-dependencies]
# Integration tests mint NaN-boxed pointer handles (so the bridge's classify
# path stamps the right builtin ob_type) via MoltObject::from_ptr.
molt-lang-obj-model = { path = "../molt-obj-model" }

[build-dependencies]
cc = "1"

[[test]]
name = "l7_numeric_perf_attestation"
path = "tests/l7_numeric_perf_attestation.rs"
required-features = ["l7-test-probe"]
