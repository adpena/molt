# Canonical runtime ABI manifest: every runtime entry's machine signature,
# execution context and effects, for native, LLVM and wasm32 alike. It lives
# beside native_launch_abi.toml, not in a backend crate, because every backend
# and the runtime consume it. The WASM-only tables below (import stripping,
# op-loop selectors) retire with the hand-written WASM backend.
# Generated consumers are produced by tools/gen_wasm_abi.py.
# Runtime imports require their exact declared exports and signatures; another
# function with the same machine type is not a substitute for its result contract.
# Edit this file, then run: python tools/gen_wasm_abi.py --write
#
# Value types are machine types: i64 and f64 on every target, i32 a 32-bit
# value, ptr a target pointer (wasm32 i32, native pointer). RuntimeFn carries
# the machine types; WASM consumers read the wasm32 projection.

# Import signature catalog. Each row has at least one materialized import
# producer; `type` below selects catalog metadata, never an emitted module index.
static_type = [
  { params = [], results = ["i64"] },
  { params = ["i64"], results = [] },
  { params = ["i64"], results = ["i64"] },
  { params = ["i64", "i64"], results = ["i64"] },
  { params = ["i64", "i64", "i64"], results = ["i64"] },
  { params = ["i64", "i64"], results = [] },
  { params = ["i64", "i64", "i64", "i64"], results = ["i64"] },
  { params = [], results = [] },
  { params = ["i64", "i64", "i64", "i64", "i64", "i64"], results = ["i64"] },
  { params = ["i64", "i64", "i64", "i64", "i64", "i64", "i64"], results = ["i64"] },
  { params = ["i64", "i64", "i64", "i64", "i64"], results = ["i64"] },
  { params = ["i64"], results = ["ptr"] },
  { params = ["ptr"], results = [] },
  { params = ["ptr", "i64"], results = ["i64"] },
  { params = ["i64", "ptr", "i64"], results = ["i64"] },
  { params = ["ptr", "i64", "ptr"], results = ["i32"] },
  { params = ["i64", "ptr", "ptr"], results = ["i32"] },
  { params = ["ptr", "ptr", "i64"], results = ["i64"] },
  { params = ["ptr", "ptr", "i64", "i64"], results = ["i64"] },
  { params = ["i64", "ptr", "i64", "i64"], results = ["i64"] },
  { params = ["ptr", "i64", "ptr", "i64"], results = ["i32"] },
  { params = ["ptr", "ptr"], results = ["i64"] },
  { params = ["i64", "i64", "i64", "i64", "i64", "i64", "i64", "i64"], results = ["i64"] },
  { params = ["i64", "i64", "i64"], results = [] },
  { params = ["i64", "i64", "i64", "i64", "i64", "i64", "i64", "i64", "i64"], results = ["i64"] },
  { params = ["i64", "i64", "i64", "i64", "i64", "i64", "i64", "i64", "i64", "i64"], results = ["i64"] },
  { params = ["i64", "i64", "i64", "i64", "i64", "i64", "i64", "i64", "i64", "i64", "i64"], results = ["i64"] },
  { params = ["i64", "i64", "i64", "ptr", "i64", "i64"], results = ["i64"] },
  { params = ["i64", "ptr"], results = ["ptr"] },
  { params = [], results = ["ptr"] },
  { params = ["i64", "ptr", "i64", "i64", "i64"], results = ["i64"] },
  { params = ["i64"], results = ["f64"] },
]

non_runtime_callable_intrinsic = [
  # Raw CPython-style borrowed-reference APIs are compiler/C-ABI primitives,
  # never Python-callable function objects.  Every published callable obeys
