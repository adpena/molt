[package]
name = "molt-backend-native"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"

[dependencies]
molt-ir = { path = "../molt-ir" }
molt-tir = { path = "../molt-tir" }
molt-codegen-abi = { path = "../molt-codegen-abi" }
libc = "0.2"
llvm-sys = { version = "221.0.1", optional = true }
# Molt's shipped native compiler supports the primary x86 and ARM64 families
# independent of the machine running the compiler. `host-arch` preserves native
# support for additional Cranelift hosts while the explicit features keep the
# documented x86_64 <-> aarch64 cross-compilation contract available everywhere.
cranelift-codegen = { version = "0.133.1", optional = true, default-features = false, features = ["arm64", "host-arch", "std", "unwind", "x86"] }
cranelift-frontend = { version = "0.133.1", optional = true }
cranelift-module = { version = "0.133.1", optional = true }
cranelift-object = { version = "0.133.1", optional = true }
cranelift-native = { version = "0.133.1", optional = true }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
inkwell = { version = "0.9", default-features = false, features = [
    "llvm22-1",
    "target-webassembly",
], optional = true }

[dev-dependencies]
molt-tir = { path = "../molt-tir", features = ["test-util"] }
object = { version = "0.39", default-features = false, features = ["read", "std"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
inkwell = { version = "0.9", default-features = false, features = ["target-aarch64"], optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
inkwell = { version = "0.9", default-features = false, features = ["target-x86"], optional = true }

[target.'cfg(target_arch = "x86")'.dependencies]
inkwell = { version = "0.9", default-features = false, features = ["target-x86"], optional = true }

[target.'cfg(target_arch = "arm")'.dependencies]
inkwell = { version = "0.9", default-features = false, features = ["target-arm"], optional = true }

[target.'cfg(target_arch = "riscv32")'.dependencies]
inkwell = { version = "0.9", default-features = false, features = ["target-riscv"], optional = true }

[target.'cfg(target_arch = "riscv64")'.dependencies]
inkwell = { version = "0.9", default-features = false, features = ["target-riscv"], optional = true }

[target.'cfg(any(target_arch = "powerpc", target_arch = "powerpc64"))'.dependencies]
inkwell = { version = "0.9", default-features = false, features = ["target-powerpc"], optional = true }

[target.'cfg(target_arch = "s390x")'.dependencies]
inkwell = { version = "0.9", default-features = false, features = ["target-systemz"], optional = true }

[target.'cfg(target_arch = "loongarch64")'.dependencies]
inkwell = { version = "0.9", default-features = false, features = ["target-loongarch"], optional = true }

[target.'cfg(any(target_arch = "mips", target_arch = "mips64"))'.dependencies]
inkwell = { version = "0.9", default-features = false, features = ["target-mips"], optional = true }

[target.'cfg(any(target_arch = "sparc", target_arch = "sparc64"))'.dependencies]
inkwell = { version = "0.9", default-features = false, features = ["target-sparc"], optional = true }

[features]
default = ["native-backend"]
free-threaded = ["native-backend", "molt-codegen-abi/free-threaded"]
native-backend = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-module",
    "dep:cranelift-object",
    "dep:cranelift-native",
    "molt-ir/native-backend",
    "molt-tir/native-backend",
]
llvm = ["dep:inkwell", "molt-ir/llvm", "molt-tir/llvm"]
polly = ["llvm", "dep:llvm-sys"]
