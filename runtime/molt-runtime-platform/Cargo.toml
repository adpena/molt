[package]
name = "molt-runtime-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[features]
default = []
wasm_freestanding = []

[lib]
path = "src/lib.rs"

[dependencies]
digest = "0.11"
md-5 = "0.11"
sha1 = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
