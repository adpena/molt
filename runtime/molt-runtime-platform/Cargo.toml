[package]
name = "molt-runtime-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
build = "build.rs"

[features]
default = []
wasm_freestanding = []

[lib]
path = "src/lib.rs"

[dependencies]
digest = "0.11"
md-5 = "0.11"
sha1 = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

# Native WASI errors use preview1 errno; browser/freestanding builds do not.
[target.'cfg(all(target_arch = "wasm32", target_os = "wasi"))'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"
object = { version = "0.40", default-features = false, features = ["read", "std"] }

[dev-dependencies]
cc = "1"
object = { version = "0.40", default-features = false, features = ["read", "std"] }
