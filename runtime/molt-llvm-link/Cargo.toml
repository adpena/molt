[package]
name = "molt-llvm-link"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
links = "molt_llvm"

[package.metadata.molt]
# Files outside this crate that its build reads, relative to this crate as
# cargo:rerun-if-changed paths are. build.rs publishes through the shared
# write-if-changed helper.
build-inputs = [
  "../build_support/out_file.rs",
]

[features]
default = []
native-link = []

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
