schema = "molt.verified-subset.v3"
build_profiles = ["dev", "release"]
# Reference CPython patches derive from src/molt/_python_release_generated.py.
# The dynamic-execution policy includes noncanonical/direct class builders
# (spec 0216): layouts and method resolution require the static class model.
excluded_verification_scopes = ["capability_policy", "dynamic_execution_policy"]
differential_suites = [
  { cpython_equivalence_floor = 841, path = "tests/differential/basic", recursive = false },
  { cpython_equivalence_floor = 18, path = "tests/differential/basic/generated_from_proofs", recursive = false },
  { cpython_equivalence_floor = 1979, path = "tests/differential/stdlib", recursive = true },
]
