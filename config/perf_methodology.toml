# The perf methodology: the code and data that decide a scoreboard cell's
# numbers and verdicts. Boards are comparable only within one `version`
# (tools/perf_history.py identity_class). `content_sha256` locks the listed
# files; when they change, run `python3 tools/perf_methodology.py --bump` if the
# change can move a number or a verdict, else `--relock`.
schema = "molt-perf-methodology-v1"
# Guest-versus-host failure classification, original failed-capture evidence and
# explicit application compiler arguments change diagnostic verdicts. Earlier
# reports retain their recorded class.
version = 17
content_sha256 = "89877b8d058e26da4d265aaac7e6ad8ee67f8a88cc1f18f3b9d6ba18c0b54f9e"

[[methodology]]
path = "tools/safe_run.py"
role = "times each process and samples its peak RSS"

[[methodology]]
path = "tools/perf_scoreboard_measure.py"
role = "runs the cold and warm samples for one cell"

[[methodology]]
path = "tools/perf_scoreboard_model.py"
