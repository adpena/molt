# The perf methodology: the code and data that decide a scoreboard cell's
# numbers and verdicts. Boards are comparable only within one `version`.
# `content_sha256` locks the listed
# files; when they change, run `uv run python tools/perf_methodology.py --bump` if the
# change can move a number or a verdict, else `--relock`.
schema = "molt-perf-methodology-v1"
# Binding-flow analysis admits only reachable modules and resolves callables by
# definition (family B), so a benchmark's admitted workload dependencies, and
# with them its workload identity, can change. Earlier reports retain their
# recorded class.
# Source fingerprints cover the Git-admitted source set (molt.source_admission)
# instead of a filesystem walk, so fingerprint digests and cache reuse can move
# cold and warm samples. Earlier reports retain their recorded class.
# The host digest cache reads bounded pages of adjacent keys instead of the
# whole store (toolchain_identity.FileDigestCache), and target facts resolve
# once per process (compilation_target, native_target), so warm build samples
# can move. Earlier reports retain their recorded class.
# The HF-657 primitive ratio/noise calibration changes diagnostic verdicts;
# workload declarations and the release-performance acceptance scope are unchanged.
# The HF-198 primitive ratio/noise calibration (nested runtime entries borrow
# their custody) changes diagnostic verdicts the same way.
# v30: family B lowers proven builtin reads with no guard or lookup (91e970a03e,
# 30e3bb6b87), and binding flow keeps owned display strings and expires mutable
# descendant facts at callbacks (deb45c66df, 67236970f1, 6caf9faa68), so
# instruction counts and admitted workload modules can move. These landed on
# main without the lock (HF-601). Earlier reports retain their recorded class.
# v32: HF-803 adds the implicit class-builder read, its callback effects and
# guarded identity. Admitted workloads and instruction counts can change;
# earlier reports retain their recorded comparison class.
# v34: HF-561 adds caught user and runtime raise primitives to the instruction
# scoreboard, and class ancestry is borrowed on the raise path, so raise and
# isinstance counts can move; earlier reports retain their recorded class.
# v35: HF-198 carries the attached execution context through WASM host calls
# and admits schema-qualified exports, so invocation costs can move; earlier
# reports retain their recorded comparison class.
# v36: the instruction axis moves to tools/perf_instructions.py: Molt counts on
# the farm against the nearest measured ancestor, CPython for output only, no
# ratchet; the board-vs-history chain is retired (HF-222).
# v37: a build that molt.disk_capacity refuses is infrastructure_error, not
# build_failed, so a full host never reads as a compiler failure.
# v38: CPython is timed with the uv-managed base interpreter and no PYTHON*
# settings (hash seed fixed); the development interpreter added about 0.2 s
# of site and sitecustomize startup to every CPython sample.
# v39: binding flow keeps a subclass of plain class statements on `type`'s
# plain preparation (90370dd36f, HF-846 class facts), so admitted workload
# facts and instruction counts can move; it landed on main without the lock.
# Earlier reports retain their recorded comparison class.
# v40: a module written through an escaped module value is no longer an
# InitOnce cell (77bda3baee, plan C), so admitted module-cell facts can move for
# programs that write a module through sys.modules or import_module. Earlier
# reports retain their recorded comparison class.
# v41: proven class calls allocate inline and enter __init__ directly (41fd9714d0),
# so instruction counts of class-heavy workloads can move; it landed without the
# lock. Earlier reports retain their recorded comparison class.
# v42: constructor results stay exact when no code can assign __class__
# (75547a09db), so admitted type facts and instruction counts can move; it landed
# without the lock. Earlier reports retain their recorded comparison class.
# v43: classes with properties stay provable and properties on exact receivers
# are read directly (5125aeef58), so admitted facts and instruction counts can
# move; it landed without the lock. Earlier reports retain their recorded class.
# v45: implicit classmethod and staticmethod names and property results no longer
# get an exact receiver (5faae65606, HF-968), and binding flow resumes proven
# prefixes across activation revisions (HF-938), and builtin getattr records a
# deferred read (f6ee8b630a), so admitted callable facts and
# instruction counts can move; it landed without the lock (postsubmit
# 2026-11-21). Earlier reports retain their recorded class.
# v46: binding flow projects unread foreign writers (9fe1a0954e), sealed
# development TIR is materialized with unread callables published (a6256d7add),
# and publication declarations are tracked apart from slot layout (a1214dd2ed),
# so admitted facts and instruction counts can move; they landed without the
# lock (2026-11-21). Earlier reports retain their recorded class.
# v47: binding flow retains precise initializer and deferred binding
# boundaries (fd913b5589), so admitted facts can move; it landed without the
# lock (2026-11-21). Earlier reports retain their recorded class.
# Benchmark references use admitted source packages and locked wheels.
# Build and execution observations identify the physical backend and runtime.
# A proven linked-runtime probe and completed call facts can prune source
# branches directly, changing admitted dependencies and emitted instructions.
# One synchronous source-outcome dependency observation can reduce compile time.
# Tool source closure keys use the selected per-file content digests.
# v159: measured builds share public configuration/option normalization;
# sealed recipe inputs and explicit deployment ownership replace batch defaults.
# v162: exact managed isolated CPython, shared workload custody and parity,
# complete baseline samples, and matching observed oracle identities for comparisons.
version = 170
content_sha256 = "754da7389cf68063deb27865983fc2229644f51438c0ce12e4bb3f539e079f5f"

