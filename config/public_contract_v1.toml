schema = "molt.public-contract.v1"

# Artifact and receipt formats a downstream consumer may depend on.
public_schemas = [
  "molt.release-supply-chain.v1",
  "molt.release-candidate.v1",
  "molt.release-manifest.v2",
  "molt.release-targets.v1",
  "molt-release-exit/3",
  "molt-pact-witness-acceptance/2",
  "molt.phase-exit-manifest.v1",
  "molt.phase-exit-requirements.v1",
  "molt.legacy-inventory.v1",
  "molt.public-contract.v1",
  "molt.public-contract-surface.v1",
  "molt.verified-subset.v1",
]

# Molt v1 public stable contract: the reviewed declaration half.
#
# Every command the CLI exposes must be tiered here (tools/public_contract_gate.py
# --check fails otherwise). `stable` commands keep their surface within a major
# version; changing one requires `--update` of the generated snapshot in the
# same landing, which is the reviewable act of changing the contract.
# `preview` commands are snapshotted for visibility but may change between
# minor releases. `internal` commands serve the repository's own apparatus and
# carry no compatibility promise. See docs/spec/PUBLIC_CONTRACT_V1.md.

[policy]
versioning = "semver"
python_target_range = ">=3.12"
stable_within = "major"
preview_may_change_within = "minor"
deprecation = "time-bounded public transition recorded in config/legacy_inventory.toml with a removal_release; no silent removal"
release_gate = "tools/release/release_authority.py refuses a v1+ tag without a green H0 phase-exit manifest for the tagged commit"

# Core product surface.
