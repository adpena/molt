schema_version = 4
default_release = "22.1.8"
canonical_build_type = "Release"

# The apt.llvm.org copy of llvm.sh is a mutable URL: its content moved on
# 2026-08-09 and broke every CI SDK setup step against the old digest. Pin the
# same script at its immutable upstream commit instead; the loader refuses any
# installer URL that is not a commit-addressed raw GitHub path.
[debian_installer]
url = "https://raw.githubusercontent.com/opencollab/llvm-jenkins.debian.net/c5ecff7c7208c8b5225e1f6e6ae6f2539e1d31ea/llvm.sh"
sha256 = "03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae"
provenance_url = "https://github.com/opencollab/llvm-jenkins.debian.net/commit/c5ecff7c7208c8b5225e1f6e6ae6f2539e1d31ea"

# One wasi-sdk release owns every WebAssembly tool Molt links or inspects with
# (wasm-ld, llvm-nm) and the WASI sysroot, on every shipped release host. Its
# LLVM producer line is independent of the native/MLIR backend release above.
# Each host asset's byte size and SHA-256 were read from the provenance release
# record; tools/provision_wasi_sdk.py accepts an archive only on an exact match.
[wasi_sdk]
archive_version = "33.0"
sdk_version = "33.0+m"
llvm_version = "22.1.0"
provenance_url = "https://api.github.com/repos/WebAssembly/wasi-sdk/releases/tags/wasi-sdk-33"

[wasi_sdk.targets.linux-x86_64]
url = "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz"
