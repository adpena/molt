# Pins taken before their release was 7 days old (the release-age rule,
# docs/DEVELOPER_GUIDE.md). Each entry names one pin, its release, the
# moment that release turns 7 days old (rounded up to a whole second), what
# it cites (an advisory ID, or the open ledger row that owns it) and the
# reason. Lock exemptions live where their resolver reads them: pyproject.toml
# for uv and each npm project's .npmrc.
#
# `tools/pin_freshness.py --check` fails on a pin younger than 7 days without
# an entry, unless it is the oldest clean release above an aged release that
# carries an advisory, and on an entry that has aged out; `--prune-expired`
# deletes those entries.
