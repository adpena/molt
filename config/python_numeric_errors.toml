# Exact CPython numeric exception policy. Consumer dispatch follows operand semantics, not value integrality.
schema_version = 1
supported_targets = ["3.12", "3.13", "3.14"]

[[context]]
name = "IntegerTrueDivision"
operation = "truediv"
operand_kind = "int"
error_class = "ZeroDivisionError"
python_3_12 = "division by zero"
python_3_13 = "division by zero"
python_3_14 = "division by zero"

