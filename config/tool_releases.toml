# Pinned releases of standalone tool binaries that both CI and the local
# custody toolchain root install from. One authority: the CI provisioning
# command and proof-plan toolchain policy consume this manifest, and
# src/molt/tool_releases.py
# provisions the host asset into `<toolchain root>/<name>-<version>/bin`
# only after the download matches the recorded size and SHA-256 exactly.
# Each tool's `provenance` names the authority its digests were read from (a
# GitHub release record, or an official SHASUMS256.txt checksum manifest whose
# version directory holds the assets); every digest was re-verified by hashing
# the downloaded archive.

[tools.wasm-tools]
version = "1.263.0"
executable = "wasm-tools"

[tools.wasm-tools.provenance]
kind = "github-release"
url = "https://api.github.com/repos/bytecodealliance/wasm-tools/releases/tags/v1.263.0"
