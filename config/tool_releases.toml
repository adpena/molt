schema_version = 1

# Pinned releases of standalone tool binaries that both CI and the local
# custody toolchain root install from. One authority: the CI workflow pin
# (taiki-e/install-action `tool: <name>@<version>`) and the proof-plan
# toolchain policy are gated against it, and src/molt/tool_releases.py
# provisions the host asset into `<toolchain root>/<name>-<version>/bin`
# only after the download matches the recorded size and SHA-256 exactly.
# Digests come from the GitHub release asset records at `provenance_url`
# and were re-verified by hashing the downloaded archive.

