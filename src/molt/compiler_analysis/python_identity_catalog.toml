# Compiler-only Python identity, acquisition and mutation authority.
# Bit positions are stable cache identities; never renumber an existing entry.
schema_version = 2

[identity_bits]
IMPORTLIB_MODULE = 0
IMPORTLIB_IMPORT_MODULE = 1
IMPORTLIB_MACHINERY_MODULE = 2
MODULE_SPEC_CLASS = 3
MODULE_SPEC_INSTANCE = 4
BUILTINS_MODULE = 5
BUILTINS_IMPORT = 6
SYS_MODULE = 7
SYS_MODULES = 8
INSPECT_MODULE = 9
INSPECT_CURRENTFRAME = 10
CURRENT_MODULE = 11
CURRENT_GLOBALS = 12
CURRENT_LOCALS = 13
CURRENT_FRAME = 14
BUILTIN_GLOBALS = 15
BUILTIN_LOCALS = 16
BUILTIN_VARS = 17
BUILTIN_SETATTR = 18
BUILTIN_EVAL = 19
BUILTIN_EXEC = 20
USER_FUNCTION = 21
USER_CLASS = 22
INERT_VALUE = 23
IMPORTLIB_UTIL_MODULE = 24
IMPORTLIB_FIND_SPEC = 25
TYPING_MODULE = 26
STATIC_FALSE = 27
INTRINSICS_MODULE = 28
INTRINSICS_REQUIRE = 29
OTHER = 30
UNBOUND = 31
GLOBALS_SETITEM = 32
GLOBALS_DELITEM = 33
BUILTIN_BOOL = 34
BUILTIN_INT = 35
BUILTIN_FLOAT = 36
BUILTIN_COMPLEX = 37
BUILTIN_STR = 38
BUILTIN_BYTES = 39
BUILTIN_BYTEARRAY = 40
BUILTIN_TUPLE = 41
BUILTIN_LIST = 42
BUILTIN_SET = 43
BUILTIN_FROZENSET = 44
BUILTIN_DICT = 45
BUILTIN_RANGE = 46
BUILTIN_LEN = 47
BUILTIN_OPEN = 48
INTRINSIC_SYS_PLATFORM = 49
INTRINSIC_OS_NAME = 50
INTRINSIC_MODULE_IMPORT = 51
INTRINSIC_IMPORTLIB_IMPORT_MODULE = 52
INTRINSIC_IMPORTLIB_IMPORT_OPTIONAL = 53
INTRINSIC_IMPORTLIB_IMPORT_OR_FALLBACK = 54
INTRINSIC_IMPORTLIB_IMPORT_REQUIRED = 55
INTRINSIC_IMPORTLIB_IMPORT_TRANSACTION = 56
INTRINSIC_IMPORTLIB_FIND_SPEC = 57
INTRINSICS_LOAD = 58
INTRINSIC_SYS_VERSION_INFO = 59
INTRINSICS_RUNTIME_ACTIVE = 60
BUILTIN_CLASSMETHOD = 61
BUILTIN_STATICMETHOD = 62
RETAINED_CALLABLE_WRAPPER = 63
DATACLASSES_MODULE = 64
DATACLASSES_DATACLASS = 65
TYPING_OVERLOAD = 66
MOLT_MODULE = 67
MOLT_GPU_MODULE = 68
GPU_KERNEL = 69
BUILTIN_PROPERTY = 70
DATACLASSES_KW_ONLY = 71
DATACLASSES_INITVAR = 72
TYPING_CLASSVAR = 73
DATACLASSES_FIELD = 74
BUILTIN_GETATTR = 75
BUILTIN_HASATTR = 76
BUILTIN_DELATTR = 77

[target_property]
SYS_PLATFORM = "sys_platform"
OS_NAME = "os_name"
SYS_VERSION_INFO = "sys_version_info"

[import_behavior]
LEAF = "leaf"
DUNDER = "dunder"
FINDER = "finder"
FALLBACK = "fallback"

[import_argument_role]
NAME = "name"
PACKAGE = "package"
GLOBALS = "globals"
LOCALS = "locals"
FROMLIST = "fromlist"
LEVEL = "level"
FALLBACK = "fallback"
PATH = "path"
TARGET = "target"

[[import_callable]]
identity = "BUILTINS_IMPORT"
target = "__import__"
behavior = "DUNDER"
parameter_names = ["name", "globals", "locals", "fromlist", "level"]
argument_roles = ["NAME", "GLOBALS", "LOCALS", "FROMLIST", "LEVEL"]
minimum_arguments = 1

[[import_callable]]
identity = "IMPORTLIB_IMPORT_MODULE"
target = "importlib.import_module"
behavior = "LEAF"
parameter_names = ["name", "package"]
argument_roles = ["NAME", "PACKAGE"]
minimum_arguments = 1

[[import_callable]]
identity = "IMPORTLIB_FIND_SPEC"
target = "importlib.util.find_spec"
behavior = "FINDER"
parameter_names = ["name", "package"]
argument_roles = ["NAME", "PACKAGE"]
minimum_arguments = 1

[[intrinsic_callable]]
name = "molt_sys_platform"
identity = "INTRINSIC_SYS_PLATFORM"
target_property = "SYS_PLATFORM"

[[intrinsic_callable]]
name = "molt_os_name"
identity = "INTRINSIC_OS_NAME"
target_property = "OS_NAME"

[[intrinsic_callable]]
name = "molt_module_import"
identity = "INTRINSIC_MODULE_IMPORT"
import_behavior = "LEAF"
argument_roles = ["NAME"]

[[intrinsic_callable]]
name = "molt_importlib_import_module"
identity = "INTRINSIC_IMPORTLIB_IMPORT_MODULE"
import_behavior = "LEAF"
argument_roles = ["NAME", "PACKAGE"]

[[intrinsic_callable]]
name = "molt_importlib_import_optional"
identity = "INTRINSIC_IMPORTLIB_IMPORT_OPTIONAL"
import_behavior = "LEAF"
argument_roles = ["NAME"]

[[intrinsic_callable]]
name = "molt_importlib_import_or_fallback"
identity = "INTRINSIC_IMPORTLIB_IMPORT_OR_FALLBACK"
import_behavior = "FALLBACK"
argument_roles = ["NAME", "FALLBACK"]

[[intrinsic_callable]]
name = "molt_importlib_import_required"
identity = "INTRINSIC_IMPORTLIB_IMPORT_REQUIRED"
import_behavior = "LEAF"
argument_roles = ["NAME"]

[[intrinsic_callable]]
name = "molt_importlib_import_transaction"
identity = "INTRINSIC_IMPORTLIB_IMPORT_TRANSACTION"
import_behavior = "DUNDER"
argument_roles = ["NAME", "GLOBALS", "LOCALS", "FROMLIST", "LEVEL"]

[[intrinsic_callable]]
name = "molt_importlib_find_spec"
identity = "INTRINSIC_IMPORTLIB_FIND_SPEC"
import_behavior = "FINDER"
argument_roles = ["NAME", "PATH", "TARGET"]

[[intrinsic_callable]]
name = "molt_require_intrinsic_runtime"
identity = "INTRINSICS_REQUIRE"
acquisition = "required"
compiler_from = ["require_intrinsic", "_require_intrinsic"]

[[intrinsic_callable]]
name = "molt_load_intrinsic_runtime"
identity = "INTRINSICS_LOAD"
acquisition = "optional"
compiler_from = ["load_intrinsic", "_load_intrinsic"]

