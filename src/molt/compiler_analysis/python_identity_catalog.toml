name = "require_intrinsic"
identity = "INTRINSICS_REQUIRE"
guard = "INTRINSICS_REQUIRE"

[[write]]
owner = "MODULE_SPEC_CLASS"
name = "*"
guards = ["MODULE_SPEC_CLASS"]

[[write]]
owner = "BUILTINS_MODULE"
name = "__import__"
guards = ["IMPORT_HOOKS"]

[[write]]
owner = "SYS_MODULE"
name = "meta_path"
guards = ["IMPORT_HOOKS"]

[[write]]
owner = "SYS_MODULE"
name = "modules"
guards = ["IMPORT_HOOKS"]

[[write]]
owner = "SYS_MODULE"
name = "path_hooks"
guards = ["IMPORT_HOOKS"]

[[write]]
owner = "SYS_MODULE"
name = "path_importer_cache"
guards = ["IMPORT_HOOKS"]

[[write]]
owner = "SYS_MODULE"
name = "platform"
guards = ["SYS_PLATFORM"]
