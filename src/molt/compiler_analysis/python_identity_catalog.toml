[[module]]
name = "_intrinsics"
identity = "INTRINSICS_MODULE"

[[acquisition]]
owner = "IMPORTLIB_MODULE"
name = "import_module"
identity = "IMPORTLIB_IMPORT_MODULE"
guard = "IMPORTLIB_IMPORT_MODULE"

[[acquisition]]
owner = "IMPORTLIB_MODULE"
name = "util"
identity = "IMPORTLIB_UTIL_MODULE"
guard = "IMPORTLIB_UTIL"

[[acquisition]]
owner = "IMPORTLIB_MODULE"
name = "machinery"
