DATACLASS = ["PARAMETERS", "POSITIONAL", "DEFAULTS", "KWDEFAULTS", "CAPTURE_NAMES", "CAPTURES", "STORES", "POST_INIT_INPUTS", "FACTORY_MARKER", "FROZEN_OBJECT", "ANNOTATIONS", "GLOBALS", "MODULE", "BUILTINS"]

[target_property]
SYS_PLATFORM = "sys_platform"
OS_NAME = "os_name"
SYS_VERSION_INFO = "sys_version_info"

[import_behavior]
LEAF = "leaf"
DUNDER = "dunder"
FINDER = "finder"
FALLBACK = "fallback"

[import_argument_role]
NAME = "name"
PACKAGE = "package"
GLOBALS = "globals"
LOCALS = "locals"
FROMLIST = "fromlist"
LEVEL = "level"
FALLBACK = "fallback"
PATH = "path"
TARGET = "target"

[[import_callable]]
identity = "BUILTINS_IMPORT"
target = "__import__"
behavior = "DUNDER"
parameter_names = ["name", "globals", "locals", "fromlist", "level"]
argument_roles = ["NAME", "GLOBALS", "LOCALS", "FROMLIST", "LEVEL"]
minimum_arguments = 1

[[import_callable]]
identity = "IMPORTLIB_IMPORT_MODULE"
target = "importlib.import_module"
behavior = "LEAF"
parameter_names = ["name", "package"]
argument_roles = ["NAME", "PACKAGE"]
minimum_arguments = 1

[[import_callable]]
identity = "IMPORTLIB_FIND_SPEC"
target = "importlib.util.find_spec"
behavior = "FINDER"
parameter_names = ["name", "package"]
argument_roles = ["NAME", "PACKAGE"]
minimum_arguments = 1

[[intrinsic_callable]]
name = "molt_sys_platform"
identity = "INTRINSIC_SYS_PLATFORM"
target_property = "SYS_PLATFORM"

[[intrinsic_callable]]
name = "molt_dataclasses_init_globals"
identity = "INTRINSIC_DATACLASSES_INIT_GLOBALS"
attribute_read = { argument = 0, member = "__dict__" }

[[intrinsic_callable]]
name = "molt_dataclasses_init"
identity = "INTRINSIC_DATACLASSES_INIT"
native_initializer = "DATACLASS"

[[intrinsic_callable]]
name = "molt_os_name"
identity = "INTRINSIC_OS_NAME"
target_property = "OS_NAME"

[[intrinsic_callable]]
name = "molt_module_import"
identity = "INTRINSIC_MODULE_IMPORT"
import_behavior = "LEAF"
argument_roles = ["NAME"]

[[intrinsic_callable]]
name = "molt_importlib_import_module"
identity = "INTRINSIC_IMPORTLIB_IMPORT_MODULE"
import_behavior = "LEAF"
argument_roles = ["NAME", "PACKAGE"]

[[intrinsic_callable]]
name = "molt_importlib_import_optional"
identity = "INTRINSIC_IMPORTLIB_IMPORT_OPTIONAL"
import_behavior = "LEAF"
argument_roles = ["NAME"]

[[intrinsic_callable]]
name = "molt_importlib_import_or_fallback"
identity = "INTRINSIC_IMPORTLIB_IMPORT_OR_FALLBACK"
import_behavior = "FALLBACK"
argument_roles = ["NAME", "FALLBACK"]

[[intrinsic_callable]]
name = "molt_importlib_import_required"
identity = "INTRINSIC_IMPORTLIB_IMPORT_REQUIRED"
import_behavior = "LEAF"
argument_roles = ["NAME"]

[[intrinsic_callable]]
name = "molt_importlib_import_transaction"
identity = "INTRINSIC_IMPORTLIB_IMPORT_TRANSACTION"
import_behavior = "DUNDER"
argument_roles = ["NAME", "GLOBALS", "LOCALS", "FROMLIST", "LEVEL"]

[[intrinsic_callable]]
name = "molt_importlib_find_spec"
identity = "INTRINSIC_IMPORTLIB_FIND_SPEC"
import_behavior = "FINDER"
argument_roles = ["NAME", "PATH", "TARGET"]

[[intrinsic_callable]]
name = "molt_require_intrinsic_runtime"
identity = "INTRINSICS_REQUIRE"
acquisition = "required"
compiler_from = ["require_intrinsic", "_require_intrinsic"]

[[intrinsic_callable]]
name = "molt_load_intrinsic_runtime"
identity = "INTRINSICS_LOAD"
acquisition = "optional"
compiler_from = ["load_intrinsic", "_load_intrinsic"]

