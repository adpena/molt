name = "find_spec"
identity = "IMPORTLIB_FIND_SPEC"
guard = "UTIL_FIND_SPEC"

[[acquisition]]
owner = "IMPORTLIB_MACHINERY_MODULE"
name = "ModuleSpec"
identity = "MODULE_SPEC_CLASS"
guard = "MACHINERY_MODULE_SPEC"

[[acquisition]]
owner = "SYS_MODULE"
name = "modules"
identity = "SYS_MODULES"
guard = "SYS_MODULES"

[[acquisition]]
owner = "INSPECT_MODULE"
name = "currentframe"
