# Compiler-only Python identity, acquisition and mutation authority.
# Bit positions are stable cache identities; never renumber an existing entry.
schema_version = 1

[identity_bits]
IMPORTLIB_MODULE = 0
IMPORTLIB_IMPORT_MODULE = 1
IMPORTLIB_MACHINERY_MODULE = 2
MODULE_SPEC_CLASS = 3
MODULE_SPEC_INSTANCE = 4
BUILTINS_MODULE = 5
BUILTINS_IMPORT = 6
SYS_MODULE = 7
SYS_MODULES = 8
INSPECT_MODULE = 9
INSPECT_CURRENTFRAME = 10
CURRENT_MODULE = 11
CURRENT_GLOBALS = 12
CURRENT_LOCALS = 13
CURRENT_FRAME = 14
BUILTIN_GLOBALS = 15
BUILTIN_LOCALS = 16
BUILTIN_VARS = 17
BUILTIN_SETATTR = 18
BUILTIN_EVAL = 19
BUILTIN_EXEC = 20
USER_FUNCTION = 21
USER_CLASS = 22
INERT_VALUE = 23
IMPORTLIB_UTIL_MODULE = 24
IMPORTLIB_FIND_SPEC = 25
TYPING_MODULE = 26
STATIC_FALSE = 27
INTRINSICS_MODULE = 28
INTRINSICS_REQUIRE = 29
OTHER = 30
UNBOUND = 31
GLOBALS_SETITEM = 32
GLOBALS_DELITEM = 33
BUILTIN_BOOL = 34
BUILTIN_INT = 35
BUILTIN_FLOAT = 36
BUILTIN_COMPLEX = 37
BUILTIN_STR = 38
BUILTIN_BYTES = 39
BUILTIN_BYTEARRAY = 40
BUILTIN_TUPLE = 41
BUILTIN_LIST = 42
BUILTIN_SET = 43
BUILTIN_FROZENSET = 44
BUILTIN_DICT = 45
BUILTIN_RANGE = 46
BUILTIN_LEN = 47
BUILTIN_OPEN = 48
INTRINSIC_SYS_PLATFORM = 49
INTRINSIC_OS_NAME = 50

[target_property]
SYS_PLATFORM = "sys_platform"
OS_NAME = "os_name"

[[intrinsic_callable]]
name = "molt_sys_platform"
identity = "INTRINSIC_SYS_PLATFORM"
target_property = "SYS_PLATFORM"

[[intrinsic_callable]]
name = "molt_os_name"
identity = "INTRINSIC_OS_NAME"
target_property = "OS_NAME"

[member_bits]
IMPORTLIB_IMPORT_MODULE = 0
IMPORTLIB_MACHINERY = 1
MACHINERY_MODULE_SPEC = 2
BUILTINS_IMPORT = 3
SYS_MODULES = 4
INSPECT_CURRENTFRAME = 5
MODULE_SPEC_CLASS = 6
IMPORT_HOOKS = 7
IMPORTLIB_UTIL = 8
UTIL_FIND_SPEC = 9
TYPING_TYPE_CHECKING = 10
INTRINSICS_REQUIRE = 11
SYS_PLATFORM = 12
BUILTINS_BOOL = 13
BUILTINS_INT = 14
BUILTINS_FLOAT = 15
BUILTINS_COMPLEX = 16
BUILTINS_STR = 17
BUILTINS_BYTES = 18
BUILTINS_BYTEARRAY = 19
BUILTINS_TUPLE = 20
BUILTINS_LIST = 21
BUILTINS_SET = 22
BUILTINS_FROZENSET = 23
BUILTINS_DICT = 24
BUILTINS_RANGE = 25
BUILTINS_LEN = 26
BUILTINS_OPEN = 27
BUILTINS_GLOBALS = 28
BUILTINS_LOCALS = 29
BUILTINS_VARS = 30
BUILTINS_SETATTR = 31
BUILTINS_EVAL = 32
BUILTINS_EXEC = 33

