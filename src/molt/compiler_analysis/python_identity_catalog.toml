[[module]]
name = "__future__"
identity = "OTHER"

[[module]]
name = "importlib"
identity = "IMPORTLIB_MODULE"

[[module]]
name = "importlib.util"
identity = "IMPORTLIB_UTIL_MODULE"

[[module]]
name = "importlib.machinery"
identity = "IMPORTLIB_MACHINERY_MODULE"

[[module]]
name = "builtins"
identity = "BUILTINS_MODULE"

[[module]]
name = "sys"
