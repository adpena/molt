# ---------------------------------------------------------------------------
# Families: <STEM><SUFFIX>, read by the shared memory guard. The stem-specific
# name wins; root_fallback is the fixed name read when it is unset.
# ---------------------------------------------------------------------------

[[family]]
suffix = "_CHILD_RLIMIT_GB"
root_fallback = "MOLT_CHILD_RLIMIT_GB"
audience = "developer"
kind = "float"
default = ""
owner = "tools/harness_memory_guard.py"
summary = "Guard-scope direct-child RLIMIT_RSS request in GiB; the default follows the live process budget capped by tree/global budgets, and zero disables this optional kernel layer without disabling sampled RSS checks. Separately, the root MOLT_CHILD_RLIMIT_GB is read by Linux runtime child startup: a positive resolved value tightens the budget derived from raw-integer MOLT_RESOURCE_MAX_MEMORY (including headroom), or supplies the budget when absent; zero skips this explicit RLIMIT_DATA installation. Human-readable parent memory values do not enter that numeric derivation. A selected runtime child cap that cannot be installed fails child startup; inherited OS limits remain separate."

[[family]]
suffix = "_KEEPALIVE_SEC"
root_fallback = "MOLT_SUBPROCESS_KEEPALIVE_SEC"
audience = "developer"
kind = "float"
default = "20"
owner = "tools/harness_memory_guard.py"
summary = "Seconds between keepalive progress lines for streamed guarded commands in the scope; 0 or a negative value disables them."

[[family]]
suffix = "_MAX_GLOBAL_RSS_GB"
root_fallback = "MOLT_MAX_GLOBAL_RSS_GB"
audience = "developer"
kind = "float"
default = ""
owner = "tools/harness_memory_guard.py"
summary = "Global RSS budget in GB across all Molt process groups for the scope; default is the adaptive live-memory budget, clamped below the hard cap."

[[family]]
suffix = "_MAX_PROCESS_RSS_GB"
root_fallback = "MOLT_MAX_PROCESS_RSS_GB"
audience = "developer"
kind = "float"
default = ""
owner = "tools/harness_memory_guard.py"
summary = "Per-process RSS budget in GB for the scope; default is the adaptive live-memory budget, clamped below the tree budget."

[[family]]
suffix = "_MAX_TOTAL_RSS_GB"
root_fallback = "MOLT_MAX_TOTAL_RSS_GB"
audience = "developer"
kind = "float"
default = ""
owner = "tools/harness_memory_guard.py"
summary = "Process-tree RSS budget in GB for the scope; default is the adaptive live-memory budget, clamped below the global budget."

[[family]]
suffix = "_MEMORY_AVAILABLE_GB"
root_fallback = "MOLT_MEMORY_AVAILABLE_GB"
audience = "developer"
kind = "float"
default = ""
owner = "tools/memory_guard_core/memory_limits.py"
summary = "Overrides the measured available memory in GB that the adaptive budget starts from; default is read from the OS."

[[family]]
suffix = "_MEMORY_GUARD_POLL_SEC"
root_fallback = "MOLT_MEMORY_GUARD_POLL_SEC"
audience = "developer"
kind = "float"
default = "0.1"
owner = "tools/harness_memory_guard.py"
summary = "Steady-state RSS polling interval in seconds for the scope; non-positive values fall back to 0.1."

[[family]]
suffix = "_MEMORY_RESERVE_GB"
root_fallback = "MOLT_MEMORY_RESERVE_GB"
audience = "developer"
kind = "float"
default = ""
owner = "tools/memory_guard_core/memory_limits.py"
summary = "Memory in GB the adaptive budget keeps free for the OS and other work; default is 6% of physical memory clamped to 1-12 GB."

[[family]]
suffix = "_MEMORY_TOTAL_GB"
root_fallback = "MOLT_MEMORY_TOTAL_GB"
audience = "developer"
kind = "float"
default = ""
owner = "tools/memory_guard_core/memory_limits.py"
summary = "Overrides the measured physical memory in GB that the adaptive budget starts from; default is read from the OS."

[[family]]
suffix = "_REPO_SENTINEL_ACTIVE"
root_fallback = "MOLT_REPO_SENTINEL_ACTIVE"
audience = "internal"
kind = "bool"
default = "0"
owner = "tools/harness_memory_guard.py"
summary = "Set by a suite-level repo sentinel for the commands it covers, so per-command orphan cleanup defers to that sentinel."

[[family]]
suffix = "_STALE_ORPHAN_CLEANUP"
root_fallback = "MOLT_STALE_ORPHAN_CLEANUP"
audience = "developer"
kind = "bool"
default = "1"
owner = "tools/harness_memory_guard.py"
summary = "Whether a guarded command first drains stale orphaned Molt process groups; set 0 only for a deliberate investigation."

[[family]]
suffix = "_STALE_ORPHAN_SEC"
root_fallback = "MOLT_STALE_ORPHAN_SEC"
audience = "developer"
kind = "float"
default = "3600"
owner = "tools/harness_memory_guard.py"
summary = "Age in seconds after which an orphaned Molt process group counts as stale for the preflight drain."

[[family]]
suffix = "_STALE_PYTEST_SEC"
root_fallback = "MOLT_STALE_PYTEST_SEC"
audience = "developer"
kind = "float"
default = "900"
owner = "tools/harness_memory_guard.py"
summary = "Age in seconds after which an orphaned pytest-style process group counts as stale for the preflight drain."

[[family]]
suffix = "_TIMEOUT_SEC"
root_fallback = "MOLT_TEST_PROCESS_TIMEOUT_SEC"
audience = "developer"
kind = "float"
default = ""
owner = "tools/harness_memory_guard.py"
summary = "Wall-clock limit in seconds for guarded commands in the scope; each adapter has its own bounded default, and 0 means unbounded for a deliberate local investigation."

