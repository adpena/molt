schema_version = 1

[meta]
source_doc = "docs/design/foundation/71_wasm_webgpu_numeric_acceleration.md"
authority = "target_feature_manifest"
description = "Target/profile feature ceilings and probe-gated acceleration facts."

[[feature]]
id = "native.scalar"
domain = "native"
tier = "scalar"
determinism = "deterministic"
description = "Native scalar machine instructions for proven typed scalar paths."

[[feature]]
id = "native.vector"
domain = "native"
tier = "vector"
determinism = "deterministic"
description = "Native vector instruction lowering for proven vectorizable kernels."

[[feature]]
id = "native.threads"
domain = "native"
tier = "parallel"
determinism = "deterministic"
description = "Native threading and atomics under platform/runtime support."

[[feature]]
id = "numeric.blas"
domain = "external_numeric"
tier = "blas"
determinism = "external_numeric"
description = "BLAS symbol closure through provider libraries or source-recompiled target custody."

[[feature]]
id = "numeric.lapack"
domain = "external_numeric"
tier = "lapack"
determinism = "external_numeric"
description = "LAPACK symbol closure through provider libraries or source-recompiled target custody."

[[feature]]
id = "numeric.gsl"
domain = "external_numeric"
tier = "gsl"
determinism = "external_numeric"
description = "GSL symbol closure with explicit license and per-target source/artifact custody."

[[feature]]
id = "tensor.typed_strided_storage"
domain = "tensor"
tier = "storage"
determinism = "deterministic"
description = "One dtype/shape/stride/offset/owner/device storage identity projected into target APIs."

[[feature]]
id = "wasm.mvp"
domain = "wasm"
tier = "core"
determinism = "deterministic"
description = "Baseline WebAssembly core module support."

[[feature]]
id = "wasm.multi_value"
domain = "wasm"
tier = "core"
determinism = "deterministic"
description = "Multi-value returns for small tuple/error-value internal ABI results."

[[feature]]
id = "wasm.tail_call"
domain = "wasm"
tier = "core"
determinism = "deterministic"
description = "Tail-call proposal lowering for tail-position control flow."

[[feature]]
id = "wasm.exception_handling"
domain = "wasm"
tier = "core"
determinism = "deterministic"
description = "WASM exception handling for Python unwind traffic."

[[feature]]
id = "wasm.memory64"
domain = "wasm"
tier = "memory"
determinism = "deterministic"
description = "64-bit linear-memory and table indexes for large-memory profiles."

[[feature]]
id = "wasm.threads"
domain = "wasm"
tier = "parallel"
determinism = "deterministic"
description = "Shared-memory threading support."

[[feature]]
id = "wasm.atomics"
domain = "wasm"
tier = "parallel"
determinism = "deterministic"
description = "WASM atomics for shared-memory profiles."

[[feature]]
id = "wasm.simd128"
domain = "wasm"
tier = "vector"
determinism = "deterministic"
description = "Deterministic v128 SIMD lane for numeric kernels."

[[feature]]
id = "wasm.relaxed_simd"
domain = "wasm"
tier = "vector"
determinism = "non_bit_exact"
description = "Relaxed SIMD speed tier; not allowed in bit-exact parity lanes."

[[feature]]
id = "wasm.flexible_vectors"
domain = "wasm"
tier = "vector"
determinism = "deterministic"
description = "Flexible vector proposal tracking."

[[feature]]
id = "wasm.half_precision"
domain = "wasm"
tier = "numeric"
determinism = "deterministic"
description = "Half-precision proposal tracking."

[[feature]]
id = "wasm.wide_arithmetic"
domain = "wasm"
tier = "numeric"
determinism = "deterministic"
description = "Wide arithmetic proposal tracking for int/hash/crypto lowering."

[[feature]]
id = "wasm.gc"
domain = "wasm"
tier = "object_layout"
determinism = "deterministic"
description = "WasmGC closed-layout object profile."

[[feature]]
id = "wasm.reference_types"
domain = "wasm"
tier = "object_layout"
determinism = "deterministic"
description = "Reference types used with GC/object-layout profiles."

[[feature]]
id = "wasm.js_promise_integration"
domain = "wasm"
tier = "host_async"
determinism = "host_capability"
description = "JS Promise Integration for naturally async browser host calls."

[[feature]]
id = "wasi.preview1"
domain = "wasi"
tier = "host_abi"
determinism = "deterministic"
description = "WASI preview1 style host interface for current wasm-server lanes."

[[feature]]
id = "wasi.component_model"
domain = "wasi"
tier = "host_abi"
determinism = "deterministic"
description = "Component Model/WIT interface authority."

[[feature]]
id = "wasi.async_0_3"
domain = "wasi"
tier = "host_async"
determinism = "deterministic"
description = "WASI 0.3 async func, stream, and future primitives."

[[feature]]
id = "webgpu.api"
domain = "webgpu"
tier = "gpu"
determinism = "device_dependent"
description = "Browser WebGPU API availability through navigator.gpu and adapter/device probes."

[feature.browser_probe]
kind = "webgpu_api"
api = "navigator.gpu"
adapter = "navigator.gpu.requestAdapter()"
device = "adapter.requestDevice()"

[[feature]]
id = "webgpu.wgsl_storage_buffers"
domain = "webgpu"
tier = "gpu"
determinism = "deterministic"
description = "WGSL storage-buffer compute pipeline support."

[feature.browser_probe]
kind = "adapter_limits_and_shader_validation"
adapter_limits = ["maxStorageBufferBindingSize"]

[[feature]]
id = "webgpu.workgroup_memory"
domain = "webgpu"
tier = "gpu"
determinism = "deterministic"
description = "WGSL workgroup memory support."

[feature.browser_probe]
kind = "adapter_limits_and_shader_validation"
adapter_limits = [
  "maxComputeInvocationsPerWorkgroup",
  "maxComputeWorkgroupSizeX",
  "maxComputeWorkgroupSizeY",
  "maxComputeWorkgroupSizeZ",
  "maxComputeWorkgroupStorageSize",
]

[[feature]]
id = "webgpu.atomics"
domain = "webgpu"
tier = "gpu"
determinism = "deterministic"
description = "WebGPU/WGSL atomic operation support."

[feature.browser_probe]
kind = "shader_validation"

[[feature]]
id = "webgpu.f16"
domain = "webgpu"
tier = "gpu"
determinism = "deterministic"
description = "WebGPU shader-f16 feature."

[feature.browser_probe]
kind = "adapter_feature"
adapter_feature = "shader-f16"

[[feature]]
id = "webgpu.subgroups"
domain = "webgpu"
tier = "gpu"
determinism = "deterministic"
description = "WebGPU subgroup operation support."

[feature.browser_probe]
kind = "adapter_feature"
adapter_feature = "subgroups"

[[feature]]
id = "webgpu.timestamp_queries"
domain = "webgpu"
tier = "observability"
determinism = "observability"
description = "Timestamp query observability; never a semantic fact."

[feature.browser_probe]
kind = "adapter_feature"
adapter_feature = "timestamp-query"
observability = true

[[feature]]
id = "webnn.graph"
domain = "webnn"
tier = "nn_graph"
determinism = "device_dependent"
description = "WebNN graph execution for admitted inference subgraphs."

[feature.browser_probe]
kind = "webnn_api"
api = "navigator.ml"
context = "navigator.ml.createContext()"

