# Degrade-to-slow registry -- single authority for the "silent degrade-to-slow"
# metabug enforcement gate (tools/degrade_to_slow_gate.py).
#
# THE METABUG (what the gate makes un-regrowable):
#   A perf/capability path (parallelism, caching, incremental reuse, fast-path
#   lowering) that SILENTLY degrades to a naive path on a HANDLEABLE input, with
#   no diagnostic and no test proving the fast path is taken on the hard input.
#
# DISTINCT from sound conservatism: a bail that over-approximates for
# CORRECTNESS (splitting an import cycle across workers would change results;
# a compile-time budget that prevents embedding megabytes of constants) is not
# a metabug. Those are frozen as `sound_keep` with a real justification and are
# NOT required to emit a diagnostic or carry a fast_path_test.
#
# CLASSIFICATIONS:
#   metabug_fix_pending -- a real silent degrade on a handleable input. Being
#       fixed in a parallel arc. Requires a `fast_path_test` id (the test the
#       fixing arc will add that proves the fast path is taken on the hard
#       input). Counted by the ratchet: the count is monotonically
#       non-increasing against the stored baseline. Reclassify to make_loud or
#       sound_keep (never invent) once the fix lands.
#   make_loud -- a degrade that is acceptable ONLY because it emits a loud
#       diagnostic before falling back. The gate statically proves a diagnostic
#       emit is reachable at the site. Requires a `fast_path_test` id.
#   sound_keep -- a correctness/cost bail that is NOT a metabug. Frozen with a
#       real justification. No diagnostic or fast_path_test required. Changing
#       one of these to a silent perf degrade is caught because the row's
#       justification no longer matches the code the anchor names.
#
# Every degrade site discovered by the gate scan MUST have a row here. A newly
# introduced unregistered degrade site FAILS the gate (drift teeth). This is
# the same "one authority, drift-gated" shape as the op-kind / intrinsic
# manifest gates.

[meta]
# Ratchet baseline: the number of metabug_fix_pending rows allowed. The gate
# fails if the live count EXCEEDS this. Lower it (never raise it) as each
# pending site is fixed and reclassified. Raising it requires an explicit,
# reviewed edit -- that is the ratchet.
metabug_fix_pending_baseline = 0


# =============================================================================
# metabug_fix_pending -- real silent degrades, fix owned by a parallel arc.
