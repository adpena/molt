classification = "sound_keep"
justification = """
On a genuine parallel-worker ERROR the pipeline re-lowers only the modules that
did not complete, keeping the pool for later layers (or recreating it once if
the pool is genuinely broken). This is (a) recovery from a real error, not a
degrade on a handleable-normal input, AND (b) LOUD -- it appends
`Frontend parallel worker error isolated to module; re-lowering it serially...`
or `Frontend parallel worker pool broke; recreating pool...` to warnings. A
worker crash is not a handleable input the fast path was supposed to absorb, so
this is sound error recovery, not the metabug. (Kept as sound_keep rather than
make_loud because the trigger is an error, not a normal hard input.)
"""

