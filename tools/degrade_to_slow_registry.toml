Loop-invariant code motion hoists to a fixpoint (a value hoisted out of an
inner loop may become invariant in the outer loop and hoist again). The
fixpoint is a correctness/completeness property of the transform, not a
budget-limited fast/slow choice. The safety checks in licm/safety.rs are
soundness guards (do not hoist may-raise / effectful ops), which is exactly the
kind of over-approximation the gate must NOT flag. Frozen.
"""

