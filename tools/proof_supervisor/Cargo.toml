[package]
name = "molt-proof-supervisor"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

# This is a bootstrap/developer tool, deliberately isolated from Molt's runtime
# workspace so normal workspace builds never acquire a proof-control-plane
# dependency or ship it to end users.
[workspace]

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
