tiers = ["pre-push", "pr", "main"]
resource_class = "compiler-build-resource"
timeout_budget = "integration"
cache_domain = "cargo-workspace"
dependencies = []
# Correctness-only host build: cold dependency optimization dominated the proof
# window. Keep generated-program optimization unchanged; measure total build and
# test time separately from optimized-host compiler performance.
# Retain Cargo unit timings in the run-owned target for critical-path profiling;
# process-custody event sequence numbers are not wall-clock timestamps.
# Pass and WASM libtests belong to their own partition, not repeated here.
# Object-model identity and split ABI witnesses share this compiler contract.
# Its Criterion dev dependency builds alloca target C even for libtests.
argv = ["cargo", "test", "--locked", "--timings", "--profile", "dev-fast", "--config", "profile.dev-fast.package.cranelift-codegen.opt-level=0", "--no-fail-fast", "--lib", "--bins", "--test", "generated_artifact_custody", "--test", "ir_contract_validation", "--test", "generated_object_abi_link", "--test", "native_artifact_facts", "-p", "molt-artifact-publish", "-p", "molt-codegen-abi", "-p", "molt-lang-obj-model", "-p", "molt-ir", "-p", "molt-tir", "-p", "molt-backend", "-p", "molt-backend-native", "-p", "molt-backend-luau", "-p", "molt-backend-rust", "--no-default-features", "--features", "molt-backend/native-backend,molt-backend/wasm-backend,molt-backend/luau-backend,molt-backend/rust-backend", "--", "--include-ignored", "--skip", "arith_codegen_golden_capture", "--nocapture", "--test-threads=1"]
