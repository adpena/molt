# Frontend IR determinism: each case recompiles a program in fresh
# interpreters (several hash seeds, both parse codecs, a midend wall-clock
# budget) and requires byte-identical IR. The 145 cases take 140 s at -n 4 on
# an M-series Mac and took 878 s on the hosted runner (Nightly run
# 37947710312), too slow for the PR unit job. It needs no build, so it runs
# beside the build chain.
[[command]]
id = "nightly.determinism.ir-hashseed"
family = "nightly_determinism"
cell = "linux-x86_64-py312-native-dev"
tiers = ["scheduled"]
resource_class = "scheduled-suite"
timeout_seconds = 1800
cache_domain = "pytest"
dependencies = []
argv = ["uv", "run", "--python", "3.12", "python", "-m", "pytest", "-q", "-n", "auto"]
pytest = ["tests/determinism/test_ir_determinism.py"]
pytest_worker_memory_gb = 0.75
toolchains = ["python", "uv"]


[[scheduled_family]]
name = "nightly_determinism"
