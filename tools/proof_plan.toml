name = "python_tooling"
description = "Python compiler, developer tooling, and smoke-contract proof."
inputs = [".github/workflows/ci.yml", ".pre-commit-config.yaml", ".python-version", "pyproject.toml", "uv.lock", "src/**", "tests/**", "tools/**"]
executor = "github-job"
workflow = ".github/workflows/ci.yml"
job = "python-tooling-smoke"
tiers = ["pre-push", "pr", "main"]
required = true
timeout_minutes = 25
memory_class = "medium"
cache_domain = "python-dev"
artifact_schema = "molt.proof-result.v1"
zero_work_policy = "fail"
dependencies = []
resource_class = "python-tests"
targets = ["native"]
backends = ["python-tooling"]
profiles = ["dev"]
python_versions = ["3.12"]
operating_systems = ["ubuntu"]
architectures = ["x86_64"]

