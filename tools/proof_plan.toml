toolchains = ["python", "uv"]

# Owner rule: every pin tracks its upstream's newest clean release that has
# been public for 7 days, and takes an advisory fix at once through a dated
# exemption. The scheduled run fails while any pin trails that target or is
# younger than 7 days without a record, and while a release-age exemption is
# malformed or has aged out; it reports a release still waiting on age. Lock
# advisories belong to `security.lock-audit`. `tools/pin_freshness.py
# --update` moves a tool_releases.toml tool with verified digests.
[[command]]
id = "security.pin-freshness"
family = "python_security"
cell = "linux-x86_64-py312-python-audit"
tiers = ["scheduled"]
resource_class = "network-audit"
timeout_seconds = 300
cache_domain = "uv"
dependencies = []
argv = ["uv", "run", "python3", "tools/pin_freshness.py", "--check"]
toolchains = ["python", "uv"]

