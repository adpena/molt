max_parallel = 4

[[resource_policy]]
name = "scheduled-suite"
max_parallel = 4

[[resource_policy]]
name = "wasm-runtime"
max_parallel = 2

# Toolchain contracts are executable receipt policy, not advisory metadata.
# Every command names the exact subset it consumes; setup evidence keeps the
# workflow/file projections pinned to the same version authority.
[[toolchain_policy]]
name = "python"
executable = "{python}"
version_args = ["--version"]
version_pattern = '^Python 3\.12\.15$'
setup_value = "3.12.15"
setup_evidence = [".python-version::3.12.15", ".github/actions/setup-project/action.yml::bash .github/actions/setup-project/provision-python.sh"]

[[toolchain_policy]]
name = "bash"
executable = "bash"
version_args = ["--version"]
# Completion probes exercise the hosted shells; capture their exact images and versions.
setup_value = "Ubuntu hosted shell package"
version_pattern = '^GNU bash, version [0-9]+\.[0-9]+\.'
setup_evidence = [".github/workflows/ci.yml::Install completion test shells"]

[[toolchain_policy]]
name = "fish"
executable = "fish"
version_args = ["--version"]
# Completion probes exercise the hosted shells; capture their exact images and versions.
setup_value = "Ubuntu hosted shell package"
version_pattern = '^fish, version [0-9]+\.[0-9]+\.'
setup_evidence = [".github/workflows/ci.yml::Install completion test shells"]

[[toolchain_policy]]
name = "zsh"
executable = "zsh"
version_args = ["--version"]
# Completion probes exercise the hosted shells; capture their exact images and versions.
setup_value = "Ubuntu hosted shell package"
version_pattern = '^zsh [0-9]+\.[0-9]+'
setup_evidence = [".github/workflows/ci.yml::Install completion test shells"]

[[toolchain_policy]]
name = "source-extension"
identity_provider = "source-extension"
version_pattern = '^molt-source-extension-toolchain-v4$'
dependencies = ["git"]
setup_evidence = [
  "src/molt/cli/source_extension_toolchain.py::_resolve_source_extension_toolchain",
]

[[toolchain_policy]]
name = "uv"
executable = "uv"
version_args = ["--version"]
version_pattern = '^uv 0\.12\.23\b'
setup_value = "0.12.23"
setup_evidence = [
  ".github/actions/setup-project/action.yml::version: \"0.12.23\"",
]

[[toolchain_policy]]
name = "node"
executable = "node"
version_args = ["--version"]
version_pattern = '^v26\.11\.1$'
setup_value = "26.11.1"
setup_evidence = [
  "config/tool_releases.toml::version = \"26.11.1\"",
  ".github/actions/setup-project/action.yml::uses: actions/setup-node@",
  ".github/workflows/formal.yml::node-version: pinned",
]

[[toolchain_policy]]
name = "rustc"
executable = "rustc"
fingerprint_domain = "rustup"
version_args = ["--version", "--verbose"]
content_path_command = ["rustup", "which", "rustc"]
linker_process_helpers = { "link.exe" = ["vctip.exe"] }
linker_build_tools = { "link.exe" = { "cl.exe" = "rust-build-c-compiler", "lib.exe" = "rust-build-archiver" } }
version_pattern = '^rustc 1\.99\.0\b'
setup_value = "1.99.0"
setup_evidence = [
  "rust-toolchain.toml::channel = \"1.99.0\"",
  ".github/actions/setup-project/action.yml::python3 -I -B .github/actions/setup-project/provision-rust.py",
  ".github/actions/setup-project/action.yml::steps.inputs.outputs.rust-toolchain",
]

[[toolchain_policy]]
name = "lune"
executable = "lune"
version_args = ["--version"]
version_pattern = '^lune 0\.10\.5$'
setup_value = "0.10.5"
