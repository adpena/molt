# =========================================================================
# GATE-LIFECYCLE REGISTRY (APPARATUS A9)
#
# Uniform warn->strict lifecycle for molt gates, mirroring pact's discipline:
# a gate lands WARN-ONLY with a NAMED, machine-checkable flip condition; a
# separate commit flips it once the condition is met. `tools/check_gate_flips.py`
# reports (and, with --check, fails on) any gate whose `strict_when` is met but
# is still `state = "warn"` -- the ratchet that ratchets the ratchets.
#
# `state`       : "warn" | "strict"
# `strict_when` : machine token (`live_count == 0`, `live_count <= N`,
#                 `landed_functional`) or free text (-> manual review)
# `count_detector`: optional checked-in detector ID producing `live_count`;
#                   argv and output schema live in check_gate_flips.py
# `rationale`   : why this state / flip condition
# =========================================================================

[[gate_flip]]
name = "gate_liveness_canary"
state = "strict"
strict_when = "landed_functional"
rationale = "check_gate_liveness must always fire on known-bad fixtures; a canary that cannot fire is worthless, so it lands strict."
# --- APPARATUS A4 memo->registry lint (warn-only; A9 [[gate_flip]] entry) ---
# Lands WARN-ONLY: molt carries an existing backlog of docs/agent + memory lines
# stating a measured finding (speedup / residual / bench / parity) with no
# finding_id reference. live_count = that backlog (findings_memo_lint.py --count).
# The count detector reports the backlog; no gate runs the warn mode. Flip = burn
# the backlog to zero (formalize each via tools/findings_registry.py + cite its
# finding_id, or waive the line with '# FORMALIZATION_PENDING:<why>'), set
# state = "strict" here, and add `findings_memo_lint.py --strict` as a landing gate.
[[gate_flip]]
name = "findings_memo_lint"
state = "warn"
strict_when = "live_count == 0"
count_detector = "findings_memo_lint"
rationale = "APPARATUS A4 memo->registry lint (warn-only; its count detector reports the backlog). A docs/agent or memory line stating a measured finding with no finding_id reference is un-formalized prose that will rot. live_count is the current backlog; flip to strict once it reaches zero."

# --- APPARATUS A10 memory-graph integrity (warn-only; A9 [[gate_flip]] entry) ---
# The memory corpus is a [[wikilink]] graph with an M## hook index resolved by
# POINTERS.md. `tools/check_memory_graph.py --check` REPORTS (a) dangling
# [[wikilinks]] -- which the memory system EXPLICITLY ALLOWS as "worth writing
# later", so they are never a failure -- and (b) any M## in MEMORY.md not
# resolved by POINTERS.md (a real index break). The warn-only check ALWAYS exits 0.
#
# strict_when is a MANUAL-REVIEW (free-text) token, NOT a machine `live_count ==
# 0`: the live corpus is Claude's auto-memory dir, which CI cannot see
# (discover_memory_dir -> None -> 0/0 in CI), so `live_count == 0` would be
# vacuously met in CI and falsely flagged should-flip. Only the operator, looking
# at the real corpus, can decide to tighten (add a landing gate running
# `check_memory_graph.py --strict`, which fails on unresolved M## while danglers
# stay warn-only even then). count_detector remains for the visible live count.
[[gate_flip]]
name = "memory_graph_integrity"
state = "warn"
strict_when = "manual: unresolved M## sustained at 0 on the live auto-memory corpus AND dangling-link triage reviewed (operator-box only; CI cannot see the corpus)"
count_detector = "memory_graph_integrity"
rationale = "APPARATUS A10 memory-graph integrity (warn-only). Reports dangling [[wikilinks]] (ALLOWED) + unresolved MEMORY.md M## (index break). Free-text manual strict_when because CI cannot see the auto-memory corpus; flip is an operator decision made against the live corpus."

# --- APPARATUS Wave 4 A11 claims/preflight/serializer (self-tests land strict) ---
# The three A11 tools ship falsifiable `--check` self-tests + gate-liveness
# canaries (a FALSIFIED row must be RETIRED; check_sister_landed must return
# 8/9/0; the serializer must refuse -A / a stale sha). Those self-tests land
# FUNCTIONAL/strict -- they are additive and can only fail on a genuine
# classifier rot -- so `landed_functional` marks them (no flip pending).
[[gate_flip]]
name = "claims_status_self_test"
state = "strict"
strict_when = "landed_functional"
rationale = "APPARATUS A11 (the claims_status --check landing gate). The terminal/stale classifier's falsifiable --check lands strict: it only fails if a FALSIFIED/SUPERSEDED/... row stops classifying RETIRED or a stale CLAIMED stops classifying STALE (M34/M42). Additive; nothing to flip."

[[gate_flip]]
name = "check_sister_landed_self_test"
state = "strict"
strict_when = "landed_functional"
rationale = "APPARATUS A11 (the check_sister_landed --check landing gate). The premise-verification classifier's falsifiable --check lands strict: it only fails if 8 (landed) / 9 (mid-flight) / 0 (clean) precedence rots. Additive; nothing to flip."

[[gate_flip]]
name = "commit_serializer_self_test"
state = "strict"
strict_when = "landed_functional"
rationale = "APPARATUS A11 (the commit_serializer --check landing gate). The named-files-only / expected-sha guard's falsifiable --check lands strict: it only fails if a sweep pathspec (-A / . / *) or a stale sha stops being refused. Additive; nothing to flip."

# --- APPARATUS A11 claims-custody stale report (warn-only; A9 [[gate_flip]]) ---
# `tools/claims_status.py` (warn-only) reports live/retired/stale CLAIMS counts and FLAGS any stale
# CLAIMED lane (no fresh PROGRESS for > 4h). It ALWAYS exits 0: staleness is
# advisory, NEVER a hard CI failure -- a silent worktree may still be alive, so
# CLAIMS.md 6 requires an OBJECTIVE-liveness check before any RECLAIM, which CI
# cannot perform. strict_when is therefore a MANUAL-REVIEW free-text token (like
# memory_graph_integrity), not a machine `live_count == 0`: the operator, seeing
# the real worktrees/queue, decides any RECLAIM. count_detector exposes the live
# stale count for the human-visible report.
[[gate_flip]]
name = "claims_status_stale"
state = "warn"
strict_when = "manual: a stale CLAIMED lane is advisory only (CLAIMS.md 6 objective-liveness bar); CI cannot prove a silent worktree dead, so this never flips to a hard fail -- the operator drives any RECLAIM"
count_detector = "claims_status_stale"
rationale = "APPARATUS A11 claims-custody stale flag (warn-only). Reports live/retired/stale counts so stale custody cannot silently block a lane, but staleness is never a hard failure: CLAIMS.md 6 needs objective-liveness evidence CI does not have. Free-text manual strict_when; the operator reclaims."

[[gate_flip]]
name = "lane_maturity_admission"
state = "strict"
strict_when = "landed_functional"
rationale = "A8 proof admission has pure teeth and a live known-bad wasm-below-L1 canary; registry faults remain loud fail-open."

[[gate_flip]]
name = "powerplay_variant_ii_acceptance"
state = "strict"
strict_when = "landed_functional"
rationale = "A12 strict decision refuses proxy, dev-profile, single-run, regression, and missing-memory evidence; legacy artifact auditing is advisory-loud."

[[gate_flip]]
name = "retired_checkout_disk_reclaim"
state = "strict"
strict_when = "landed_functional"
rationale = "Worktree retirement reclaims the removed checkout's state at once; pure lock and protection teeth, a real-worktree event path, and a liveness canary keep it."

