family = "platform_portability"
cell = "macos-arm64-py312-rust-native-dev"
tiers = ["pr", "main"]
resource_class = "compiler-build-resource"
# Whole-workspace lint on the primary development host: every lib, bin, test,
# bench and example target type-checks and lints on aarch64-apple-darwin, so
# LP64/Mach-O drift surfaces in CI instead of on a developer's machine. Cold
# macos-14 timing is unmeasured; the suite budget keeps headroom over the
# 240-second Linux cross-check for the same command.
timeout_budget = "suite"
cache_domain = "cargo-workspace"
dependencies = []
argv = ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--", "-D", "warnings"]
toolchains = ["rustc", "cargo"]

[[command]]
id = "portability.rust.linux-aarch64.clippy-workspace"
cargo_native_units = { target = ["c", "c++"] }
family = "platform_portability"
cell = "linux-aarch64-py312-rust-native-dev"
tiers = ["pr", "main"]
resource_class = "compiler-build-resource"
# aarch64 Linux is the one supported host where C `char` is unsigned and the
# target baseline lacks the CRC extension, so same-type casts and
# `#[target_feature]` inlining errors surface only here. Measured 81 s with
# warm dependencies on a 6-CPU aarch64 VM; the suite budget covers a cold
# dependency build on the 4-CPU hosted runner. Standard arm runners are free
# for this public repository.
timeout_budget = "suite"
cache_domain = "cargo-workspace"
dependencies = []
argv = ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--", "-D", "warnings"]
toolchains = ["rustc", "cargo"]

