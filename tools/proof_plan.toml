# The whole CLI import-collection file (804 tests, about 580 s on hosted Linux
# at -n 2). Its build-pipeline tests read rustc and cargo identity from PATH;
# the five that validate WASM with the pinned wasm-tools run in
# wasm.host.runner-fixtures, which provisions that tool (HF-160). It runs in
# its own Linux job: its process tree peaks at 4.97 GB at -n 2, above the
# 3.3 GB the 7 GB macOS runner had free, so the guard stopped it there even
# alone (run 38094633303; HF-170 owns the test memory, HF-68 the runner).
[[command]]
id = "python.unit.cli.import-collection"
family = "python_unit_collection"
cell = "linux-x86_64-py312-unit-collection"
tiers = ["pr", "main"]
resource_class = "python-tests"
