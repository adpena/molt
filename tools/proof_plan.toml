job = "conformance-aggregate"
tiers = ["scheduled"]
timeout_minutes = 15
# Declared allowance retained from the existing job slack; not measured.
job_reserve_seconds = 300
resource_class = "scheduled-suite"
sharded_program = "conformance"
shard_count = 8
# A shard job's budget; the shard stops itself shard_overhead_seconds earlier
# so its evidence is published before the job is killed.
shard_timeout_minutes = 60
shard_overhead_seconds = 600

[[scheduled_family]]
name = "nightly_differential"
description = "Full basic and stdlib differential corpus aggregated from sixteen exact digest-bound shards."
