# proof_plan.toml — the sole path-to-proof policy authority.
#
# CI families, local integration rules, and strict-flip proof authorities live
# together here.  Generated workflow matrices and documentation are derived by
# tools/gen_proof_plan.py; event selection is performed by tools/proof_plan.py.
# Workflows retain only executor mechanics.  Do not add path classifiers to
# workflow YAML or another tool.

schema = "molt.proof-plan.v3"

authority_inputs = [
  ".gitattributes",
  ".github/actions/setup-lean/action.yml",
  ".github/actions/setup-llvm/action.yml",
  ".github/actions/setup-project/action.yml",
  ".github/workflows/ci.yml",
  ".github/workflows/formal.yml",
  ".github/workflows/molt-wasm-ci.yml",
  ".github/workflows/nightly.yml",
  ".github/workflows/security_hardening.yml",
  ".gitignore",
  ".python-version",
  "config/ci_resource_policy.toml",
  "config/actionlint.toml",
  "config/reproducibility_corpus.toml",
  "config/llvm_toolchain_releases.toml",
  "formal/lean/lean-toolchain",
  "rust-toolchain.toml",
  "src/molt/dx.py",
  "src/molt/cargo_execution_policy.py",
  "src/molt/process_guard.py",
  "src/molt/llvm_toolchain.py",
  "tools/artifact_publish.py",
  "tools/check_generator_manifest.py",
  "tools/check_cargo_test_truth.py",
  "tools/ff_land.py",
  "tools/proof_plan.py",
  "tools/proof_plan.toml",
  "tools/gen_proof_plan.py",
  "tools/generator_io.py",
  "tools/proof_queue_pkg/evidence.py",
  "tools/proof_queue_pkg/custody.py",
  "tools/proof_queue_pkg/diagnostics.py",
  "tools/proof_queue_pkg/state.py",
  "tools/check_subprocess_guard_coverage.py",
  "tools/command_execution.py",
  "tools/cargo_test_binary_runner.py",
  "tools/generator_manifest.toml",
  "tools/guarded_exec.py",
  "tools/harness_memory_guard.py",
  "tools/import_file.py",
  "tools/memory_guard.py",
  "tools/process_sentinel.py",
  "tools/process_spawn.py",
  "tools/run_cargo_test_truth.py",
  "tools/pytest_truth_plugin.py",
  "tests/test_proof_plan.py",
  "tests/process_guard_common.py",
  "tests/native_process_guard.py",
  "tests/wasm_linked_runner.py",
  "tests/test_ci_workflow_topology.py",
  "tests/test_generator_manifest.py",
  "tests/tools/test_cargo_test_truth.py",
  "tests/tools/test_pytest_truth_plugin.py",
]

# Gates that run for any non-empty local integration change.
always = [
  "python3 tools/venv_exec.py python -m ruff check .",
  "python3 tools/venv_exec.py python -m ruff format --check .",
  "python3 tools/venv_exec.py python tools/check_rust_toolchain.py",
  "python3 tools/venv_exec.py python tools/check_rustfmt.py --changed",
]

receipt_schema = "molt.proof-receipt.v2"

# One deterministic DAG executor owns command admission. The global ceiling
# bounds process fanout; each resource policy additionally serializes or limits
# commands that share mutable toolchain/build state.
executor_max_workers = 4

[[resource_policy]]
name = "compiler-build-resource"
max_parallel = 1

[[resource_policy]]
name = "formal-tools"
max_parallel = 2

[[resource_policy]]
name = "network-audit"
max_parallel = 2

[[resource_policy]]
name = "python-static"
max_parallel = 1

[[resource_policy]]
name = "python-tests"
max_parallel = 2

[[resource_policy]]
name = "repository-policy"
max_parallel = 4

[[resource_policy]]
name = "wasm-runtime"
max_parallel = 2

# Toolchain contracts are executable receipt policy, not advisory metadata.
# Every command names the exact subset it consumes; setup evidence keeps the
# workflow/file projections pinned to the same version authority.
[[toolchain_policy]]
name = "python"
executable = "{python}"
version_args = ["--version"]
version_pattern = '^Python 3\.12\.'
setup_value = "3.12"
setup_evidence = [".python-version::3.12"]

[[toolchain_policy]]
name = "uv"
executable = "uv"
version_args = ["--version"]
version_pattern = '^uv 0\.11\.24\b'
setup_value = "0.11.24"
setup_evidence = [
  ".github/actions/setup-project/action.yml::version: \"0.11.24\"",
]

[[toolchain_policy]]
name = "node"
executable = "node"
version_args = ["--version"]
version_pattern = '^v24\.16\.0$'
setup_value = "24.16.0"
setup_evidence = [
  ".github/actions/setup-project/action.yml::actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
  ".github/workflows/formal.yml::node-version: \"24.16.0\"",
]

[[toolchain_policy]]
name = "rustc"
executable = "rustc"
fingerprint_domain = "rustup"
version_args = ["--version", "--verbose"]
content_path_command = ["rustup", "which", "rustc"]
