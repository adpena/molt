# The finally-pending observer proof checks each target against one CPython
# oracle. Each target is a separate row with its own budget: in CI run
# 38152757625 the combined test took 547 s (native build 269 s, WASM build
# 189 s, WASM run 85 s); on a runner about 1.4x slower (run 38152941765) it
# hit the 600 s limit inside the WASM build. Each leg still builds one
# program-specific runtime that no prebuild can supply: the native runtime
# adds the `source_extension_loader` feature (60 s of Cargo), and the WASM
# runtime compiles the extension's C-API exports into molt-runtime (48 s of
# Cargo). The shared-runtime prebuild still warms the wasm32 dependency graph.
# Each row names the whole file and selects its own target with `-k`.
[[command]]
id = "wasm.test.finally-pending-observer-parity.native"
cargo_native_units = { target = ["c", "c++"] }
family = "wasm"
cell = "linux-x86_64-py312-wasm-dev"
tiers = ["pr", "main"]
resource_class = "compiler-build-resource"
timeout_budget = "integration"
timeout_env = ["MOLT_CARGO_TIMEOUT", "MOLT_WASM_TEST_TIMEOUT_SEC"]
cache_domain = "pytest"
dependencies = ["wasm.build.native-backend"]
argv = ["python3", "tools/venv_exec.py", "python3", "-m", "pytest", "-q", "-k", "native"]
pytest = ["tests/test_finally_pending_observer_parity.py"]
toolchains = ["python", "uv", "rustc", "cargo", "clang", "llvm-config", "ld.lld", "lld-link"]

[[command]]
id = "wasm.test.finally-pending-observer-parity.wasm"
family = "wasm"
cell = "linux-x86_64-py312-wasm-dev"
tiers = ["pr", "main"]
resource_class = "compiler-build-resource"
timeout_budget = "integration"
timeout_env = ["MOLT_CARGO_TIMEOUT", "MOLT_WASM_TEST_TIMEOUT_SEC"]
cache_domain = "pytest"
dependencies = ["wasm.build.backend", "wasm.build.host", "wasm.build.shared-runtime"]
argv = ["python3", "tools/venv_exec.py", "python3", "-m", "pytest", "-q", "-k", "wasm"]
pytest = ["tests/test_finally_pending_observer_parity.py"]
toolchains = ["python", "uv", "rustc", "cargo", "clang", "llvm-config", "ld.lld", "lld-link", "wasm-ld", "wasm-tools", "wasi-clang", "wasm-opt"]

