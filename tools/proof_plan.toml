# Tiers are enforced per CI event (tools/proof_plan.py active_tier): pull
# requests run `pr`, pushes and the merge queue run `main`, the scheduled
# workflow runs `nightly`. Whole-suite end-to-end, benchmark and proof-queue
# real-execution commands are `main`-only so pull requests stay fast.

# The local driver activates the selected project environment for every gate.
# Use portable Python directly; standalone proof commands retain their own
# declared interpreter/version custody.
# Gates that run for any non-empty local integration change: whole-repository
# checks, so `tools/molt_dev.py integrate` lands nothing CI's repository-policy
# family would reject. The full generator gate owns reproducible freshness;
# rules add semantic checks and owning tests without repeating named generators.
# Local gates may use {integration_upstream_commit} as a whole commit or
# BASE..HEAD argument. The driver binds its validated fetched full SHA, so
# --remote/--branch select the same immutable base for every consumer.
always_toolchains = ["python", "git", "generators"]
always = [
  "python -m ruff check .",
  "python -m ruff format --check .",
  "python tools/check_rust_toolchain.py",
  "python tools/check_rustfmt.py --changed --base {integration_upstream_commit}",
  "python tools/generators.py check",
  "python tools/check_environment_registry.py --check",
  "python tools/check_test_ownership.py --check",
  "python tools/check_generator_manifest.py --check",
