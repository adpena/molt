# Toolchain contracts are executable receipt policy, not advisory metadata.
# Every command names the exact subset it consumes; setup evidence keeps the
# workflow/file projections pinned to the same version authority.
[[toolchain_policy]]
name = "python"
executable = "{python}"
version_args = ["--version"]
version_pattern = '^Python 3\.12\.15$'
setup_value = "3.12.15"
setup_evidence = [".python-version::3.12.15", ".github/actions/setup-project/action.yml::bash .github/actions/setup-project/provision-python.sh"]

[[toolchain_policy]]
name = "bash"
executable = "bash"
version_args = ["--version"]
# Completion probes exercise the hosted shells; capture their exact images and versions.
setup_value = "Ubuntu hosted shell package"
version_pattern = '^GNU bash, version [0-9]+\.[0-9]+\.'
setup_evidence = [".github/workflows/ci.yml::Install completion test shells"]

[[toolchain_policy]]
name = "fish"
executable = "fish"
version_args = ["--version"]
# Completion probes exercise the hosted shells; capture their exact images and versions.
setup_value = "Ubuntu hosted shell package"
version_pattern = '^fish, version [0-9]+\.[0-9]+\.'
setup_evidence = [".github/workflows/ci.yml::Install completion test shells"]

[[toolchain_policy]]
name = "zsh"
executable = "zsh"
version_args = ["--version"]
# Completion probes exercise the hosted shells; capture their exact images and versions.
setup_value = "Ubuntu hosted shell package"
version_pattern = '^zsh [0-9]+\.[0-9]+'
setup_evidence = [".github/workflows/ci.yml::Install completion test shells"]

[[toolchain_policy]]
name = "source-extension"
identity_provider = "source-extension"
version_pattern = '^molt-source-extension-toolchain-v4$'
dependencies = ["git"]
setup_evidence = [
  "src/molt/cli/source_extension_toolchain.py::_resolve_source_extension_toolchain",
]

# Differential subprocess and platform oracles consume these hosted POSIX
# images. There is no portable version banner for sh/echo/true/uname: these
# probes establish successful behavior, while captured file bytes own identity.
# /bin/sh is the consumer-selected shell, independent of PATH or login shell.
[[toolchain_policy]]
name = "posix-sh"
executable = "/bin/sh"
version_args = ["-c", ":"]
version_pattern = '^$'
setup_value = "host POSIX shell"
setup_evidence = ["src/molt/stdlib/subprocess.py::/bin/sh"]

[[toolchain_policy]]
name = "posix-echo"
executable = "echo"
version_args = ["molt-proof-probe"]
version_pattern = '^molt-proof-probe$'
setup_value = "host POSIX utility"
setup_evidence = ["tests/differential/stdlib/subprocess_basic_run.py::subprocess.run"]

[[toolchain_policy]]
name = "posix-true"
executable = "true"
version_args = ["molt-proof-probe"]
version_pattern = '^$'
setup_value = "host POSIX utility"
setup_evidence = ["tests/differential/stdlib/subprocess_basic_run.py::subprocess.check_call"]

[[toolchain_policy]]
name = "posix-uname"
executable = "uname"
version_args = ["-s"]
version_pattern = '^.+$'
setup_value = "host POSIX utility"
setup_evidence = ["tests/differential/stdlib/platform_basic.py::platform.processor"]

[[toolchain_policy]]
name = "posix-file"
executable = "file"
version_args = ["--version"]
version_pattern = '^file-[0-9]+\.'
setup_value = "host file utility"
# CPython platform.platform() queries executable architecture on macOS.
setup_evidence = ["tests/differential/stdlib/platform_basic.py::platform.platform"]

