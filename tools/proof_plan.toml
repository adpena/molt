# Every executable partition has a stable command identity, exact matrix cell,
# bounded timeout, resource class, and DAG parents. Workflows invoke these IDs;
# command spelling is never duplicated in YAML.
[[command]]
id = "portability.queue.linux"
family = "platform_portability"
cell = "linux-x86_64-py312-queue-portability"
tiers = ["pr", "main"]
resource_class = "python-tests"
timeout_seconds = 600
cache_domain = "pytest"
dependencies = []
argv = ["uv", "run", "--active", "--project", ".", "--no-sync", "python", "-m", "pytest", "-q", "tests/test_dx_run_context.py", "tests/test_molt_queue_cli.py", "tests/tools/test_proof_queue.py", "tests/tools/test_scientific_stack_versions.py", "tests/cli/test_source_extension_producer.py"]
