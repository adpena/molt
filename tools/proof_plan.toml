[[matrix_cell]]
id = "linux-x86_64-rust-native-release"
runner = "ubuntu-latest"
os = "linux"
arch = "x86_64"
python = "none"
backend = "rust"
target = "x86_64-unknown-linux-gnu"
profile = "release"

# Explicit workflow_dispatch mode only; no changed-path or scheduled allocation.
[[scheduled_family]]
name = "runtime_candidate_costs"
description = "Controlled candidate-only numeric/list/shared-storage measurements; no comparative or release PASS."
workflow = ".github/workflows/perf-gate.yml"
job = "candidate-runtime-costs"
tiers = ["scheduled"]
timeout_minutes = 180
# Declared allowance retained from the existing job slack; not measured.
job_reserve_seconds = 1800
resource_class = "compiler-build-resource"

[[command]]
id = "runtime.cost.candidate"
cargo_native_units = { target = ["c", "c++"] }
family = "runtime_candidate_costs"
cell = "linux-x86_64-rust-native-release"
tiers = ["scheduled"]
resource_class = "compiler-build-resource"
timeout_budget = "shipping"
cache_domain = "cargo-workspace"
dependencies = []
evidence_outputs = ["proof-receipts/evidence/candidate-runtime-costs"]
argv = ["uv", "run", "--frozen", "python", "tools/run_candidate_runtime_costs.py"]
toolchains = ["python", "uv", "rustc", "cargo", "clang", "ld.lld"]

# Standalone C-API ownership and its C shims are a distinct link consumer.
[[rule]]
name = "cpython-abi-authorities"
toolchains = ["python", "rustc", "cargo"]
description = "C-API crate standalone link and unit contracts."
globs = [
  "runtime/molt-cpython-abi/**",
  "runtime/molt-cpython-abi-test-support/**",
]
gates = ["cargo test --locked --no-fail-fast --profile dev-fast -p molt-lang-cpython-abi --tests -- --test-threads=4"]

[[rule]]
name = "compression-stream-state"
toolchains = ["rustc", "cargo", "python"]
description = "Compression engine and bounded stream state use one small Cargo graph, with the existing native integer oracle."
globs = ["runtime/molt-runtime-compression/src/**/*.rs"]
gates = ["cargo test --locked --profile dev-fast --no-fail-fast -p molt-runtime-compression -p molt-lang-cpython-abi --lib --test test_numbers -- --test-threads=4"]

# Release work is mutable coordination metadata; proof recipes remain above.
[[rule]]
name = "release-work-state"
description = "Committed release facts and strict, explicitly declared outcome dependencies in canonical agent context."
globs = ["tools/agent_coordination.py", "tools/release_outcomes.py", "tests/test_agent_coordination.py", "tests/tools/test_release_outcomes.py"]
pytest = ["tests/test_agent_coordination.py", "tests/tools/test_release_outcomes.py"]
gates = []
toolchains = ["python", "uv"]
