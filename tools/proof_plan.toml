# Scheduled families are complete workflow jobs with typed commands and receipts,
# but they are intentionally outside changed-path CI admission. The workflow owns
# only setup and artifact transport; command spelling and DAG policy live here.
[[scheduled_family]]
name = "nightly_shard_prepare"
description = "One immutable native runtime, pinned CPython source, and digest-bound Nightly shard plan."
workflow = ".github/workflows/nightly.yml"
job = "nightly-prepare"
tiers = ["scheduled"]
timeout_minutes = 60
# Declared allowance retained from the existing job slack; not measured.
job_reserve_seconds = 300
resource_class = "scheduled-suite"

[[scheduled_family]]
name = "nightly_conformance"
description = "Full Molt conformance corpus aggregated from eight exact digest-bound shards."
