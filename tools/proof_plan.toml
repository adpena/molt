receipt_schema = "molt.proof-receipt.v4"

# Each modeled CI or scheduled job declares a positive job_reserve_seconds.
# It covers setup, identity capture, guard finalization and artifact transport
# outside command deadlines. CI allowances use observed run 37935929479 setup
# and post-proof elapsed time, rounded upward to whole minutes; scheduled
# allowances preserve existing declared slack. These are minimum allowances,
# not hard bounds on network provisioning or OS process cleanup. Headroom is
# calculated after the reserve. Child deadlines remain independently owned.
# One deterministic DAG executor owns command admission. The global ceiling
# bounds process fanout; each resource policy additionally serializes or limits
# commands that share mutable toolchain/build state.
executor_max_workers = 4

# Installed Python custody hashes a deterministic, locality-sorted file
# worklist in coarse batches. This bounds the I/O fanout independently from
# proof-command fanout; every pre/post scan still reads every admitted byte.
inventory_hash_workers = 12

