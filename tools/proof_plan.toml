# One cold `molt build` warms the backend and runtime through the CLI's own
# build lane, so the measured builds that follow start warm. A raw
# `cargo build -p molt-runtime` selects other features and no backend, so it
# warmed nothing a later `molt build` used: every first program build ran cold
# into its per-build timeout. A one-shot build starts no backend daemon to
# outlive it.
[[command]]
id = "nightly.determinism.compiler-prewarm"
cargo_native_units = { target = ["c", "c++"] }
