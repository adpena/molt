# The one Python and npm lock advisory authority: OSV for every version in
# uv.lock and the npm locks, accepted only by an ACCEPTED_ADVISORIES entry
# under an open ledger row. On every change an aged-out exemption is reported,
# not failed; the scheduled `security.pin-freshness` and `molt update` fail it.
