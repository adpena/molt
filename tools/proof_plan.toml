[[command]]
id = "rust.test.ir-wasm-runtime-authorities"
cargo_native_units = { target = ["c"] }
family = "rust"
cell = "linux-x86_64-rust-native-dev"
tiers = ["pre-push", "pr", "main"]
resource_class = "compiler-build-resource"
timeout_budget = "integration"
cache_domain = "cargo-workspace"
dependencies = []
# IR/pass and WASM consumer repair plus runtime ownership acceptance do not
# require native code generation. Keep the captured Node/WASM linker closure;
# the full compiler-authorities command separately owns native/Rust/Luau proofs.
# Libtest ORs these family filters. Do not include ignored runtime GC benchmarks.
# Public ownership/memory contracts link the ordinary pass library in a separate
# target; its tir:: namespace keeps the same family filter and proof custody.
# Select the raw C-symbol witness in the same compression-disabled runtime build;
# default-truth owns feature-enabled native and the two-cell WASM artifact target.
# Emit assertion detail immediately; a later fatal ownership check must not
