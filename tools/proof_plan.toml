[[toolchain_policy]]
name = "generators"
generator_manifest = "tools/generator_manifest.toml"

# The Acorn tree is a checkout input: admission provisions it from its lock
# through molt.checkout_provisioning, which also names its setup command.
[[toolchain_policy]]
name = "browser-acorn"
node_package = "acorn"
node_package_mode = "import"
package_lock = "tools/browser_asset_graph/package-lock.json"
checkout_input = "browser-acorn"
dependencies = ["node"]

# npm is a runtime tool release: `python -m molt.tool_releases run npm` runs
# its entrypoint on the pinned Node, so admission identifies it by that
# installation, never PATH. Each npm project's packageManager names the pin;
# `tools/pin_freshness.py --update npm` moves every literal below with it.
[[toolchain_policy]]
name = "npm"
projection = "runtime-tool-release"
setup_command = "python -m molt.tool_releases provision npm"
executable = "npm"
version_args = ["--version"]
version_pattern = '^12\.2\.1$'
setup_value = "12.2.1"
setup_evidence = [
  "config/tool_releases.toml::version = \"12.2.1\"",
  "deploy/cloudflare/package.json::\"packageManager\": \"npm@12.2.1\"",
  "examples/edgebox/packages/edgebox-cloudflare/package.json::\"packageManager\": \"npm@12.2.1\"",
  "tools/browser_asset_graph/package.json::\"packageManager\": \"npm@12.2.1\"",
]
dependencies = ["node"]

[[toolchain_policy]]
name = "edgebox-typescript"
node_package = "typescript"
package_lock = "examples/edgebox/packages/edgebox-cloudflare/package-lock.json"
checkout_input = "edgebox-typescript"
dependencies = ["node", "npm"]

