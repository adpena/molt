  "runtime/molt-backend-native/src/llvm_backend/lowering.rs",
  "runtime/molt-backend-native/src/llvm_backend/lowering/**/*.rs",
  "runtime/molt-backend-wasm/src/**/*.rs",
]
gates = [
  "python3 tools/gen_op_kinds.py --check",
  "python3 tools/audit_op_kinds.py --check",
]

# --- Frontend diagnostic authority --------------------------------------
[[rule]]
name = "frontend-diagnostics"
