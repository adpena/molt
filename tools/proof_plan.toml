# Contracts that compile and run programs (native `molt run` and WASM
# builds). Their workers peak at 2.4-3.0 GiB against 0.4 GiB for the
# Python-only surface contracts, so they declare their own unit.
[[command]]
id = "python.unit.compiled-contracts"
family = "python_unit"
cell = "linux-x86_64-py312-unit"
tiers = ["pre-push", "pr", "main"]
resource_class = "python-tests"
timeout_seconds = 600
cache_domain = "pytest"
dependencies = []
argv = ["uv", "run", "--python", "3.12", "python", "-m", "pytest", "-q", "-n", "auto", "-m", "not slow"]
pytest = ["tests/test_resource_enforcement_e2e.py", "tests/test_wasm_runtime_heavy_regressions.py"]
