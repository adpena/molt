# =========================================================================
# NAMED LANES: queue-owned proofs that run under host custody, not CI families.
#
# The exact argv is the child-process admission authority. A queue submission
# whose argv equals a named lane receives the lane's declared toolchain
# closure (every child image located for those toolchains is admitted);
# anything else that spawns processes is a leaf and is refused. Version and
# source selection stay in their own authorities (config/scientific_stack_
# versions.toml, config/source_extension_package_sets.toml, checkout custody);
# a named lane argv never carries a host path.
# =========================================================================

[[named_lane]]
cache_domain = "cargo-workspace"
id = "native.capability-cache-policy"
description = "Exercise native shared-code reuse across embedded capability policies and different application code-slot layouts, with actual compiled output and constituent-cache observations."
argv = ["uv", "run", "--active", "--project", ".", "--python", "3.12", "--no-sync", "--no-config", "python", "-m", "pytest", "-vv", "-s"]
pytest = ["tests/test_manifest_pipeline_e2e.py::test_native_warm_code_cache_keeps_current_capability_policy", "tests/test_manifest_pipeline_e2e.py::test_native_stdlib_objects_reuse_across_code_slot_layouts"]
toolchains = ["python", "uv", "rustc", "cargo", "ld.lld"]
cargo_native_units = { target = ["c", "c++"] }
resource_family = "native-build"
contention_key = "cargo-native-runtime"
timeout_seconds = 3600

[[named_lane]]
cache_domain = "none"
id = "runtime.lifecycle-cost-image"
description = "Build the full default-feature runtime libtest image for independent lifecycle measurements; no semantic or performance acceptance is implied."
argv = ["cargo", "test", "--locked", "--profile", "release-output", "-p", "molt-runtime", "--lib", "--no-run", "--message-format=json"]
toolchains = ["cargo", "rustc", "python"]
cargo_native_units = { target = ["c", "c++"] }
resource_family = "rust"
contention_key = "cargo-native-runtime"
timeout_seconds = 6300

[[named_lane]]
cache_domain = "cargo-workspace"
id = "runtime.allocation-observer"
description = "Build the development-only runtime and public ABI observer images once, discover required allocation/refusal controls and execute each in a fresh process with source/image-bound receipts; no timed performance acceptance is implied."
argv = ["uv", "run", "--active", "--project", ".", "--python", "3.12", "--no-sync", "--no-config", "python", "tools/run_runtime_test_gate.py", "--policy", "allocation-observer"]
toolchains = ["cargo", "rustc", "python", "uv"]
cargo_native_units = { target = ["c", "c++"] }
resource_family = "rust"
contention_key = "cargo-native-runtime"
timeout_seconds = 9000

[[named_lane]]
cache_domain = "cargo-workspace"
id = "native.jit-code-owner"
description = "The JIT code owner and runner (HF-371): generated code runs from W^X process memory, its imports resolve through the lookup, and a missing import or ABI witness refuses the program before any code runs; the runner starts a program against a recording runtime image in the declared launch order, in a C main's process state (inherited SIGPIPE, no stack-overflow handler or alternate stack, one thread), writes its start receipt before the runtime starts and none for a program that cannot compile, and replays compiler stderr when it dies while compiling. Verified on macOS arm64 only."
argv = ["cargo", "test", "--locked", "--profile", "dev-fast", "--no-fail-fast", "-p", "molt-jit"]
toolchains = ["rustc", "cargo", "python"]
resource_family = "rust"
contention_key = "cargo-native-runtime"
timeout_seconds = 1800

[[named_lane]]
cache_domain = "cargo-workspace"
id = "native.jit-aot-twins"
description = "Run the JIT-AOT twin cases under the AOT and JIT tiers (HF-371): both must match CPython, and the exact twins must agree on exit status, stdout and stderr and on build success. The 484 cases are the basic programs that passed under both tiers on main 9e0f94f11 (2026-10-21: 480 of 514; 33 fail CPython identically under both, named by HF-295 and HF-446 to HF-453, and multiprocessing_pool_apply_async diverges because its 5 s result timeout expires while the spawned JIT worker compiles), the process-state cases closed_pipe_write_signal, native_stack_exhaustion, closed_stderr_start and file_size_limit_write_signal (expected failures that pin the exact exit status and stdout, a marker line printed before the probed operation, that both tiers must end with; a divergence fails whatever the mark), reexec_keeps_parent_environment, start_ignores_caller_file_state (an unusable TMPDIR, ulimit -f 0 and an empty current directory) and the spawn-mode multiprocessing_pool_imap. On the lane tip (2026-10-22, main c5f7dbb25, macOS arm64, 46.5 min at --jobs 4 and host load 12-14) all 484 pass under both tiers on the first run, the four pinned expected failures ending exactly as pinned, with no backend-daemon lock timeout (the three runs before HF-462 one daemon per program lost 2, 1 and 8 cases to them, HF-388). The proof queue refuses this lane on macOS, its only admitted host, because the macOS proof supervisor admits no process closure (HF-07); run the argv detached with REAPER_KEEPALIVE=1 and keep the log. Linux is unverified."
argv = ["uv", "run", "--active", "--project", ".", "--python", "3.12", "--no-sync", "--no-config", "python", "tests/molt_diff.py", "--python-version", "3.12", "--molt-target-python", "3.12", "--compiler-profile", "dev", "--build-profile", "dev", "--target", "native,jit", "--jobs", "4", "--json"]
