schema_version = 1

# Each harm names the guard that catches it and the canary that proves the guard
# can still fire (tools/check_gate_liveness.py).

[[harm]]
id = "agent-process-termination"
harm = "A guard, gate, or hook gains capability to terminate an agent process."
guard = "tools.apparatus_agent_safety"
canary = "apparatus_agent_safety.synthetic-process-actuation-refused"

[[harm]]
id = "disk-fill"
harm = "Build artifacts exhaust the primary artifact volume."
guard = "tools.disk_guard"
canary = "disk_guard.below-high-water-reclaims-stale"

[[harm]]
id = "cp1252-default-codec"
harm = "Platform-default text encoding breaks Windows tools."
guard = "tools.encoding_gate"
canary = "encoding_gate.synthetic-default-codec-refused"
