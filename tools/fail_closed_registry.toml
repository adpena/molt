# --- abstract_number.rs: arbitrary-precision int silently truncated -----------

[[site]]
id = "F2_pynumber_add_wrapping"
class = "fail_open_stub"
file = "runtime/molt-cpython-abi/src/api/abstract_number.rs"
anchor = "pyobj_from_int(x.wrapping_add(y))"
resolution_row = "task#9"
justification = """
PyNumber_Add wraps int addition to machine width. CPython ints are arbitrary
precision, so on overflow this returns a plausible NON-NULL but WRONG result
instead of promoting to bignum. Must compute the true (possibly big) sum.
