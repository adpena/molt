[[site]]
id = "G1_luau_op_emitter_nil_unsupported"
class = "fail_open_backend_dispatch"
file = "runtime/molt-backend-luau/src/luau/op_emitter.rs"
anchor = "local {out} = nil -- [unsupported op:"
resolution_row = "task#backend-failclosed"
justification = """
LuauBackend::emit_unsupported_op is the dispatch catch-all for any op kind the
luau backend does not lower. It emits `local <x> = nil -- [unsupported op: ...]`,
fabricating a nil result. This is now fail-CLOSED: emit_unsupported_op records the
op into self.unsupported_ops, and compile_checked/compile_via_ir reject a
non-empty accumulator before returning any source, so the nil can never reach a
checked build. The marker line is retained only as a readable in-source
diagnostic; the accumulator is the authority. Row freezes this placeholder-emit
surface against a NEW unregistered fail-open catch-all.
"""

