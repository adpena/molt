# Fail-closed registry — the single authority for KNOWN "hack / workaround /
# ecosystem-baked / fail-open" poison sites in the Molt tree.
#
# THE POISON CLASS THIS REGISTRY + GATE PERMANENTLY PREVENT
# --------------------------------------------------------
# Molt's contract is one authority per invariant, source-recompiled ecosystem
# support, and fail-CLOSED on unsupported behavior (a precise diagnostic, never a
# plausible-looking wrong answer). A *poison site* abandons that contract for a
# shortcut that silently ships a wrong or degraded result. Poison classes:
#
#   ecosystem_baked    : a package-owned header/source (numpy / scipy / pandas
#                        symbols) vendored AND DEFINED inside a Molt-owned tree
#                        instead of flowing through source-recompiled extension
#                        custody. Baked upstream semantics rot when upstream moves.
#   ecosystem_build_crutch: a package-specific source-plan/build helper or
#                        generated-header/config authoring path that hand-maintains
#                        what upstream package metadata/build systems must own.
#   ecosystem_reimplementation: a Molt-owned Python package root for a
#                        third-party library. Upstream package Python/extensions
#                        must flow through package custody, not shadow packages in
#                        src/molt/stdlib.
#   fail_open_stub     : a #[no_mangle] extern "C" ABI export that returns a
#                        plausible NON-NULL / success sentinel on a path it does
#                        not implement (MoltObject::none() / PyList_New(0)
#                        placeholder, wrapping_* on an arbitrary-precision int,
#                        `let _ = <arg>;` dropping a real argument). The calling
#                        C extension cannot tell success from a lie.
#   duplicate_authority: two live copies of the SAME C-API authority (e.g. two
#                        Python.h) hand-synced; one is always about to drift.
#   todo_as_plan       : a HACK / WORKAROUND / "for now" / status:divergent|partial
#                        marker reachable from a SHIPPED support surface (a public
#                        API or exported ABI symbol that advertises the capability).
#                        `status:planned` stubs are EXCLUDED — they honestly do not
#                        claim support.
#
# This is DISTINCT from sound conservatism, thin `#include <numpy/...>` compat
# forwarders, the package-custody CLASSIFIER (src/molt/c_api_symbols.py,
# src/molt/cli/external_native.py — which correctly ROUTE these symbols to custody
# and fail closed; the right primitive), and honest `status:planned` stubs. Those
# are kept OUT by the gate's curated allowlists, not registered here.
#
# HOW THE GATE USES THIS FILE (see tools/fail_closed_gate.py)
# ----------------------------------------------------------
# 1. DISCOVERY: content scans (ecosystem-baked, ecosystem-build-crutch,
#    ecosystem-reimplementation, fail-open ABI/backend dispatch, todo-as-plan,
#    duplicate authority) sweep the real trees. Every discovered site MUST have a
#    row here; a NEW unregistered poison site FAILS the gate (drift teeth),
#    exactly like a new op-kind missing from op_kinds.toml.
# 2. ANCHOR INTEGRITY: each row's `anchor` must still exist verbatim in `file`, so
#    a site cannot silently move or vanish out from under its row.
# 3. TEETH: every row must name a `resolution_row` — the rip task/arc driving it to
#    zero — and a justification read from the real code.
# 4. RATCHET: the per-class registered count is monotonically non-increasing
#    against the per-class `baseline`. The poison classes can only shrink; the rip
#    arcs LOWER the baseline as they delete sites. Adding poison is a gate failure.
#
# Each row cites the parallel rip arc that owns deleting it (these sites are being
# ripped in flight by the ecosystem-custody / ABI-fail-closed / header-authority
# arcs; this gate freezes the KNOWN set and prevents regrowth).

# Ratchet baselines: the number of registered rows per class the gate was sealed
# with. The gate FAILS if a live class count exceeds its baseline. LOWER a baseline
# (in the same arc that rips a site) — never raise it.
[baseline]
ecosystem_baked = 0
ecosystem_build_crutch = 0
ecosystem_reimplementation = 0
fail_open_stub = 0
duplicate_authority = 3
todo_as_plan = 0
fail_open_backend_dispatch = 0

# ===========================================================================
# ecosystem_baked (Scan A) - package headers/config defined in-tree.
# Resolution: task#7 (numpy source-recompiled extension custody). The former
# NumPy header/config overlay rows were deleted by E1-NUMPY-HEADER-OVERLAY-
# CUSTODY; the baseline is now zero so any new package-owned header/config site
# must be completed through package custody, not registered as debt.
# ===========================================================================
# ===========================================================================
# ecosystem_build_crutch (Scan F) - package-specific build/source-plan helpers.
# Resolution: task#73.2 (generic auto toolchain and package-build-system custody).
# The zero baseline permanently rejects package-specific source-plan/build
# clones; package prerequisites must flow through generic upstream custody.
# ===========================================================================

# ===========================================================================
# fail_open_stub (Scan B) — ABI exports that ship a plausible wrong / placeholder
# answer instead of failing closed.
# Resolution: task#9 (CPython ABI fail-closed sweep). Each export must either
# implement the real semantics or set a PyErr and return the true failure sentinel.
# ===========================================================================

# --- abstract_number.rs: arbitrary-precision int silently truncated -----------

# F5_sequences_drops_op RIPPED by lane F2 (e47205c64f): PyList_Sort/PyList_Reverse
# now route the runtime in-place sort/reverse authorities (list_sort/list_reverse
# hooks) with BadInternalCall on a non-list — no argument is dropped and no
# fabricated success remains. Baseline lowered 1 -> 0 (ratchet).

[[site]]
id = "D1_python_h_two_copies"
class = "duplicate_authority"
file = "include/molt/Python.h"
anchor = "#ifndef MOLT_C_API_PYTHON_H"
resolution_row = "task#10"
justification = """
include/molt/Python.h (14k lines, NaN-box source-recompile tier) and
runtime/molt-cpython-abi/include/Python.h (1.7k lines, traditional
ob_refcnt/ob_type standalone-dylib tier) are two substantive copies of the
CPython umbrella header. The two serve two genuinely different runtime ABIs, so
this is a real representation boundary, not gratuitous duplication — but the
boundary must be GENERATED from one authority, not two hand-maintained headers.

PROGRESS (task#10, commit generating the layout from the one Rust authority):
the memory-unsafe half of this drift is now closed. The standalone tier's struct
layout is authored ONCE in Rust repr(C) form (runtime/molt-cpython-abi/src/
abi_types.rs); include/_molt_abi_layout.generated.h is generated from it by
tools/gen_cpython_abi_layout.py and #included by the ABI Python.h, so any drift
between the C structs and the Rust authority the dylib operates on now fails to
COMPILE (crate build + every extension compile) instead of corrupting memory.
gen_cpython_abi_layout.py --check gates the artifact against the authority.

REMAINING (why this row is not yet retired): the ABI Python.h still hand-maintains
its DECLARATION surface (macros, extern PyAPI_FUNC decls, inline helpers) beyond
the struct layouts, so it remains a substantive independent header the coarse
line-count D-scan still flags. Full resolution = generate that declaration surface
from the same authority (or a shared symbol table) and teach the D-scan to
recognise a generated single-authority header, then retire this row + lower the
duplicate_authority baseline. Tracked under task#10.
"""

[[site]]
id = "D2_datetime_h_two_copies"
class = "duplicate_authority"
file = "include/datetime.h"
anchor = "#ifndef MOLT_C_API_DATETIME_H"
resolution_row = "task#10"
justification = """
RECLASSIFIED (POISON Lane A #3). This row previously described include/datetime.h
as a benign "hand-synced substantive copy" of the datetime C-API header — a
MISCLASSIFICATION. The source-compat copy was in fact a fail-open, MEMORY-UNSAFE
stub: a 4-byte integer-placeholder PyDateTime_CAPI (so PyDateTimeAPI->field read
out of bounds), *_Check functions that unconditionally yielded false (silent
wrong branch), and no PyTime_Check. That was a real correctness+safety defect,
not a benign duplicate.

FIXED: include/datetime.h now mirrors CPython 3.12 faithfully — the exact
15-field PyDateTime_CAPI, PyDateTime_IMPORT resolving PyDateTimeAPI from the
datetime.datetime_CAPI capsule the runtime publishes, and real PyObject_TypeCheck
*_Check functions (NULL-guarded, no OOB). It is now a genuinely-correct
source-compat-tier implementation, distinct in mechanism from the ABI-tier
runtime/molt-cpython-abi/include/datetime.h (static type symbols), which is also
correct.

Residual (why this row remains, now accurately a duplicate_authority drift-risk
like D2_structmember): the 15-field PyDateTime_CAPI struct LAYOUT is hand-synced
across THREE authorities — include/datetime.h, runtime/molt-cpython-abi/include/
datetime.h, and the runtime capsule struct in
runtime/molt-cpython-abi/src/api/datetime.rs — where a one-field drift silently
mis-reads the capsule (OOB/wrong offset). Burn-down (task#10): generate the
shared layout from the single abi_types authority (as D1's struct half already
is) and retire this row. No wrong answer today; pure layout drift-risk.
"""

# ===========================================================================
# todo_as_plan (Scan C) — RESOLVED to zero.
#
# A status:divergent|partial / "ignore for now" marker INSIDE the body of a
# shipped public API that returns a divergent value on an accepted call (as
# opposed to failing closed with a raise, which is honest). `status:planned`
# honest stubs and fail-closed raises are NOT swept here.
#
# All three formerly-registered sites are ripped; the baseline is 0. New
# todo-as-plan poison must not land (an unregistered discovered site fails the
# gate). The rips:
#
#   * C1_pynumber_power_modulus_for_now — PyNumber_Power now performs a real
#     3-argument modular pow via the runtime numeric authority (molt_pow_mod);
#     the "ignore for now" `let _ = o3;` shortcut is gone
#     (runtime/molt-cpython-abi/src/api/abstract_number.rs). Same fix as
#     fail_open_stub F3. Landed by task#9 (062fb5301).
#   * F8_multiprocessing_fork_maps_to_spawn — get_all_start_methods() no longer
#     advertises fork/forkserver (Molt has no os.fork()/HAVE_SEND_HANDLE), and
#     get_context()/set_start_method() now fail closed with CPython's
#     ValueError("cannot find context for %r") instead of silently running
#     spawn semantics (src/molt/stdlib/multiprocessing/_core.py).
#   * F9_zlib_unused_data_partial — Decompress.unused_data now returns the true
#     trailing bytes past the end of the compressed stream via the real
#     molt_zlib_decompressobj_unused_data intrinsic, tracked separately from
#     unconsumed_tail per CPython zlib semantics
#     (src/molt/stdlib/zlib.py + runtime/molt-runtime-compression/src/zlib.rs).
# ===========================================================================

[[site]]
id = "D2_structmember_h_duplicate"
class = "duplicate_authority"
file = "include/structmember.h"
anchor = "#ifndef MOLT_STRUCTMEMBER_H"
resolution_row = "task#10"
justification = """
structmember.h lives at both include/structmember.h (source-compat overlay tier)
and runtime/molt-cpython-abi/include/structmember.h (the ABI authority added by
the header-custody arc 410ada3ad to make the cpython-abi tier self-complete) --
two hand-synced copies of the CPython legacy T_*/READONLY aliases. Retire under
task #10's remaining surface (generate/collapse to one authority).
"""
