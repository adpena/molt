# =========================================================================
# GATE-LIFECYCLE REGISTRY (APPARATUS Wave 1, A9)
#
# Uniform warn->strict lifecycle for molt gates, mirroring pact's discipline:
# a gate lands WARN-ONLY with a NAMED, machine-checkable flip condition; a
# separate commit flips it once the condition is met. `tools/check_gate_flips.py`
# reports (and, with --check, fails on) any gate whose `strict_when` is met but
# is still `state = "warn"` -- the ratchet that ratchets the ratchets.
#
# `state`       : "warn" | "strict"
# `strict_when` : machine token (`live_count == 0`, `live_count <= N`,
#                 `landed_functional`, `always`) or free text (-> manual review)
# `count_cmd`   : optional shell command whose integer stdout is `live_count`
# `rationale`   : why this state / flip condition
#
# The Wave-1 hooks land FUNCTIONAL (not warn-only): they are additive and
# fail-open, so blocking-at-land is safe. They are recorded here as
# `landed_functional` per A9 so the lifecycle is uniform and auditable.
# =========================================================================

[[gate_flip]]
name = "bash_guard"
state = "strict"
strict_when = "landed_functional"
rationale = "PreToolUse guard is additive + fail-open; blocking destructive-git/add-sweep/queue-bypass/https-push at land is safe and reversible via MOLT_GUARD_OK=1."

[[gate_flip]]
name = "landing_gate"
state = "strict"
strict_when = "landed_functional"
rationale = "Stop-hook land-or-blocker nudge; exit-0 block-once + stop_hook_active make it a re-engage nudge, never a wedge, so it is safe at land."

[[gate_flip]]
name = "session_digest"
state = "strict"
strict_when = "always"
rationale = "SessionStart digest never blocks (informational, exit 0 always); 'always' = no flip pending."

[[gate_flip]]
name = "gate_liveness_canary"
state = "strict"
strict_when = "landed_functional"
rationale = "check_gate_liveness must always fire on known-bad fixtures; a canary that cannot fire is worthless, so it lands strict."
# --- APPARATUS A4 memo->registry lint (warn-only; A9 [[gate_flip]] entry) ---
# Lands WARN-ONLY: molt carries an existing backlog of docs/agent + memory lines
# stating a measured finding (speedup / residual / bench / parity) with no
# finding_id reference. live_count = that backlog (findings_memo_lint.py --count).
# ci_gate runs the check `findings-memo-lint-warn` (warn mode). Flip = burn the
# backlog to zero (formalize each via tools/findings_registry.py + cite its
# finding_id, or waive the line with '# FORMALIZATION_PENDING:<why>'), set
# state = "strict" here, and swap the ci_gate cmd to `findings_memo_lint.py --strict`.
[[gate_flip]]
name = "findings_memo_lint"
state = "warn"
strict_when = "live_count == 0"
count_cmd = "python3 tools/findings_memo_lint.py --count"
rationale = "APPARATUS A4 memo->registry lint (ci_gate check findings-memo-lint-warn). A docs/agent or memory line stating a measured finding with no finding_id reference is un-formalized prose that will rot. live_count is the current backlog; flip to strict once it reaches zero."

# --- APPARATUS A10 memory-graph integrity (warn-only; A9 [[gate_flip]] entry) ---
# The memory corpus is a [[wikilink]] graph with an M## hook index resolved by
# POINTERS.md. `tools/check_memory_graph.py --check` REPORTS (a) dangling
# [[wikilinks]] -- which the memory system EXPLICITLY ALLOWS as "worth writing
# later", so they are never a failure -- and (b) any M## in MEMORY.md not
# resolved by POINTERS.md (a real index break). ci_gate runs the warn-only check
# `memory-graph-integrity` (required=False; ALWAYS exits 0).
#
# strict_when is a MANUAL-REVIEW (free-text) token, NOT a machine `live_count ==
# 0`: the live corpus is Claude's auto-memory dir, which CI cannot see
# (discover_memory_dir -> None -> 0/0 in CI), so `live_count == 0` would be
# vacuously met in CI and falsely flagged should-flip. Only the operator, looking
# at the real corpus, can decide to tighten (swap the ci_gate check to
# `check_memory_graph.py --strict`, which fails on unresolved M## while danglers
# stay warn-only even then). count_cmd remains for the human-visible live_count.
[[gate_flip]]
name = "memory_graph_integrity"
state = "warn"
strict_when = "manual: unresolved M## sustained at 0 on the live auto-memory corpus AND dangling-link triage reviewed (operator-box only; CI cannot see the corpus)"
count_cmd = "python3 tools/check_memory_graph.py --count"
rationale = "APPARATUS A10 memory-graph integrity (ci_gate check memory-graph-integrity, warn-only). Reports dangling [[wikilinks]] (ALLOWED) + unresolved MEMORY.md M## (index break). Free-text manual strict_when because CI cannot see the auto-memory corpus; flip is an operator decision made against the live corpus."
