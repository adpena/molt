name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v0.0.001)"
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    # This job currently attests and publishes its matrix artifact. Keep write
    # authority local to the publishing job instead of granting it workflow-wide.
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
            arch: arm64
            self_hosted: false
          - os: [self-hosted, macos, x64, molt-release]
            platform: macos
            arch: x86_64
            self_hosted: true
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            self_hosted: false
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            self_hosted: false
          - os: windows-2022
            platform: windows
            arch: x86_64
            self_hosted: false
    env:
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Resolve version
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ -n "$REF_NAME" ]; then
            VERSION="$REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            echo "Version is required (tag or input)." >&2
            exit 1
          fi
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Select Python
        shell: bash
        run: |
          if [ "${{ matrix.self_hosted }}" = "true" ]; then
            echo "PYTHON_BIN=python3" >> "$GITHUB_ENV"
          else
            echo "PYTHON_BIN=python" >> "$GITHUB_ENV"
          fi

      - name: Setup release project toolchains
        uses: ./.github/actions/setup-project
        with:
          python: ${{ !matrix.self_hosted && 'true' || 'false' }}
          rust-toolchain: ${{ !matrix.self_hosted && '1.96.1' || '' }}
          cache-cargo: ${{ !matrix.self_hosted && 'true' || 'false' }}
          cache-namespace: release-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Verify version matches pyproject.toml
        shell: bash
        run: |
          "$PYTHON_BIN" - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text())
          version = data["project"]["version"]
          expected = os.environ["VERSION"]
          if version != expected:
              raise SystemExit(f"pyproject.toml version {version} != {expected}")
          PY

      - name: Install Rust toolchain (self-hosted)
        if: ${{ matrix.self_hosted }}
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$GITHUB_ENV"
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.96.1

      - name: Install system deps (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libssl-dev

      - name: Build wheel
        shell: bash
        run: |
          "$PYTHON_BIN" tools/guarded_exec.py --prefix MOLT_RELEASE -- \
            uv pip install --system --python "$PYTHON_BIN" build
          "$PYTHON_BIN" tools/guarded_exec.py --prefix MOLT_RELEASE -- \
            "$PYTHON_BIN" -m build --wheel --outdir dist

      - name: Build molt-worker
        shell: bash
        run: |
          "$PYTHON_BIN" tools/guarded_exec.py --prefix MOLT_RELEASE -- cargo build -p molt-worker --release

      - name: Build bundles
        shell: bash
        run: |
          mkdir -p dist
          WHEEL=$(ls dist/molt-*.whl | head -1)
          if [ -z "$WHEEL" ]; then
            echo "Wheel not found" >&2
            exit 1
          fi

          if [ "${{ matrix.platform }}" = "windows" ]; then
            WORKER="target/release/molt-worker.exe"
            EXT="zip"
          else
            WORKER="target/release/molt-worker"
            EXT="tar.gz"
          fi

          if [ ! -f "$WORKER" ]; then
            echo "Worker binary missing: $WORKER" >&2
            exit 1
          fi

          "$PYTHON_BIN" tools/guarded_exec.py --prefix MOLT_RELEASE -- \
            "$PYTHON_BIN" tools/release/build_bundle.py \
            --version "$VERSION" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --wheel "$WHEEL" \
            --worker "$WORKER" \
            --output "dist/molt-$VERSION-${{ matrix.platform }}-${{ matrix.arch }}.$EXT"

          "$PYTHON_BIN" tools/guarded_exec.py --prefix MOLT_RELEASE -- \
            "$PYTHON_BIN" tools/release/build_bundle.py \
            --version "$VERSION" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --kind molt-worker \
            --worker "$WORKER" \
            --output "dist/molt-worker-$VERSION-${{ matrix.platform }}-${{ matrix.arch }}.$EXT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/molt-*-${{ matrix.platform }}-${{ matrix.arch }}.*

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/molt-*-${{ matrix.platform }}-${{ matrix.arch }}.*

      - name: Upload release assets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ env.VERSION }}
          files: dist/molt-*-${{ matrix.platform }}-${{ matrix.arch }}.*

  manifest:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    needs: build
    env:
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Resolve version
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ -n "$REF_NAME" ]; then
            VERSION="$REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            echo "Version is required (tag or input)." >&2
            exit 1
          fi
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup release manifest Python
        uses: ./.github/actions/setup-project
        with:
          uv: "false"
          cache-uv: "false"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums and manifest
        shell: bash
        run: |
          python tools/release/write_checksums.py --out dist/SHA256SUMS dist/molt-*.*
          python tools/release/release_manifest.py --version "$VERSION" --out dist/release_manifest.json dist/molt-*.*

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            dist/SHA256SUMS
            dist/release_manifest.json

      - name: Upload release manifest assets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            dist/SHA256SUMS
            dist/release_manifest.json

  deploy-worker:
    runs-on: ubuntu-24.04
    needs: manifest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: deploy/cloudflare
          command: deploy

      - name: Smoke test Worker
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            --max-time 30 \
            https://falcon-ocr.adpena.workers.dev/health)
          if [ "$STATUS" != "200" ]; then
            echo "Worker health check failed: HTTP $STATUS" >&2
            exit 1
          fi
          echo "Worker health check passed (HTTP $STATUS)"

  deploy-modal:
    runs-on: ubuntu-24.04
    needs: manifest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Modal deployment Python
        uses: ./.github/actions/setup-project
        with:
          uv: "false"
          cache-uv: "false"

      - name: Install Modal
        run: pip install modal

      - name: Deploy Falcon-OCR to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy deploy/modal/falcon_ocr.py

      - name: Deploy Nemotron OCR to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy deploy/modal/nemotron_ocr.py
