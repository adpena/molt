name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing draft/tag; dispatch from this same tag (for example v0.0.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-production
    permissions:
      contents: write # GitHub requires push access to list unpublished drafts.
      attestations: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      source_date_epoch: ${{ steps.plan.outputs.source_date_epoch }}
      matrix: ${{ steps.plan.outputs.matrix }}
      release_exit_archive: ${{ steps.plan.outputs.release_exit_archive }}
      release_exit_sha256: ${{ steps.plan.outputs.release_exit_sha256 }}
      phase_exit_manifest: ${{ steps.plan.outputs.phase_exit_manifest }}
      phase_exit_attestation: ${{ steps.plan.outputs.phase_exit_attestation }}
      release_id: ${{ steps.draft.outputs.release_id }}
      evidence_asset_id: ${{ steps.draft.outputs.evidence_asset_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup release planner
        uses: ./.github/actions/setup-project
        with:
          cache-uv: "false"
          sync: "true"
          sync-frozen: "true"

      - name: Resolve exact workflow and tagged source identity
        id: source
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$REQUESTED_VERSION"
          uv run --no-sync python -m tools.release.release_authority source \
            --requested-version "$REQUESTED_VERSION" --source-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Require one existing draft containing only its exact evidence ZIP
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: >-
          uv run --no-sync python -m tools.release.release_authority require-draft
          --version "$VERSION" --source-sha "$SOURCE_SHA" --evidence-only
          --github-output "$GITHUB_OUTPUT"

      - name: Authenticate same-source semantic evidence before admitting builds
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          EVIDENCE_ARCHIVE: ${{ steps.source.outputs.release_exit_archive }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          EVIDENCE_ASSET_ID: ${{ steps.draft.outputs.evidence_asset_id }}
        run: |
          uv run --no-sync python -m tools.release.release_authority download-evidence \
            --version "$VERSION" --source-sha "$SOURCE_SHA" --release-id "$RELEASE_ID" \
            --evidence-asset-id "$EVIDENCE_ASSET_ID" --output dist/staged-evidence
          uv run --no-sync python -m tools.release.release_authority plan \
            --requested-version "$VERSION" --source-sha "$SOURCE_SHA" \
            --release-exit-archive "dist/staged-evidence/$EVIDENCE_ARCHIVE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Preserve admitted evidence ZIP without an extraction round-trip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-exit-${{ steps.plan.outputs.source_sha }}
          path: dist/staged-evidence/${{ steps.plan.outputs.release_exit_archive }}
          if-no-files-found: error
          retention-days: 14

  wheel:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: Setup exact wheel build environment
        uses: ./.github/actions/setup-project

      - name: Synchronize locked release build tools
        run: uv sync --frozen --no-dev --group release

      - name: Build the canonical wheel twice from independent source exports
        run: |
          mkdir -p dist/source-a dist/source-b dist/wheel-a dist/wheel-b dist/wheel
          git archive --format=tar --output=dist/source.tar HEAD
          tar -xf dist/source.tar -C dist/source-a
          tar -xf dist/source.tar -C dist/source-b
          uv run --no-sync python -m build --wheel --no-isolation \
            --outdir "$GITHUB_WORKSPACE/dist/wheel-a" dist/source-a
          uv run --no-sync python -m build --wheel --no-isolation \
            --outdir "$GITHUB_WORKSPACE/dist/wheel-b" dist/source-b
          primary="$(uv run --no-sync python -m tools.release.release_authority select-one \
            --root dist/wheel-a --pattern '*.whl')"
          secondary="$(uv run --no-sync python -m tools.release.release_authority select-one \
            --root dist/wheel-b --pattern '*.whl')"
          uv run --no-sync python -m tools.release.release_authority verify-wheel \
            --primary "$primary" \
            --secondary "$secondary" \
            --output "dist/wheel/$(basename "$primary")" \
            > dist/wheel/reproducibility.json

      - name: Upload canonical wheel authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheel-${{ needs.plan.outputs.source_sha }}
          path: dist/wheel
          if-no-files-found: error
          retention-days: 14

  candidates:
    needs: [plan, wheel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CARGO_INCREMENTAL: "0"
      SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: Setup exact candidate toolchains
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: "1.96.1"
          cache-cargo: "true"
          cache-namespace: release-${{ matrix.id }}
          sync: "true"
          sync-frozen: "true"

      - name: Verify candidate toolchain identity
        shell: bash
        run: |
          rustc --version --verbose | grep -F 'release: 1.96.1'
          cargo --version | grep -F 'cargo 1.96.1'
          clang --version

      - name: Download the one canonical wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-wheel-${{ needs.plan.outputs.source_sha }}
          path: dist/wheel

      - name: Build independent release-output workers
        shell: bash
        run: |
          uv run --no-sync python tools/guarded_exec.py --prefix MOLT_RELEASE -- \
            cargo build --locked --profile release-output -p molt-worker \
            --target-dir dist/worker-primary
          uv run --no-sync python tools/guarded_exec.py --prefix MOLT_RELEASE -- \
            cargo build --locked --profile release-output -p molt-worker \
            --target-dir dist/worker-secondary

      - name: Build independent production compilers
        shell: bash
        run: |
          uv run --no-sync python tools/guarded_exec.py --prefix MOLT_RELEASE -- \
            uv run --no-sync python -m tools.release.build_compiler --target-dir dist/compiler-primary
          uv run --no-sync python tools/guarded_exec.py --prefix MOLT_RELEASE -- \
            uv run --no-sync python -m tools.release.build_compiler --target-dir dist/compiler-secondary

      - name: Assemble immutable reproducible candidate
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          wheel="$(uv run --no-sync python -m tools.release.release_authority select-one \
            --root dist/wheel --pattern '*.whl')"
          worker="molt-worker"
          compiler="molt-backend"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            worker="molt-worker.exe"
            compiler="molt-backend.exe"
          fi
          uv run --no-sync python -m tools.release.release_authority candidate \
            --target "${{ matrix.id }}" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --wheel "$wheel" \
            --primary-worker "dist/worker-primary/release-output/$worker" \
            --secondary-worker "dist/worker-secondary/release-output/$worker" \
            --primary-compiler "dist/compiler-primary/release/$compiler" \
            --secondary-compiler "dist/compiler-secondary/release/$compiler" \
            --output dist/candidate

      - name: Verify installed canonical Python and guest-profile closure
        shell: bash
        run: >-
          uv run --no-sync python tools/guarded_exec.py --prefix MOLT_RELEASE --
          uv run --no-sync python -m tools.release.verify_consumer
          --candidate dist/candidate
          --receipt dist/candidate/consumer-verification.json

      - name: Upload verified immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ matrix.id }}-${{ needs.plan.outputs.source_sha }}
          path: dist/candidate
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: [plan, wheel, candidates]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: Setup release index authority
        uses: ./.github/actions/setup-project
        with:
          cache-uv: "false"
          sync: "true"
          sync-frozen: "true"

      - name: Download the original admitted evidence ZIP
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-exit-${{ needs.plan.outputs.source_sha }}
          path: dist/staged-evidence

      - name: Extract same-source evidence for stable phase projection
        if: ${{ needs.plan.outputs.phase_exit_manifest != '' }}
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
          EVIDENCE_ARCHIVE: ${{ needs.plan.outputs.release_exit_archive }}
        run: >-
          uv run --no-sync python -m tools.release.release_authority extract-exit
          --archive "dist/staged-evidence/$EVIDENCE_ARCHIVE"
          --source-sha "$SOURCE_SHA" --source-date-epoch "$SOURCE_DATE_EPOCH"
          --output dist/release-exit

      - name: Prepare canonical H0 signing subject after its semantic predicates pass
        if: ${{ needs.plan.outputs.phase_exit_manifest != '' }}
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: >-
          uv run --no-sync python -m tools.phase_exit_manifest prepare
          --phase H0 --commit "$SOURCE_SHA"
          --release-exit-manifest dist/release-exit/release-exit.json
          --output dist/phase/subject.json

      - name: Sign the stable H0 subject
        id: phase
        if: ${{ needs.plan.outputs.phase_exit_manifest != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/phase/subject.json

      - name: Seal the stable phase manifest without reprojecting its signed subject
        if: ${{ needs.plan.outputs.phase_exit_manifest != '' }}
        env:
          PHASE_MANIFEST: ${{ needs.plan.outputs.phase_exit_manifest }}
          PHASE_ATTESTATION: ${{ needs.plan.outputs.phase_exit_attestation }}
          PHASE_BUNDLE: ${{ steps.phase.outputs.bundle-path }}
        run: |
          cp "$PHASE_BUNDLE" "dist/phase/$PHASE_ATTESTATION"
          uv run --no-sync python -m tools.phase_exit_manifest seal \
            --subject dist/phase/subject.json \
            --attestation "dist/phase/$PHASE_ATTESTATION" \
            --release-exit-manifest dist/release-exit/release-exit.json \
            --output "dist/phase/$PHASE_MANIFEST"

      - name: Download verified candidates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-candidate-*-${{ needs.plan.outputs.source_sha }}
          path: dist/candidates

      - name: Download canonical wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-wheel-${{ needs.plan.outputs.source_sha }}
          path: dist/wheel

      - name: Build collision-free release index, checksums, and SPDX SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
          EVIDENCE_ARCHIVE: ${{ needs.plan.outputs.release_exit_archive }}
          EVIDENCE_SHA256: ${{ needs.plan.outputs.release_exit_sha256 }}
          PHASE_MANIFEST: ${{ needs.plan.outputs.phase_exit_manifest }}
        run: |
          wheel="$(uv run --no-sync python -m tools.release.release_authority select-one \
            --root dist/wheel --pattern '*.whl')"
          phase_args=()
          if [ -n "$PHASE_MANIFEST" ]; then phase_args=(--phase-exit-manifest "dist/phase/$PHASE_MANIFEST"); fi
          uv run --no-sync python -m tools.release.release_authority index \
            --candidate-root dist/candidates \
            --wheel "$wheel" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --release-exit-archive "dist/staged-evidence/$EVIDENCE_ARCHIVE" \
            --release-exit-sha256 "$EVIDENCE_SHA256" \
            "${phase_args[@]}" \
            --output dist/publish

      - name: Sign SLSA provenance with GitHub Sigstore identity
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/publish/*

      - name: Sign SPDX SBOM with GitHub Sigstore identity
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/publish/*.whl
            dist/publish/*.tar.gz
            dist/publish/*.zip
            dist/publish/molt-phase-exit-*.json
          sbom-path: dist/publish/release.spdx.json

      - name: Preserve portable Sigstore bundles and verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            dist/publish/release.provenance.sigstore.json
          cp "${{ steps.sbom.outputs.bundle-path }}" \
            dist/publish/release.sbom.sigstore.json
          uv run --no-sync python -m tools.release.release_authority verify-signed \
            --root dist/publish --source-sha "$SOURCE_SHA"

      - name: Upload the only promotable release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-promotion-${{ needs.plan.outputs.source_sha }}
          path: dist/publish
          if-no-files-found: error
          retention-days: 14

  promote:
    needs: [plan, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-production
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: Setup promotion verifier
        uses: ./.github/actions/setup-project
        with:
          cache-uv: "false"
          sync: "true"
          sync-frozen: "true"

      - name: Download the signed verified payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-promotion-${{ needs.plan.outputs.source_sha }}
          path: dist/publish

      - name: Stage, byte-verify, then atomically publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          RELEASE_ID: ${{ needs.plan.outputs.release_id }}
          EVIDENCE_ASSET_ID: ${{ needs.plan.outputs.evidence_asset_id }}
        run: |
          uv run --no-sync python -m tools.release.release_authority promote-release \
            --version "$VERSION" --source-sha "$SOURCE_SHA" --release-id "$RELEASE_ID" \
            --evidence-asset-id "$EVIDENCE_ASSET_ID" --local dist/publish
