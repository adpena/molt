name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag (for example v0.0.001)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      source_date_epoch: ${{ steps.plan.outputs.source_date_epoch }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Setup release planner
        uses: ./.github/actions/setup-project
        with:
          uv: "false"
          cache-uv: "false"

      - name: Resolve exact tagged release plan
        id: plan
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: >-
          python -m tools.release.release_authority plan
          --requested-version "$REQUESTED_VERSION"
          --github-output "$GITHUB_OUTPUT"

  wheel:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: Setup exact wheel build environment
        uses: ./.github/actions/setup-project

      - name: Synchronize locked release build tools
        run: uv sync --frozen --only-group release

      - name: Build the canonical wheel twice from independent source exports
        run: |
          mkdir -p dist/source-a dist/source-b dist/wheel-a dist/wheel-b dist/wheel
          git archive --format=tar --output=dist/source.tar HEAD
          tar -xf dist/source.tar -C dist/source-a
          tar -xf dist/source.tar -C dist/source-b
          uv run --no-sync python -m build --wheel --no-isolation \
            --outdir "$GITHUB_WORKSPACE/dist/wheel-a" dist/source-a
          uv run --no-sync python -m build --wheel --no-isolation \
            --outdir "$GITHUB_WORKSPACE/dist/wheel-b" dist/source-b
          primary="$(python -m tools.release.release_authority select-one \
            --root dist/wheel-a --pattern '*.whl')"
          secondary="$(python -m tools.release.release_authority select-one \
            --root dist/wheel-b --pattern '*.whl')"
          python -m tools.release.release_authority verify-wheel \
            --primary "$primary" \
            --secondary "$secondary" \
            --output "dist/wheel/$(basename "$primary")" \
            > dist/wheel/reproducibility.json

      - name: Upload canonical wheel authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheel-${{ needs.plan.outputs.source_sha }}
          path: dist/wheel
          if-no-files-found: error
          retention-days: 14

  candidates:
    needs: [plan, wheel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CARGO_INCREMENTAL: "0"
      SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: Setup exact candidate toolchains
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: "1.96.1"
          cache-cargo: "true"
          cache-namespace: release-${{ matrix.id }}

      - name: Verify candidate toolchain identity
        shell: bash
        run: |
          rustc --version --verbose | grep -F 'release: 1.96.1'
          cargo --version | grep -F 'cargo 1.96.1'
          clang --version

      - name: Download the one canonical wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-wheel-${{ needs.plan.outputs.source_sha }}
          path: dist/wheel

      - name: Build independent release-output workers
        shell: bash
        run: |
          python tools/guarded_exec.py --prefix MOLT_RELEASE -- \
            cargo build --locked --profile release-output -p molt-worker \
            --target-dir dist/worker-primary
          python tools/guarded_exec.py --prefix MOLT_RELEASE -- \
            cargo build --locked --profile release-output -p molt-worker \
            --target-dir dist/worker-secondary

      - name: Assemble immutable reproducible candidate
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          wheel="$(python -m tools.release.release_authority select-one \
            --root dist/wheel --pattern '*.whl')"
          worker="molt-worker"
          if [ "${{ matrix.platform }}" = "windows" ]; then worker="molt-worker.exe"; fi
          python -m tools.release.release_authority candidate \
            --target "${{ matrix.id }}" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --wheel "$wheel" \
            --primary-worker "dist/worker-primary/release-output/$worker" \
            --secondary-worker "dist/worker-secondary/release-output/$worker" \
            --output dist/candidate

      - name: Verify clean install, CLI, native compile, execution, and uninstall
        shell: bash
        run: >-
          python tools/guarded_exec.py --prefix MOLT_RELEASE --
          python -m tools.release.verify_consumer
          --candidate dist/candidate
          --receipt dist/candidate/consumer-verification.json

      - name: Upload verified immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ matrix.id }}-${{ needs.plan.outputs.source_sha }}
          path: dist/candidate
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: [plan, wheel, candidates]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: Setup release index authority
        uses: ./.github/actions/setup-project
        with:
          uv: "false"
          cache-uv: "false"

      - name: Download verified candidates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-candidate-*-${{ needs.plan.outputs.source_sha }}
          path: dist/candidates

      - name: Download canonical wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-wheel-${{ needs.plan.outputs.source_sha }}
          path: dist/wheel

      - name: Build collision-free release index, checksums, and SPDX SBOM
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source_date_epoch }}
        run: |
          wheel="$(python -m tools.release.release_authority select-one \
            --root dist/wheel --pattern '*.whl')"
          python -m tools.release.release_authority index \
            --candidate-root dist/candidates \
            --wheel "$wheel" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --output dist/publish

      - name: Sign SLSA provenance with GitHub Sigstore identity
        id: provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            dist/publish/*.whl
            dist/publish/*.tar.gz
            dist/publish/*.zip
            dist/publish/SHA256SUMS
            dist/publish/release_manifest.json
            dist/publish/release.spdx.json

      - name: Sign SPDX SBOM with GitHub Sigstore identity
        id: sbom
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            dist/publish/*.whl
            dist/publish/*.tar.gz
            dist/publish/*.zip
          sbom-path: dist/publish/release.spdx.json

      - name: Preserve portable Sigstore bundles and verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            dist/publish/release.provenance.sigstore.json
          cp "${{ steps.sbom.outputs.bundle-path }}" \
            dist/publish/release.sbom.sigstore.json
          find dist/publish -maxdepth 1 -type f \
            ! -name '*.sigstore.json' ! -name 'RELEASE_NOTES.md' -print0 \
            | xargs -0 -n1 gh attestation verify --repo "$GITHUB_REPOSITORY"

      - name: Upload the only promotable release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-promotion-${{ needs.plan.outputs.source_sha }}
          path: dist/publish
          if-no-files-found: error
          retention-days: 14

  promote:
    needs: [plan, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: Setup promotion verifier
        uses: ./.github/actions/setup-project
        with:
          uv: "false"
          cache-uv: "false"

      - name: Download the signed verified payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-promotion-${{ needs.plan.outputs.source_sha }}
          path: dist/publish

      - name: Stage, byte-verify, then atomically publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .draft)"
            test "$draft" = "true" || {
              echo "published release already exists for $tag" >&2
              exit 1
            }
          else
            gh release create "$tag" --draft --verify-tag \
              --title "Molt $VERSION" \
              --notes-file dist/publish/RELEASE_NOTES.md
          fi
          gh release upload "$tag" dist/publish/* --clobber
          mkdir -p dist/remote
          gh release download "$tag" --dir dist/remote
          python -m tools.release.release_authority verify-promotion \
            --local dist/publish --remote dist/remote
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -f make_latest=true >/dev/null
