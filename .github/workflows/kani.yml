name: Kani verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  kani-verification:
    name: Kani bounded verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.1
      - name: Rust cache
        uses: swatinem/rust-cache@v2
      - name: Install Kani
        run: |
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE -- cargo install --locked kani-verifier
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE -- cargo kani setup
      - name: Check Kani toolchain compatibility
        id: kani-toolchain
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          root = pathlib.Path.cwd()
          workspace_manifest = tomllib.loads((root / "Cargo.toml").read_text())
          workspace_rust_version = workspace_manifest["workspace"]["package"]["rust-version"]
          manifests = [
              root / "runtime" / "molt-obj-model" / "Cargo.toml",
              root / "runtime" / "molt-runtime" / "Cargo.toml",
          ]

          def version_key(value: str) -> tuple[int, int, int]:
              parts = value.split(".")
              return tuple(int(part) for part in (*parts, "0", "0")[:3])

          def rust_version(path: pathlib.Path) -> str:
              package = tomllib.loads(path.read_text())["package"]
              value = package.get("rust-version")
              if isinstance(value, dict) and value.get("workspace"):
                  return workspace_rust_version
              if isinstance(value, str):
                  return value
              return workspace_rust_version

          required = max((rust_version(path) for path in manifests), key=version_key)
          toolchain_lines = subprocess.check_output(
              ["rustup", "toolchain", "list"], text=True
          ).splitlines()
          nightlies = [
              line.split()[0]
              for line in toolchain_lines
              if line.startswith("nightly-")
          ]
          if not nightlies:
              kani_toolchain = "<missing>"
              kani_rustc = "0.0.0"
          else:
              kani_toolchain = nightlies[0]
              rustc_line = subprocess.check_output(
                  ["rustc", f"+{kani_toolchain}", "--version"], text=True
              )
              match = re.search(r"rustc (\d+\.\d+\.\d+)", rustc_line)
              if not match:
                  raise SystemExit(f"could not parse rustc version from {rustc_line!r}")
              kani_rustc = match.group(1)

          run_kani = version_key(kani_rustc) >= version_key(required)
          output_path = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              print(f"run_kani={'true' if run_kani else 'false'}", file=output)
              print(f"required_rust={required}", file=output)
              print(f"kani_toolchain={kani_toolchain}", file=output)
              print(f"kani_rustc={kani_rustc}", file=output)

          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              print("### Kani toolchain gate", file=handle)
              print(f"- required Rust: `{required}`", file=handle)
              print(f"- Kani toolchain: `{kani_toolchain}`", file=handle)
              print(f"- Kani rustc: `{kani_rustc}`", file=handle)
              print(f"- run proofs: `{str(run_kani).lower()}`", file=handle)

          if not run_kani:
              print(
                  "::warning title=Kani rust-version gate::"
                  f"Skipping Kani proofs because {kani_toolchain} reports rustc "
                  f"{kani_rustc}, but the verified crates require Rust {required}."
              )
          PY
      - name: Run NaN-boxing proofs
        if: steps.kani-toolchain.outputs.run_kani == 'true'
        run: |
          # Kani 0.67 bundles its own Rust 1.93 nightly; Molt's
          # CI/toolchain floor stays at 1.96.1. The compatibility gate above
          # keeps this verifier honest until Kani's bundled rustc catches up.
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE --cwd runtime/molt-obj-model -- cargo kani --tests
      - name: Run runtime proofs
        if: steps.kani-toolchain.outputs.run_kani == 'true'
        run: |
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE --cwd runtime/molt-runtime -- cargo kani --tests --no-default-features
      - name: Report skipped Kani proofs
        if: steps.kani-toolchain.outputs.run_kani != 'true'
        run: |
          echo "Kani proofs skipped: Kani rustc ${{ steps.kani-toolchain.outputs.kani_rustc }} is older than required Rust ${{ steps.kani-toolchain.outputs.required_rust }}."
