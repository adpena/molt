name: Kani verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  kani-verification:
    name: Kani bounded verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.1
      - name: Rust cache
        uses: swatinem/rust-cache@v2
      - name: Install Kani
        run: |
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE -- cargo install --locked kani-verifier
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE -- cargo kani setup
      - name: Run NaN-boxing proofs
        run: |
          # Kani 0.67 bundles its own Rust 1.93 nightly; Molt's
          # CI/toolchain floor stays at 1.96.1.
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE --cwd runtime/molt-obj-model -- cargo kani --tests --ignore-rust-version
      - name: Run runtime proofs
        run: |
          # Keep the verifier-only opt-in scoped to cargo-kani instead of
          # weakening workspace rust-version.
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE --cwd runtime/molt-runtime -- cargo kani --tests --no-default-features --ignore-rust-version
