name: Kani compatibility and bounded verification

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 3"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  kani-verification:
    name: Kani compatibility and bounded verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.1
      - name: Rust cache
        uses: swatinem/rust-cache@v2
      - name: Install Kani
        run: |
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE -- cargo install --locked kani-verifier
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE -- cargo kani setup
      - name: Check Kani toolchain compatibility
        id: kani-toolchain
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          root = pathlib.Path.cwd()
          workspace_manifest = tomllib.loads((root / "Cargo.toml").read_text())
          workspace_rust_version = workspace_manifest["workspace"]["package"]["rust-version"]
          manifests = [
              root / "runtime" / "molt-obj-model" / "Cargo.toml",
              root / "runtime" / "molt-runtime" / "Cargo.toml",
          ]

          def version_key(value: str) -> tuple[int, int, int]:
              parts = value.split(".")
              return tuple(int(part) for part in (*parts, "0", "0")[:3])

          def rust_version(path: pathlib.Path) -> str:
              package = tomllib.loads(path.read_text())["package"]
              value = package.get("rust-version")
              if isinstance(value, dict) and value.get("workspace"):
                  return workspace_rust_version
              if isinstance(value, str):
                  return value
              return workspace_rust_version

          required = max((rust_version(path) for path in manifests), key=version_key)
          toolchain_lines = subprocess.check_output(
              ["rustup", "toolchain", "list"], text=True
          ).splitlines()
          nightlies = [
              line.split()[0]
              for line in toolchain_lines
              if line.startswith("nightly-")
          ]
          if not nightlies:
              kani_toolchain = "<missing>"
              kani_rustc = "0.0.0"
          else:
              kani_toolchain = nightlies[0]
              rustc_line = subprocess.check_output(
                  ["rustc", f"+{kani_toolchain}", "--version"], text=True
              )
              match = re.search(r"rustc (\d+\.\d+\.\d+)", rustc_line)
              if not match:
                  raise SystemExit(f"could not parse rustc version from {rustc_line!r}")
              kani_rustc = match.group(1)

          compatible = version_key(kani_rustc) >= version_key(required)
          output_path = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              print(f"compatible={'true' if compatible else 'false'}", file=output)
              print(f"required_rust={required}", file=output)
              print(f"kani_toolchain={kani_toolchain}", file=output)
              print(f"kani_rustc={kani_rustc}", file=output)

          result = {
              "schema": "molt.kani-proof-result.v1",
              "required_rust": required,
              "kani_toolchain": kani_toolchain,
              "kani_rustc": kani_rustc,
              "compatible": compatible,
              "proofs": {"nan_boxing": "not_run", "runtime": "not_run"},
              "executed_proof_commands": 0,
          }
          pathlib.Path("kani-proof-result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          if not compatible:
              raise SystemExit(
                  f"Kani proof unavailable: {kani_toolchain} reports Rust "
                  f"{kani_rustc}, but verified crates require Rust {required}; "
                  "zero executed proofs is a failure"
              )
          PY
      - name: Run NaN-boxing proofs
        id: nan-boxing
        run: |
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE --cwd runtime/molt-obj-model -- cargo kani --tests
      - name: Run runtime proofs
        id: runtime
        if: always() && steps.kani-toolchain.outcome == 'success'
        run: |
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE --cwd runtime/molt-runtime -- cargo kani --tests --no-default-features
      - name: Finalize Kani proof result
        if: always()
        env:
          NAN_BOXING_OUTCOME: ${{ steps.nan-boxing.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          path = pathlib.Path("kani-proof-result.json")
          result = json.loads(path.read_text()) if path.is_file() else {
              "schema": "molt.kani-proof-result.v1",
              "compatible": False,
              "proofs": {},
          }
          outcomes = {
              "nan_boxing": os.environ.get("NAN_BOXING_OUTCOME", "not_run"),
              "runtime": os.environ.get("RUNTIME_OUTCOME", "not_run"),
          }
          result["proofs"] = outcomes
          result["executed_proof_commands"] = sum(
              outcome in {"success", "failure"} for outcome in outcomes.values()
          )
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          PY
      - name: Upload Kani proof result
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kani-proof-result
          path: kani-proof-result.json
          if-no-files-found: error
