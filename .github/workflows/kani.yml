name: Kani Advisory Compatibility Probe

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 3"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  kani-compatibility-advisory:
    name: Kani advisory compatibility probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Setup Kani Rust toolchain
        uses: ./.github/actions/setup-project
        with:
          uv: "false"
          cache-uv: "false"
          rust-toolchain: "1.96.1"
          cache-cargo: "true"
          cache-namespace: kani
      - name: Install Kani
        run: |
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE -- cargo install --locked kani-verifier
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE -- cargo kani setup
      - name: Check Kani toolchain compatibility
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import tomllib

          root = pathlib.Path.cwd()
          workspace_manifest = tomllib.loads((root / "Cargo.toml").read_text())
          workspace_rust_version = workspace_manifest["workspace"]["package"]["rust-version"]
          manifests = [
              root / "runtime" / "molt-obj-model" / "Cargo.toml",
              root / "runtime" / "molt-runtime" / "Cargo.toml",
          ]

          def version_key(value: str) -> tuple[int, int, int]:
              parts = value.split(".")
              return tuple(int(part) for part in (*parts, "0", "0")[:3])

          def rust_version(path: pathlib.Path) -> str:
              package = tomllib.loads(path.read_text())["package"]
              value = package.get("rust-version")
              if isinstance(value, dict) and value.get("workspace"):
                  return workspace_rust_version
              if isinstance(value, str):
                  return value
              return workspace_rust_version

          required = max((rust_version(path) for path in manifests), key=version_key)
          toolchain_lines = subprocess.check_output(
              ["rustup", "toolchain", "list"], text=True
          ).splitlines()
          nightlies = [
              line.split()[0]
              for line in toolchain_lines
              if line.startswith("nightly-")
          ]
          if not nightlies:
              kani_toolchain = "<missing>"
              kani_rustc = "0.0.0"
          else:
              kani_toolchain = nightlies[0]
              rustc_line = subprocess.check_output(
                  ["rustc", f"+{kani_toolchain}", "--version"], text=True
              )
              match = re.search(r"rustc (\d+\.\d+\.\d+)", rustc_line)
              if not match:
                  raise SystemExit(f"could not parse rustc version from {rustc_line!r}")
              kani_rustc = match.group(1)

          compatible = version_key(kani_rustc) >= version_key(required)
          result = {
              "schema": "molt.kani-compatibility.v1",
              "authoritative": False,
              "required": False,
              "required_rust": required,
              "kani_toolchain": kani_toolchain,
              "kani_rustc": kani_rustc,
              "compatible": compatible,
              "status": "compatible" if compatible else "unavailable",
              "proofs_executed": 0,
              "next_action": (
                  "promote through the canonical proof plan only after the "
                  "verifier toolchain satisfies the workspace Rust floor"
              ),
          }
          pathlib.Path("kani-compatibility.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          if not compatible:
              print(
                  f"Kani proof unavailable: {kani_toolchain} reports Rust "
                  f"{kani_rustc}, but verified crates require Rust {required}; "
                  "this advisory probe does not claim bounded verification"
              )
          PY
      - name: Upload Kani advisory compatibility receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kani-advisory-compatibility
          path: kani-compatibility.json
          if-no-files-found: error
