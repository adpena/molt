name: deploy-modal

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Verified release tag to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-modal-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: modal-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}

      - name: Setup exact Modal deployment environment
        uses: ./.github/actions/setup-project

      - name: Synchronize locked Modal CLI
        run: uv sync --frozen --only-group deployment

      - name: Require protected Modal deployment credentials
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET"

      - name: Deploy Modal services from the verified release tag
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          uv run --no-sync modal deploy deploy/modal/falcon_ocr.py
          uv run --no-sync modal deploy deploy/modal/nemotron_ocr.py
