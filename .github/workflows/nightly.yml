name: Nightly

on:
  schedule:
    # Weekly Monday 4am UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-suite
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  molt-conformance-full:
    name: Molt Conformance Full
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup conformance toolchains
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: "1.96.1"
          cache-cargo: "true"
          sync: "true"
          sync-groups: dev

      - name: Add local venv tools to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run Molt conformance full suite
        run: |
          mkdir -p proof-receipts proof-results/nightly
          python3 tools/proof_plan.py --run-family nightly_conformance --receipt proof-receipts/nightly-conformance.json

      - name: Upload conformance artifact
        if: always() && hashFiles('proof-receipts/nightly-conformance.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: molt-conformance-full
          path: |
            proof-receipts/nightly-conformance.json
            proof-results/nightly/conformance.json
          if-no-files-found: error

  differential-basic-stdlib:
    name: Differential Basic And Stdlib
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup differential toolchains
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: "1.96.1"
          cache-cargo: "true"
          sync: "true"
          sync-groups: dev

      - name: Run differential correctness lane
        run: |
          mkdir -p proof-receipts proof-results/nightly
          python3 tools/proof_plan.py --run-family nightly_differential --receipt proof-receipts/nightly-differential.json

      - name: Upload differential artifact
        if: always() && hashFiles('proof-receipts/nightly-differential.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-differential-basic-stdlib
          path: |
            proof-receipts/nightly-differential.json
            proof-results/nightly/differential.json
          if-no-files-found: error

  regrtest:
    name: CPython Regrtest (G5)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup regrtest toolchains
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: "1.96.1"
          cache-cargo: "true"
          sync: "true"
          sync-frozen: "true"

      - name: Run CPython regrtest (G5)
        run: |
          mkdir -p proof-receipts proof-results/nightly/regrtest
          python3 tools/proof_plan.py --run-family nightly_regrtest --receipt proof-receipts/nightly-regrtest.json

      - name: Upload regrtest results
        if: always() && hashFiles('proof-receipts/nightly-regrtest.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regrtest-results
          path: |
            proof-receipts/nightly-regrtest.json
            proof-results/nightly/regrtest/**
          if-no-files-found: error

  determinism-sweep:
    name: Determinism Full Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup determinism toolchains
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: "1.96.1"
          cache-cargo: "true"
          sync: "true"
          sync-frozen: "true"

      - name: Run deterministic runtime and IR sweep
        run: |
          mkdir -p proof-receipts proof-results/nightly
          python3 tools/proof_plan.py --run-family nightly_determinism --receipt proof-receipts/nightly-determinism.json

      - name: Upload determinism proof results
        if: always() && hashFiles('proof-receipts/nightly-determinism.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-determinism-proof-results
          path: |
            proof-receipts/nightly-determinism.json
            proof-results/nightly/deterministic-runtime.json
            proof-results/nightly/ir-verification.json
          if-no-files-found: error

  formal-verification:
    name: Formal Verification
    uses: ./.github/workflows/formal.yml

  verification-gate-t3:
    name: Verification gate (Tier 3 - heavy)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Tier 3 toolchains
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: "1.96.1"
          cache-cargo: "true"
          sync: "true"
          sync-frozen: "true"

      - name: Setup canonical LLVM toolchain
        uses: ./.github/actions/setup-llvm

      - name: Run Tier 3 gate
        run: |
          mkdir -p proof-receipts proof-results/nightly
          python3 tools/proof_plan.py --run-family nightly_verification_t3 --receipt proof-receipts/nightly-verification-t3.json

      - name: Upload Tier 3 gate results
        if: always() && hashFiles('proof-receipts/nightly-verification-t3.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-tier3
          path: |
            proof-receipts/nightly-verification-t3.json
            proof-results/reproducibility-tier3.json
            proof-results/fuzz-compiler-extended.json
            proof-results/mutation-tier3.json
            proof-results/translation-tier3.json
          if-no-files-found: error

  nightly-verdict:
    name: Nightly receipt verdict
    if: always()
    needs:
      - molt-conformance-full
      - differential-basic-stdlib
      - regrtest
      - determinism-sweep
      - formal-verification
      - verification-gate-t3
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup receipt verifier
        uses: ./.github/actions/setup-project
        with:
          uv: "false"
          cache-uv: "false"

      - name: Download nightly proof artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: nightly-artifacts
          merge-multiple: true

      - name: Verify complete scheduled receipt closure
        run: python3 tools/proof_plan.py --verify-scheduled --receipt-dir nightly-artifacts
