name: Candidate runtime costs (evidence only)

# Controlled candidate-only numeric/list/shared-storage measurements: evidence
# with no comparative or release claim. The instruction signal on main runs on
# the farm (tools/perf_instructions.py, tools/PERF_AUTHORITY.md); the weekly
# CPython-floor board that lived here never produced a verdict (HF-222) and is
# retired. tools/check_perf_gate_wiring.py fails closed on trigger and
# cancellation drift and on a non-blocking candidate step.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-gate-controlled-measurement
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

jobs:
  candidate-runtime-costs:
    name: Candidate runtime costs (evidence only)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MOLT_SESSION_ID: candidate-cost-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup candidate cost toolchains
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: pinned
          cache-cargo: "true"
          cache-namespace: candidate-runtime-costs
          sync: "true"
          sync-frozen: "true"
      - name: Setup canonical native linker
        uses: ./.github/actions/setup-llvm
        with:
          profile: full
      - name: Collect candidate costs without a comparative or release claim
        run: python3 tools/proof_plan.py --tier scheduled --run-family runtime_candidate_costs --receipt proof-receipts/candidate-runtime-costs.json
      - name: Upload candidate cost evidence and rejected measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-runtime-costs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            proof-receipts/candidate-runtime-costs.json
            proof-receipts/evidence/candidate-runtime-costs/
            ${{ env.MOLT_CI_EPHEMERAL_CUSTODY_ROOT }}/tmp/harness_memory_guard/
          include-hidden-files: true
          if-no-files-found: error
      - name: Save Cargo dependency cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-cargo-cache
