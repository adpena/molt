name: Security Hardening

on:
  workflow_call:
    inputs:
      python_security:
        description: Run the Python dependency proof selected by the proof plan.
        required: false
        default: true
        type: boolean
      rust_security:
        description: Run the Rust dependency proof selected by the proof plan.
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      python_security:
        description: Run Python dependency audit
        required: false
        default: true
        type: boolean
      rust_security:
        description: Run Rust dependency audit
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python-security:
    if: github.event_name == 'schedule' || inputs.python_security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Setup project Python dependencies
        uses: ./.github/actions/setup-project
        with:
          sync: "true"
          sync-frozen: "true"
          sync-groups: dev
      - name: pip-audit
        run: uv run python3 tools/proof_plan.py --run-family python_security --receipt proof-receipts/python_security.json
      - name: Upload Python security receipt
        if: always() && hashFiles('proof-receipts/python_security.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-receipt-python-security
          path: proof-receipts/python_security.json
          if-no-files-found: error

  rust-security:
    if: github.event_name == 'schedule' || inputs.rust_security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/sessions/rust-security
      MOLT_SESSION_ID: rust-security-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Setup project Rust toolchain and cache
        uses: ./.github/actions/setup-project
        with:
          uv: "false"
          cache-uv: "false"
          rust-toolchain: "1.96.1"
          cache-cargo: "true"
      - name: Configure adaptive Rust parallelism
        run: python3 tools/ci_resource_env.py --github-env "$GITHUB_ENV"
      - name: Install cargo-deny and cargo-audit
        run: |
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE -- cargo install cargo-deny --version 0.20.2 --locked
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE -- cargo install cargo-audit --version 0.22.2 --locked
      - name: Execute Rust security partitions
        run: python3 tools/proof_plan.py --run-family rust_security --receipt proof-receipts/rust_security.json
      - name: Upload Rust security receipt
        if: always() && hashFiles('proof-receipts/rust_security.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-receipt-rust-security
          path: proof-receipts/rust_security.json
          if-no-files-found: error
