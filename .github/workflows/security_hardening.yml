name: Security Hardening

on:
  workflow_call:
    inputs:
      python_security:
        description: Run the Python dependency proof selected by the proof plan.
        required: false
        default: true
        type: boolean
      rust_security:
        description: Run the Rust dependency proof selected by the proof plan.
        required: false
        default: true
        type: boolean
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python-security:
    if: github.event_name != 'workflow_call' || inputs.python_security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.24"
      - name: Set up project Python
        run: uv python install "$(cat .python-version)"
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: pip-audit
        run: uv run python3 tools/proof_plan.py --run-family python_security --receipt proof-receipts/python_security.json
      - name: Upload Python security receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-receipt-python-security
          path: proof-receipts/python_security.json
          if-no-files-found: error

  rust-security:
    if: github.event_name != 'workflow_call' || inputs.rust_security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/sessions/rust-security
      MOLT_SESSION_ID: rust-security-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
      - name: Configure adaptive Rust parallelism
        run: python3 tools/ci_resource_env.py --github-env "$GITHUB_ENV"
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/sessions/rust-security"
      - name: Install cargo-deny and cargo-audit
        run: |
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE -- cargo install cargo-deny --version 0.20.2 --locked
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE -- cargo install cargo-audit --version 0.22.2 --locked
      - name: Execute Rust security partitions
        run: python3 tools/proof_plan.py --run-family rust_security --receipt proof-receipts/rust_security.json
      - name: Upload Rust security receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-receipt-rust-security
          path: proof-receipts/rust_security.json
          if-no-files-found: error
