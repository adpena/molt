name: Security Hardening

on:
  workflow_call:
    inputs:
      python_security:
        description: Run the Python dependency proof selected by the proof plan.
        required: false
        default: true
        type: boolean
      rust_security:
        description: Run the Rust dependency proof selected by the proof plan.
        required: false
        default: true
        type: boolean
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python-security:
    if: github.event_name != 'workflow_call' || inputs.python_security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"
      - name: Set up project Python
        run: uv python install "$(cat .python-version)"
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: pip-audit
        run: python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE -- uv run pip-audit --ignore-vuln CVE-2025-69872

  rust-security:
    if: github.event_name != 'workflow_call' || inputs.rust_security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/sessions/rust-security
      MOLT_SESSION_ID: rust-security-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
      - name: Configure adaptive Rust parallelism
        run: python3 tools/ci_resource_env.py --github-env "$GITHUB_ENV"
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/sessions/rust-security"
      - name: Install cargo-deny and cargo-audit
        run: |
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE -- cargo install cargo-deny --locked
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE -- cargo install cargo-audit --locked
      - name: cargo deny check
        run: python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE -- cargo deny check
      - name: cargo audit
        run: |
          rm -rf "${CARGO_HOME:-$HOME/.cargo}/advisory-db"
          python3 tools/guarded_exec.py --prefix MOLT_TEST_SUITE -- cargo audit
