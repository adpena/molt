name: Primitive instruction ratchet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: primitive-instructions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  primitive-instructions:
    # The integrator enables this ONE flag after reliable postsubmit landings.
    # A selected run always fails on a regression or a required ratchet update.
    if: github.event_name != 'pull_request' || vars.MOLT_PRIMITIVE_PRESUBMIT == 'true'
    runs-on: macos-14
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup primitive measurement toolchains
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: pinned
          cache-cargo: "true"
          cache-namespace: primitive-instructions
          sync: "true"
          sync-frozen: "true"
          sync-groups: bench, dev
      - name: Install the declared denominator
        run: |
          oracle=$(python3 -c 'from tools.perf_scoreboard_primitives import CPYTHON_SELECTOR; print(CPYTHON_SELECTOR)')
          UV_PYTHON_DOWNLOADS=manual uv python install "$oracle"
      - name: Measure and check the instruction ratchet
        run: >-
          python3 tools/proof_plan.py --tier scheduled
          --run-family primitive_instructions --receipt proof-receipts/primitive-instructions.json
      - name: Retain counters and the executable proof receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: primitive-instructions-${{ github.sha }}
          path: |
            proof-receipts/primitive-instructions.json
            proof-receipts/evidence/primitive-instructions/
          if-no-files-found: error
      - name: Save Cargo dependency cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-cargo-cache
