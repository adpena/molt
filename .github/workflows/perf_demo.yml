name: Perf Demo Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  demo-perf:
    runs-on: ubuntu-latest
    env:
      MOLT_SESSION_ID: perf-demo-${{ github.run_id }}-${{ github.run_attempt }}
      # One exclusive evidence directory per job attempt: the stack creates it
      # before startup and the regression check reads nothing else.
      MOLT_DEMO_RUN_DIR: ${{ github.workspace }}/bench/results/demo-runs/perf-demo-${{ github.run_id }}-${{ github.run_attempt }}
      MOLT_UV_SYNC: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup performance demo toolchains
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: pinned
          cache-cargo: "true"
          cache-namespace: perf-demo
          sync: "true"
          sync-frozen: "true"
          sync-dev: "true"
          sync-groups: demo
      - name: Install k6
        run: |
          if ! command -v k6 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl gnupg
            curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y k6
          fi
      - name: Run demo stack + k6
        run: |
          chmod +x bench/scripts/run_stack.sh
          ./bench/scripts/run_stack.sh
      - name: Check regressions (p95 thresholds)
        if: always()
        run: python bench/scripts/run_demo_bench.py --check-regressions "${MOLT_DEMO_RUN_DIR:?}"
      - name: Upload k6 artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-k6
          path: |
            ${{ env.MOLT_DEMO_RUN_DIR }}/
            logs/molt_django.log
            logs/molt_worker.log
            ${{ env.MOLT_CI_EPHEMERAL_CUSTODY_ROOT }}/tmp/harness_memory_guard/
            tmp/bench/demo/
      - name: Save Cargo dependency cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-cargo-cache
