name: Perf Demo Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  demo-perf:
    runs-on: ubuntu-latest
    env:
      MOLT_SESSION_ID: perf-demo-${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/sessions/perf-demo
      MOLT_DIFF_CARGO_TARGET_DIR: ${{ github.workspace }}/target/sessions/perf-demo
      MOLT_CACHE: ${{ github.workspace }}/.molt_cache
      TMPDIR: ${{ github.workspace }}/tmp
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      MOLT_UV_SYNC: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Setup performance demo toolchains
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: "1.96.1"
          cache-cargo: "true"
          cache-namespace: perf-demo
          sync: "true"
          sync-frozen: "true"
          sync-dev: "true"
      - name: Install k6
        run: |
          if ! command -v k6 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl gnupg
            curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y k6
          fi
      - name: Run demo stack + k6
        run: |
          chmod +x bench/scripts/run_stack.sh
          ./bench/scripts/run_stack.sh
      - name: Check regressions (p95 thresholds)
        run: |
          python - <<'PY'
          import json, sys, pathlib
          path = pathlib.Path("bench/results").glob("demo_k6_*.json")
          latest = sorted(path)[-1]
          data = json.loads(latest.read_text())
          def p95(block):
              return block.get("metrics", {}).get("http_req_duration", {}).get("percentiles", {}).get("95", 0.0)
          thresholds = {"baseline": 1000.0, "offload": 1000.0, "offload_table": 1500.0}
          for key, limit in thresholds.items():
              block = data.get(key, {})
              val = p95(block)
              if val > limit:
                  print(f"REGRESSION: {key} p95 {val}ms > {limit}ms")
                  sys.exit(1)
          print("Perf check OK")
          PY
      - name: Upload k6 artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-k6
          path: bench/results/*.json
