name: deploy-cloudflare

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Verified release tag to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}

      - name: Require protected Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Deploy exact Cloudflare Worker toolchain
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: deploy/cloudflare
          wranglerVersion: "4.148.0"
          command: deploy

      - name: Verify deployed health endpoint with bounded retry
        run: >-
          curl --fail --silent --show-error
          --retry 8 --retry-delay 2 --retry-all-errors
          --connect-timeout 10 --max-time 30
          https://falcon-ocr.adpena.workers.dev/health
