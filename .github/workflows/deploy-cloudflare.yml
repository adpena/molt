name: deploy-cloudflare

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Verified release tag to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}

      - name: Require protected Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Setup the deploy verifier's Python
        uses: ./.github/actions/setup-project
        with:
          cache-uv: "false"

      - name: Deploy exact Cloudflare Worker toolchain
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: deploy/cloudflare
          wranglerVersion: "4.151.3"
          command: deploy

      # /health answers 503 while the experimental edge model loads, so a bare
      # `curl --fail` on it failed every deploy. The falcon-ocr case set checks
      # what the Worker promises, read-only and free, retrying while it settles.
      - name: Verify the deployed Worker
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: >-
          uv run --frozen --no-dev python tools/cloudflare_demo_endpoint_verify.py
          --base-url "$DEPLOYMENT_URL" --case-set falcon-ocr --attempts 8
