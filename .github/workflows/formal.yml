name: Formal Verification

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MOLT_QUINT_NPM_PACKAGE: "@informalsystems/quint@0.32.0"
  MOLT_QUINT_RUST_EVALUATOR_VERSION: "v0.6.0"
  MOLT_QUINT_RUST_EVALUATOR_ASSET: "quint_evaluator-x86_64-unknown-linux-gnu.tar.gz"
  MOLT_QUINT_RUST_EVALUATOR_SHA256: "61755a09d5052d93a4e75e840059edfd0d3674aeda164b9d2464be3d6e21b1c2"

jobs:
  formal-lean:
    name: Lean Proof Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6.3.0
        with:
          python-version-file: ".python-version"

      - name: Setup exact Lean toolchain
        uses: ./.github/actions/setup-lean

      - name: Cache Lean build
        uses: actions/cache@v5
        with:
          path: |
            formal/lean/.lake
            formal/lean/lake-packages
          key: lean-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lakefile.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-

      - name: Build proofs
        run: python3 tools/proof_plan.py --run-command formal.lean.build --receipt proof-receipts/formal-lean.json
        timeout-minutes: 15

      - name: Upload Lean proof receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-receipt-formal-lean
          path: proof-receipts/formal-lean.json
          if-no-files-found: error

      - name: Check Lean sorry baseline
        run: python3 tools/proof_plan.py --run-command formal.lean.sorry-baseline --receipt proof-receipts/formal-lean-sorry.json

      - name: Upload Lean sorry receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-receipt-formal-lean-sorry
          path: proof-receipts/formal-lean-sorry.json
          if-no-files-found: error

  formal-quint:
    name: Quint Model Checking
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6.3.0
        with:
          python-version-file: ".python-version"

      - uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          check-latest: true

      - name: Install Quint
        run: npm install -g "$MOLT_QUINT_NPM_PACKAGE"

      - name: Install Quint Rust evaluator
        run: |
          set -euo pipefail
          evaluator_dir="$HOME/.quint/rust-evaluator-${MOLT_QUINT_RUST_EVALUATOR_VERSION}"
          asset_path="$RUNNER_TEMP/${MOLT_QUINT_RUST_EVALUATOR_ASSET}"
          mkdir -p "$evaluator_dir"
          curl --fail --location --show-error --silent --retry 5 --retry-delay 2 \
            "https://github.com/informalsystems/quint/releases/download/evaluator/${MOLT_QUINT_RUST_EVALUATOR_VERSION}/${MOLT_QUINT_RUST_EVALUATOR_ASSET}" \
            --output "$asset_path"
          echo "${MOLT_QUINT_RUST_EVALUATOR_SHA256}  ${asset_path}" | sha256sum --check
          tar -xzf "$asset_path" -C "$evaluator_dir"
          chmod +x "$evaluator_dir/quint_evaluator"
          "$evaluator_dir/quint_evaluator" --help >/dev/null

      - name: Verify all models
        run: python3 tools/proof_plan.py --run-command formal.quint.models --receipt proof-receipts/formal-quint.json

      - name: Upload Quint proof receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-receipt-formal-quint
          path: proof-receipts/formal-quint.json
          if-no-files-found: error

  formal-correspondence:
    name: Proof-Code Correspondence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6.3.0
        with:
          python-version-file: ".python-version"

      - name: Check NaN-box and Luau builtin correspondence
        run: python3 tools/proof_plan.py --run-command formal.correspondence --receipt proof-receipts/formal-correspondence.json

      - name: Upload correspondence receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-receipt-formal-correspondence
          path: proof-receipts/formal-correspondence.json
          if-no-files-found: error
