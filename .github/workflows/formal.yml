name: Formal Verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MOLT_QUINT_NPM_PACKAGE: "@informalsystems/quint@0.33.0"
  MOLT_QUINT_RUST_EVALUATOR_VERSION: "v0.7.0"
  MOLT_QUINT_RUST_EVALUATOR_ASSET: "quint_evaluator-x86_64-unknown-linux-gnu.tar.gz"
  MOLT_QUINT_RUST_EVALUATOR_SHA256: "869adb8762a518483eb39f67fde622253a58527494e15afe77d610a0b6dab7d2"

jobs:
  formal-lean:
    name: Lean Proof Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup project Python and Lean cache
        uses: ./.github/actions/setup-project
        with:
          cache-uv: "false"
          cache-lean: "true"

      - name: Setup exact Lean toolchain
        uses: ./.github/actions/setup-lean

      - name: Build proofs and check Lean sorry baseline
        run: python3 tools/proof_plan.py --run-command formal.lean.sorry-baseline --receipt proof-receipts/formal-lean.json

      - name: Upload Lean proof receipt
        if: always() && hashFiles('proof-receipts/formal-lean.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-receipt-formal-lean
          path: proof-receipts/formal-lean.json
          if-no-files-found: error

  formal-quint:
    name: Quint Model Checking
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup project Python and Node
        uses: ./.github/actions/setup-project
        with:
          cache-uv: "false"
          node-version: pinned

      - name: Install Quint
        run: npm install -g "$MOLT_QUINT_NPM_PACKAGE"

      - name: Install Quint Rust evaluator
        run: |
          set -euo pipefail
          evaluator_dir="$HOME/.quint/rust-evaluator-${MOLT_QUINT_RUST_EVALUATOR_VERSION}"
          asset_path="$RUNNER_TEMP/${MOLT_QUINT_RUST_EVALUATOR_ASSET}"
          mkdir -p "$evaluator_dir"
          curl --fail --location --show-error --silent --retry 5 --retry-delay 2 \
            "https://github.com/informalsystems/quint/releases/download/evaluator/${MOLT_QUINT_RUST_EVALUATOR_VERSION}/${MOLT_QUINT_RUST_EVALUATOR_ASSET}" \
            --output "$asset_path"
          echo "${MOLT_QUINT_RUST_EVALUATOR_SHA256}  ${asset_path}" | sha256sum --check
          tar -xzf "$asset_path" -C "$evaluator_dir"
          chmod +x "$evaluator_dir/quint_evaluator"
          "$evaluator_dir/quint_evaluator" --help >/dev/null

      - name: Verify all models
        run: python3 tools/proof_plan.py --run-command formal.quint.models --receipt proof-receipts/formal-quint.json

      - name: Upload Quint proof receipt
        if: always() && hashFiles('proof-receipts/formal-quint.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-receipt-formal-quint
          path: proof-receipts/formal-quint.json
          if-no-files-found: error

  formal-correspondence:
    name: Proof-Code Correspondence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup project Python
        uses: ./.github/actions/setup-project
        with:
          cache-uv: "false"

      - name: Check comprehensive source correspondence
        run: python3 tools/proof_plan.py --run-command formal.correspondence --receipt proof-receipts/formal-correspondence.json

      - name: Upload correspondence receipt
        if: always() && hashFiles('proof-receipts/formal-correspondence.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-receipt-formal-correspondence
          path: |
            proof-receipts/formal-correspondence.json
            proof-receipts/evidence/formal-correspondence.json
          if-no-files-found: error
