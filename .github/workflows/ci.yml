name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  MOLT_BACKEND_DAEMON_CACHE_MB: "128"

jobs:
  docs-gates:
    name: Docs Gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6.3.0
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.24"

      - uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: tools/browser_asset_graph/package-lock.json

      # Repository-policy generators render checked-in Rust and execute in
      # parallel. Provision their shared formatter once before the DAG so
      # rustup is never raced by first-use component installation.
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt

      - name: Sync Python environment
        run: uv sync --frozen --group dev

      - name: Provision browser asset parser
        run: uv run python3 tools/bootstrap_browser_asset_graph.py

      - name: Fetch performance freshness reference
        run: git fetch --no-tags --depth=1 origin main || true

      - name: Execute repository policy partitions
        run: python3 tools/proof_plan.py --run-family repository_policy --receipt proof-receipts/repository_policy.json

      - name: Upload repository policy receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-receipt-repository-policy
          path: proof-receipts/repository_policy.json
          if-no-files-found: error

      - name: Summarize guarded command hotspots
        if: always()
        run: python3 tools/profile_hotspots.py --limit 20

  classify-changes:
    name: Changed Path Classifier
    runs-on: ubuntu-latest
    outputs:
      repository_policy: ${{ steps.paths.outputs.repository_policy }}
      wasm: ${{ steps.paths.outputs.wasm }}
      python_static: ${{ steps.paths.outputs.python_static }}
      python_unit: ${{ steps.paths.outputs.python_unit }}
      native_integration: ${{ steps.paths.outputs.native_integration }}
      rust: ${{ steps.paths.outputs.rust }}
      llvm: ${{ steps.paths.outputs.llvm }}
      python_security: ${{ steps.paths.outputs.python_security }}
      rust_security: ${{ steps.paths.outputs.rust_security }}
      formal: ${{ steps.paths.outputs.formal }}
      matrix: ${{ steps.paths.outputs.matrix }}
      selected: ${{ steps.paths.outputs.selected }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        run: python3 tools/proof_plan.py --github-output "$GITHUB_OUTPUT"

  security-hardening:
    name: Security Hardening
    needs: classify-changes
    if: >-
      needs.classify-changes.outputs.python_security == 'true' ||
      needs.classify-changes.outputs.rust_security == 'true'
    uses: ./.github/workflows/security_hardening.yml
    with:
      python_security: ${{ needs.classify-changes.outputs.python_security == 'true' }}
      rust_security: ${{ needs.classify-changes.outputs.rust_security == 'true' }}

  formal-verification:
    name: Formal Verification
    needs: classify-changes
    if: needs.classify-changes.outputs.formal == 'true'
    uses: ./.github/workflows/formal.yml

  wasm-validation:
    name: WASM Validation
    needs: [classify-changes, rust-build-unit-smoke]
    if: always() && needs.classify-changes.outputs.wasm == 'true' && (needs.rust-build-unit-smoke.result == 'success' || needs.rust-build-unit-smoke.result == 'skipped')
    uses: ./.github/workflows/molt-wasm-ci.yml

  python-static:
    name: Python Static Authority
    needs: classify-changes
    if: needs.classify-changes.outputs.python_static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6.3.0
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.24"

      - name: Sync Python environment
        run: uv sync --frozen --group dev

      - name: Execute selected Python static partitions
        run: python3 tools/proof_plan.py --run-family python_static --receipt proof-receipts/python_static.json

      - name: Upload Python static receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-receipt-python-static
          path: proof-receipts/python_static.json
          if-no-files-found: error

      - name: Summarize guarded command hotspots
        if: always()
        run: python3 tools/profile_hotspots.py --limit 20

  python-unit:
    name: Python Unit Authority
    needs: [classify-changes, python-static]
    if: always() && needs.classify-changes.outputs.python_unit == 'true' && (needs.python-static.result == 'success' || needs.python-static.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6.3.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.24"
      - name: Sync Python environment
        run: uv sync --frozen --group dev
      - name: Execute selected Python unit partitions
        run: python3 tools/proof_plan.py --run-family python_unit --receipt proof-receipts/python_unit.json
      - name: Upload Python unit receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-receipt-python-unit
          path: proof-receipts/python_unit.json
          if-no-files-found: error

  native-integration:
    name: Native Integration Authority
    needs: [classify-changes, python-unit, rust-build-unit-smoke]
    if: always() && needs.classify-changes.outputs.native_integration == 'true' && (needs.python-unit.result == 'success' || needs.python-unit.result == 'skipped') && (needs.rust-build-unit-smoke.result == 'success' || needs.rust-build-unit-smoke.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6.3.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.24"
      - uses: dtolnay/rust-toolchain@1.96.1
      - name: Configure adaptive Rust parallelism
        run: python3 tools/ci_resource_env.py --github-env "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Setup canonical native linker SDK
        uses: ./.github/actions/setup-llvm
      - name: Sync Python environment
        run: uv sync --frozen --group dev
      - name: Execute selected native integration partitions
        run: python3 tools/proof_plan.py --run-family native_integration --receipt proof-receipts/native_integration.json
      - name: Upload native integration receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-receipt-native-integration
          path: proof-receipts/native_integration.json
          if-no-files-found: error

  rust-build-unit-smoke:
    name: Rust Build And Unit Smoke
    needs: classify-changes
    if: needs.classify-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-wasip1, aarch64-unknown-linux-gnu

      - name: Configure adaptive Rust parallelism
        run: python3 tools/ci_resource_env.py --github-env "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6.3.0
        with:
          python-version-file: ".python-version"
      - name: Execute selected Rust partitions
        run: python3 tools/proof_plan.py --run-family rust --receipt proof-receipts/rust.json

      - name: Upload Rust receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-receipt-rust
          path: proof-receipts/rust.json
          if-no-files-found: error

      - name: Summarize guarded command hotspots
        if: always()
        run: python3 tools/profile_hotspots.py --limit 20

  llvm-backend:
    name: LLVM Backend
    needs: classify-changes
    if: needs.classify-changes.outputs.llvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.96.1

      - name: Configure adaptive Rust parallelism
        run: python3 tools/ci_resource_env.py --github-env "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      # One local action owns package projection, versioned llvm-config
      # discovery, complete SDK verification, and environment projection.
      - name: Setup LLVM backend SDK
        uses: ./.github/actions/setup-llvm

      - uses: actions/setup-python@v6.3.0
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.24"

      - name: Sync Python environment
        run: uv sync --frozen --group dev

      - name: Execute selected LLVM, MLIR, and linker partitions
        run: python3 tools/proof_plan.py --run-family llvm --receipt proof-receipts/llvm.json

      - name: Upload LLVM/MLIR/linker receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-receipt-llvm
          path: proof-receipts/llvm.json
          if-no-files-found: error

      - name: Summarize guarded command hotspots
        if: always()
        run: python3 tools/profile_hotspots.py --limit 20

  proof-plan-verdict:
    name: Proof Plan Verdict
    if: always()
    needs:
      - docs-gates
      - classify-changes
      - python-static
      - python-unit
      - native-integration
      - rust-build-unit-smoke
      - llvm-backend
      - security-hardening
      - formal-verification
      - wasm-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download executable proof receipts
        if: needs.classify-changes.outputs.selected != '[]'
        uses: actions/download-artifact@v7
        with:
          pattern: proof-receipt-*
          path: proof-receipts
          merge-multiple: true
      - name: Fail closed on missing, skipped, failed, or zero-work required proofs
        run: >-
          python3 tools/proof_plan.py
          --verify-selected '${{ needs.classify-changes.outputs.selected }}'
          --receipt-dir proof-receipts
