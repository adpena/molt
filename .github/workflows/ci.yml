name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  # A dispatch proves the full main tier on any branch before it lands.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded PR revisions are disposable. Main and merge-queue proofs bind a
  # concrete commit SHA and must run to a terminal verdict.
  group: >-
    ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  MOLT_BACKEND_DAEMON_CACHE_MB: "128"

jobs:
  docs-gates:
    name: Docs Gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Full history: the commit-attribution policy reads every commit the
      # event introduces, and perf freshness checks real ancestry against the
      # fetched origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup repository policy toolchains
        uses: ./.github/actions/setup-project
        with:
          node-version: pinned
          node-cache-dependency-path: tools/browser_asset_graph/package-lock.json
          rust-toolchain: pinned
          rust-components: rustfmt, clippy
          rust-targets: wasm32-wasip1
          cache-cargo: "true"
          actionlint: "true"
          # The only all-version Unicode regeneration lane.
          target-pythons: "true"
          sync: "true"
          sync-frozen: "true"
          sync-groups: dev

      - name: Provision browser asset parser
        run: uv run python3 -m molt.checkout_provisioning ensure browser-acorn

      - name: Execute repository policy partitions
        run: python3 tools/proof_plan.py --run-family repository_policy --receipt proof-receipts/repository_policy.json

      - name: Upload common proof diagnostics
        id: build-control
        if: always()
        uses: ./.github/actions/upload-proof-diagnostics
        with:
          name: proof-diagnostics-guard-docs-gates

      - name: Upload repository policy receipt
        if: always() && (hashFiles('proof-receipts/repository_policy.json') != '' || hashFiles('proof-receipts/evidence/repository-docs-tests/*.json') != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-receipt-repository-policy
          path: |
            proof-receipts/repository_policy.json
            proof-receipts/evidence/repository-docs-tests
          if-no-files-found: error

      # Main-tier rows write the four source-addressed E4 release criterion
      # receipts that release-exit assembly consumes.
      - name: Upload E4 release criterion receipts
        if: always() && hashFiles('proof-receipts/evidence/e4/*.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-e4-receipts-${{ github.sha }}
          path: |
            proof-receipts/evidence/e4/canonicalization_contract.json
            proof-receipts/evidence/e4/degrade_to_slow_gate.json
            proof-receipts/evidence/e4/fail_closed_gate.json
            proof-receipts/evidence/e4/structural_audit.json
          if-no-files-found: error

      - name: Summarize guarded command hotspots
        if: always()
        run: python3 tools/profile_hotspots.py --limit 20
      - name: Save Cargo dependency cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-cargo-cache

  classify-changes:
    name: Changed Path Classifier
    runs-on: ubuntu-latest
    outputs:
      repository_policy: ${{ steps.paths.outputs.repository_policy }}
      wasm: ${{ steps.paths.outputs.wasm }}
      python_static: ${{ steps.paths.outputs.python_static }}
      python_unit: ${{ steps.paths.outputs.python_unit }}
      native_integration: ${{ steps.paths.outputs.native_integration }}
      rust: ${{ steps.paths.outputs.rust }}
      browser_simd: ${{ steps.paths.outputs.browser_simd }}
      llvm: ${{ steps.paths.outputs.llvm }}
      python_security: ${{ steps.paths.outputs.python_security }}
      rust_security: ${{ steps.paths.outputs.rust_security }}
      formal: ${{ steps.paths.outputs.formal }}
      platform_portability: ${{ steps.paths.outputs.platform_portability }}
      platform_portability_matrix: ${{ steps.paths.outputs.platform_portability_matrix }}
      python_unit_matrix: ${{ steps.paths.outputs.python_unit_matrix }}
      python_unit_collection: ${{ steps.paths.outputs.python_unit_collection }}
      python_unit_collection_matrix: ${{ steps.paths.outputs.python_unit_collection_matrix }}
      topology: ${{ steps.paths.outputs.topology }}
      selected: ${{ steps.paths.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        run: >-
          python3 tools/proof_plan.py --github-output "$GITHUB_OUTPUT"
          --selection-output logs/proof-selection/selection.json
          --receipt-dir proof-receipts

      - name: Preserve selected proof contract
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-selection-${{ github.run_attempt }}
          path: logs/proof-selection/selection.json
          if-no-files-found: error

  platform-portability:
    name: Platform Portability (${{ matrix.os }} / ${{ matrix.arch }})
    needs: classify-changes
    if: needs.classify-changes.outputs.platform_portability == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 182
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify-changes.outputs.platform_portability_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure proof-queue test roots
        shell: pwsh
        run: |
          # The queue's explicit build boundary must be short and disjoint
          # from the toolchain/venv boundary. The admitted envelope records its
          # device/inode; native path budgets still reject an unsuitable root.
          $cargoOutputRoot = Join-Path $env:RUNNER_TEMP "mq-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          New-Item -ItemType Directory -Force -Path $cargoOutputRoot | Out-Null
          "MOLT_PROOF_TEST_CARGO_OUTPUT_ROOT=$cargoOutputRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Metadata executable CAS remains in the result directory; keep it
          # short and disjoint from Cargo outputs and the toolchain/venv.
          $metadataRoot = Join-Path $env:RUNNER_TEMP "mr-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          New-Item -ItemType Directory -Force -Path $metadataRoot | Out-Null
          "MOLT_PROOF_TEST_METADATA_ROOT=$metadataRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup portability toolchains
        # The Windows image supplies clang-cl, MSVC and CMake for compiler-boundary probes.
        # Published-image tests copy the complete canonical development recipe.
        # The proof command captures its selected image tools before execution.
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: pinned
          node-version: ${{ contains(matrix.toolchains, 'node') && 'pinned' || '' }}
          cache-cargo: "true"
          sync: "true"
          sync-frozen: "true"
          sync-project-groups: "true"

      - name: Install completion test shells
        if: matrix.cell == 'linux-x86_64-py312-queue-portability'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fish zsh

      - name: Execute selected platform portability partition
        run: >-
          python tools/proof_plan.py
          --run-family platform_portability --receipt
          proof-receipts/platform-portability-${{ matrix.cell }}.json
          --matrix-cell "${{ matrix.cell }}"

      - name: Upload common proof diagnostics
        id: build-control
        if: always()
        uses: ./.github/actions/upload-proof-diagnostics
        with:
          name: proof-diagnostics-guard-platform-portability-${{ matrix.cell }}

      - name: Upload platform portability receipt
        if: always() && hashFiles(format('proof-receipts/platform-portability-{0}.json', matrix.cell)) != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-receipt-platform-portability-${{ matrix.cell }}
          path: proof-receipts/platform-portability-${{ matrix.cell }}.json
          if-no-files-found: error

      - name: Upload platform portability command diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-diagnostics-platform-portability-${{ matrix.cell }}
          path: |
            proof-receipts/platform-portability-${{ matrix.cell }}.json
            proof-receipts/evidence/runtime-gate-runs/
            ${{ env.CARGO_TARGET_DIR != '' && format('{0}/**/molt-test-artifacts/**/*.log', env.CARGO_TARGET_DIR) || '' }}
            ${{ env.MOLT_PROOF_TEST_METADATA_ROOT != '' && format('{0}/**/metadata-owner.json', env.MOLT_PROOF_TEST_METADATA_ROOT) || '' }}
            ${{ env.MOLT_PROOF_TEST_METADATA_ROOT != '' && format('{0}/**/*.supervisor-receipt.json', env.MOLT_PROOF_TEST_METADATA_ROOT) || '' }}
            ${{ env.MOLT_PROOF_TEST_METADATA_ROOT != '' && format('{0}/**/*.supervisor-receipt.json.[0-9]*.[0-9]*.tmp', env.MOLT_PROOF_TEST_METADATA_ROOT) || '' }}
            ${{ env.MOLT_PROOF_TEST_METADATA_ROOT != '' && format('{0}/**/*.supervisor-receipt.json.events.*.tmp', env.MOLT_PROOF_TEST_METADATA_ROOT) || '' }}
            ${{ env.MOLT_PROOF_TEST_METADATA_ROOT != '' && format('{0}/**/*.supervisor-receipt.json.events.*.jsonl', env.MOLT_PROOF_TEST_METADATA_ROOT) || '' }}
          include-hidden-files: true
          if-no-files-found: warn
      - name: Save Cargo dependency cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-cargo-cache

  security-hardening:
    name: Security Hardening
    needs: classify-changes
    if: >-
      needs.classify-changes.outputs.python_security == 'true' ||
      needs.classify-changes.outputs.rust_security == 'true'
    uses: ./.github/workflows/security_hardening.yml
    with:
      python_security: ${{ needs.classify-changes.outputs.python_security == 'true' }}
      rust_security: ${{ needs.classify-changes.outputs.rust_security == 'true' }}

  formal-verification:
    name: Formal Verification
    needs: classify-changes
    if: needs.classify-changes.outputs.formal == 'true'
    uses: ./.github/workflows/formal.yml

  wasm-validation:
    name: WASM Validation
    needs: classify-changes
    if: needs.classify-changes.outputs.wasm == 'true'
    uses: ./.github/workflows/molt-wasm-ci.yml

  python-static:
    name: Python Static Authority
    needs: classify-changes
    if: needs.classify-changes.outputs.python_static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python static toolchain
        uses: ./.github/actions/setup-project
        with:
          sync: "true"
          sync-frozen: "true"
          sync-groups: dev

      - name: Execute selected Python static partitions
        run: python3 tools/proof_plan.py --run-family python_static --receipt proof-receipts/python_static.json

      - name: Upload common proof diagnostics
        id: build-control
        if: always()
        uses: ./.github/actions/upload-proof-diagnostics
        with:
          name: proof-diagnostics-guard-python-static

      - name: Upload Python static receipt
        if: always() && hashFiles('proof-receipts/python_static.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-receipt-python-static
          path: proof-receipts/python_static.json
          if-no-files-found: error

      - name: Summarize guarded command hotspots
        if: always()
        run: python3 tools/profile_hotspots.py --limit 20

  python-unit:
    name: Python Unit Authority (${{ matrix.os }} / ${{ matrix.arch }})
    needs: classify-changes
    if: needs.classify-changes.outputs.python_unit == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 43
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify-changes.outputs.python_unit_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runtime fixtures must live outside the compiler source tree.
      - name: Setup Python unit toolchain
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: pinned
          sync: "true"
          sync-frozen: "true"
          sync-groups: dev
      # The dedicated Mac compiled cell preserves native and WASM witnesses.
      # Its native compiler uses Xcode custody; only the WASI SDK is needed here.
      - name: Setup Mac unit WASI SDK
        if: matrix.cell == 'macos-arm64-py312-compiled'
        uses: ./.github/actions/setup-llvm
        with:
          profile: wasm
          wasi: "true"
      - name: Setup Mac unit WASM optimizer
        if: matrix.cell == 'macos-arm64-py312-compiled'
        uses: ./.github/actions/setup-binaryen
      - name: Provision unit pinned Node
        if: contains(matrix.toolchains, 'node')
        run: uv run --no-sync python -m molt.tool_releases provision node
      - name: Provision Mac unit pinned WASM validator
        if: matrix.cell == 'macos-arm64-py312-compiled'
        run: uv run --no-sync python -m molt.tool_releases provision wasm-tools
      - name: Execute selected Python unit partitions
        run: >-
          python3 tools/proof_plan.py
          --run-family python_unit --receipt
          proof-receipts/python-unit-${{ matrix.cell }}.json
          --matrix-cell "${{ matrix.cell }}"
      - name: Upload common proof diagnostics
        id: build-control
        if: always()
        uses: ./.github/actions/upload-proof-diagnostics
        with:
          name: proof-diagnostics-guard-python-unit-${{ matrix.cell }}

      - name: Upload Python unit receipt
        if: always() && hashFiles(format('proof-receipts/python-unit-{0}.json', matrix.cell)) != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-receipt-python-unit-${{ matrix.cell }}
          path: |
            proof-receipts/python-unit-${{ matrix.cell }}.json
            proof-results/compiled-contracts/macos
          if-no-files-found: error

  python-unit-collection:
    # Native C object fixtures require the host image's clang.
    name: Python Unit Collection (${{ matrix.os }} / ${{ matrix.arch }})
    needs: classify-changes
    if: needs.classify-changes.outputs.python_unit_collection == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify-changes.outputs.python_unit_collection_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runtime fixtures must live outside the compiler source tree.
      - name: Setup Python unit toolchain
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: pinned
          sync: "true"
          sync-frozen: "true"
          sync-groups: dev
      - name: Execute the CLI import-collection suite
        run: >-
          python3 tools/proof_plan.py
          --run-family python_unit_collection --receipt
          proof-receipts/python-unit-collection-${{ matrix.cell }}.json
          --matrix-cell "${{ matrix.cell }}"
      - name: Upload common proof diagnostics
        id: build-control
        if: always()
        uses: ./.github/actions/upload-proof-diagnostics
        with:
          name: proof-diagnostics-guard-python-unit-collection-${{ matrix.cell }}

      - name: Upload Python unit collection receipt
        if: always() && hashFiles(format('proof-receipts/python-unit-collection-{0}.json', matrix.cell)) != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-receipt-python-unit-collection-${{ matrix.cell }}
          path: proof-receipts/python-unit-collection-${{ matrix.cell }}.json
          if-no-files-found: error

  native-integration:
    name: Native Integration Authority
    needs: classify-changes
    if: needs.classify-changes.outputs.native_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 63
    env:
      MOLT_GUARD_PROFILE: all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup native integration toolchains
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: pinned
          cache-cargo: "true"
          sync: "true"
          sync-frozen: "true"
          sync-groups: dev
      - name: Setup canonical native linker SDK
        uses: ./.github/actions/setup-llvm
        with:
          profile: "full"
          wasi: "true"
      - name: Execute selected native integration partitions
        run: python3 tools/proof_plan.py --run-family native_integration --receipt proof-receipts/native_integration.json
      - name: Upload common proof diagnostics
        id: build-control
        if: always()
        uses: ./.github/actions/upload-proof-diagnostics
        with:
          name: proof-diagnostics-guard-native-integration

      - name: Upload native integration receipt
        if: always() && hashFiles('proof-receipts/native_integration.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-receipt-native-integration
          path: proof-receipts/native_integration.json
          if-no-files-found: error
      - name: Upload native integration command diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-diagnostics-native-integration
          path: |
            proof-receipts/native_integration.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Save Cargo dependency cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-cargo-cache

  browser-simd:
    name: Browser SIMD Contract
    needs: classify-changes
    if: needs.classify-changes.outputs.browser_simd == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup standalone browser toolchains
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: pinned
          rust-targets: wasm32-unknown-unknown
          node-version: pinned
          cache-cargo: "true"
          sync: "true"
          sync-frozen: "true"
          sync-groups: dev
      - name: Execute browser SIMD contract
        run: python3 tools/proof_plan.py --run-family browser_simd --receipt proof-receipts/browser-simd.json
      - name: Upload common proof diagnostics
        id: build-control
        if: always()
        uses: ./.github/actions/upload-proof-diagnostics
        with:
          name: proof-diagnostics-guard-browser-simd

      - name: Upload browser SIMD receipt
        if: always() && hashFiles('proof-receipts/browser-simd.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-receipt-browser-simd
          path: proof-receipts/browser-simd.json
          if-no-files-found: error
      - name: Save Cargo dependency cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-cargo-cache

  rust-build-unit-smoke:
    name: Rust Build And Unit Smoke
    needs: classify-changes
    if: needs.classify-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 342
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust proof toolchains
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: pinned
          node-version: pinned
          rust-targets: wasm32-wasip1, wasm32-unknown-unknown, aarch64-unknown-linux-gnu
          cache-cargo: "true"

      - name: Setup canonical native LLVM and WASI SDK
        uses: ./.github/actions/setup-llvm
        with:
          profile: full
          wasi: "true"

      - name: Install pinned executable Luau proof runner
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python3 -m molt.tool_releases provision lune --github-path "$GITHUB_PATH"

      - name: Execute selected Rust partitions
        run: python3 tools/proof_plan.py --run-family rust --receipt proof-receipts/rust.json

      - name: Upload common proof diagnostics
        id: build-control
        if: always()
        uses: ./.github/actions/upload-proof-diagnostics
        with:
          name: proof-diagnostics-guard-rust-build-unit-smoke

      - name: Upload Rust receipt
        if: always() && hashFiles('proof-receipts/rust.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-receipt-rust
          path: |
            proof-receipts/rust.json
            proof-receipts/evidence/cargo-test-truth.json
          if-no-files-found: error

      - name: Upload Rust command diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-diagnostics-rust
          path: |
            proof-receipts/evidence/cargo-test-truth-runs/
            proof-receipts/evidence/runtime-gate-runs/
            proof-receipts/evidence/runtime-extension-admission/
            ${{ env.CARGO_TARGET_DIR != '' && format('{0}/**/molt-test-artifacts/**/*.log', env.CARGO_TARGET_DIR) || '' }}
            ${{ env.CARGO_TARGET_DIR != '' && format('{0}/**/cargo-timings/cargo-timing-*.html', env.CARGO_TARGET_DIR) || '' }}
          include-hidden-files: true
          if-no-files-found: warn

      - name: Summarize guarded command hotspots
        if: always()
        run: python3 tools/profile_hotspots.py --limit 20
      - name: Save Cargo dependency cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-cargo-cache

  llvm-backend:
    name: LLVM Backend
    env:
      MOLT_DEBUG_ARTIFACT_DIR: ${{ github.workspace }}/proof-receipts/evidence/llvm-backend-debug
    needs: classify-changes
    if: needs.classify-changes.outputs.llvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup LLVM proof toolchains
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: pinned
          cache-cargo: "true"
          sync: "true"
          sync-frozen: "true"
          sync-groups: dev

      # One local action owns package projection, versioned llvm-config
      # discovery, complete SDK verification, and environment projection.
      - name: Setup LLVM backend SDK
        uses: ./.github/actions/setup-llvm

      - name: Execute selected LLVM, MLIR, and linker partitions
        run: python3 tools/proof_plan.py --run-family llvm --receipt proof-receipts/llvm.json

      - name: Upload common proof diagnostics
        id: build-control
        if: always()
        uses: ./.github/actions/upload-proof-diagnostics
        with:
          name: proof-diagnostics-guard-llvm-backend

      - name: Upload LLVM/MLIR/linker receipt
        if: always() && hashFiles('proof-receipts/llvm.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-receipt-llvm
          path: |
            proof-receipts/llvm.json
            proof-receipts/evidence/llvm-differential-truth.json
            ${{ steps.build-control.outputs.root }}/build_failures/*.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload LLVM command diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-diagnostics-llvm
          path: |
            proof-receipts/llvm.json
            proof-receipts/evidence/llvm-differential-truth.json
            proof-receipts/evidence/llvm-backend-debug/native-batch-failures/
            proof-receipts/evidence/llvm-backend-debug/native-execution-failures/
            ${{ steps.build-control.outputs.root != '' && format('{0}/backend_daemon/*.log', steps.build-control.outputs.root) || '' }}
            ${{ steps.build-control.outputs.root != '' && format('{0}/backend_daemon/*.log.old', steps.build-control.outputs.root) || '' }}
          include-hidden-files: true
          if-no-files-found: warn

      - name: Summarize guarded command hotspots
        if: always()
        run: python3 tools/profile_hotspots.py --limit 20
      - name: Save Cargo dependency cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-cargo-cache

  proof-plan-verdict:
    name: Proof Plan Verdict
    if: always()
    needs:
      - docs-gates
      - classify-changes
      - python-static
      - python-unit
      - python-unit-collection
      - native-integration
      - platform-portability
      - rust-build-unit-smoke
      - browser-simd
      - llvm-backend
      - security-hardening
      - formal-verification
      - wasm-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup proof verdict Python
        uses: ./.github/actions/setup-project
        with:
          cache-uv: "false"
      - name: Download executable proof receipts
        if: needs.classify-changes.outputs.selected != '[]'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proof-receipt-*
          path: proof-receipts
          merge-multiple: true
      - name: Fail closed on missing, skipped, failed, or zero-work required proofs
        run: >-
          python3 tools/proof_plan.py
          --verify-selected '${{ needs.classify-changes.outputs.selected }}'
          --receipt-dir proof-receipts
