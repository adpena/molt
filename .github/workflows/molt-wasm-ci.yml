name: Molt WASM CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    wasm-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  wasm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      MOLT_EXT_ROOT: /tmp/molt-ext
      MOLT_CACHE: /tmp/molt-ext/molt_cache
      MOLT_DIFF_ROOT: /tmp/molt-ext/diff
      MOLT_DIFF_TMPDIR: /tmp/molt-ext/tmp
      MOLT_HOME: /tmp/molt-ext
      MOLT_WASM_RUNTIME_DIR: /tmp/molt-ext/wasm
      MOLT_WASM_TEST_USE_EXTERNAL: "1"
      MOLT_PREFER_EXTERNAL_ARTIFACTS: "1"
      MOLT_GUARD_PROFILE: all
      MOLT_WASM_TEST_KEEPALIVE_SEC: "20"
      MOLT_MEMORY_GUARD_TERMINATION_WAIT_SEC: "2"
      MOLT_SESSION_ID: wasm-ci-${{ github.run_id }}-${{ github.run_attempt }}
      MOLT_BUILD_LOCK_TIMEOUT: "120"
      TMPDIR: /tmp/molt-ext/tmp
      UV_CACHE_DIR: /tmp/molt-ext/uv-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare portable artifact root
        run: |
          mkdir -p /tmp/molt-ext/tmp
          mkdir -p /tmp/molt-ext/diff
          mkdir -p /tmp/molt-ext/molt_cache
          mkdir -p /tmp/molt-ext/uv-cache
          mkdir -p /tmp/molt-ext/wasm

      - name: Setup WASM project toolchains
        uses: ./.github/actions/setup-project
        with:
          node-version: pinned
          rust-toolchain: pinned
          rust-targets: wasm32-wasip1
          cache-cargo: "true"
          cache-namespace: wasm-ci
          sync: "true"
          sync-frozen: "true"
          sync-groups: source-build-numpy

      # setup-project placed CARGO_TARGET_DIR under RUNNER_TEMP, outside the
      # checkout; the WASM parity tests build into the same cached target.
      - name: Share the Cargo target with the WASM tests
        run: printf 'MOLT_WASM_TEST_CARGO_TARGET_DIR=%s\n' "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"

      - name: Install WASM validator
        run: python3 -m molt.tool_releases provision wasm-tools --github-path "$GITHUB_PATH"

      - name: Install pinned executable Luau proof runner
        run: python3 -m molt.tool_releases provision lune --github-path "$GITHUB_PATH"

      - name: Setup canonical WASM optimizer
        id: binaryen
        uses: ./.github/actions/setup-binaryen

      - name: Setup canonical native and WASM linker SDK
        uses: ./.github/actions/setup-llvm
        with:
          profile: full
          wasi: "true"

      - name: Resolve build-control evidence custody
        id: build-control
        shell: bash
        run: |
          uv run --no-sync python -m tools.build_control_path >> "$GITHUB_OUTPUT"

      - name: Execute WASM, Luau, and parity partitions
        env:
          MOLT_WASM_OPT: ${{ steps.binaryen.outputs.wasm_opt }}
        run: python3 tools/proof_plan.py --run-family wasm --receipt proof-receipts/wasm.json

      - name: Upload WASM receipt
        if: always() && hashFiles('proof-receipts/wasm.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-receipt-wasm
          path: |
            proof-receipts/wasm.json
            ${{ steps.build-control.outputs.root }}/build_failures/*.json
            ${{ steps.build-control.outputs.root }}/runtime_wasm_generations/*.json
            /tmp/molt-ext/wasm/*.json
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload WASM command diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-diagnostics-wasm
          path: |
            proof-receipts/wasm.json
            ${{ steps.build-control.outputs.profile_log }}
            ${{ steps.build-control.outputs.profile_log != '' && format('{0}.1', steps.build-control.outputs.profile_log) || '' }}
            ${{ steps.build-control.outputs.guard_state_root != '' && format('{0}/commands/**/*.json', steps.build-control.outputs.guard_state_root) || '' }}
            ${{ steps.build-control.outputs.pytest_guard_root != '' && format('{0}/**/*.json', steps.build-control.outputs.pytest_guard_root) || '' }}
          if-no-files-found: warn
          include-hidden-files: true

      - name: Summarize guarded command hotspots
        if: always()
        run: python3 tools/profile_hotspots.py --limit 20
      - name: Save Cargo dependency cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-cargo-cache
