name: Molt WASM CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    wasm-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  wasm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      MOLT_EXT_ROOT: /tmp/molt-ext
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/sessions/wasm-ci
      MOLT_DIFF_CARGO_TARGET_DIR: ${{ github.workspace }}/target/sessions/wasm-ci
      MOLT_CACHE: /tmp/molt-ext/molt_cache
      MOLT_DIFF_ROOT: /tmp/molt-ext/diff
      MOLT_DIFF_TMPDIR: /tmp/molt-ext/tmp
      MOLT_HOME: /tmp/molt-ext
      MOLT_WASM_RUNTIME_DIR: /tmp/molt-ext/wasm
      MOLT_WASM_TEST_CARGO_TARGET_DIR: ${{ github.workspace }}/target/sessions/wasm-ci
      MOLT_WASM_TEST_USE_EXTERNAL: "1"
      MOLT_WASM_TEST_CHILD_RLIMIT_GB: "0"
      MOLT_WASM_TEST_KEEPALIVE_SEC: "20"
      MOLT_MEMORY_GUARD_TERMINATION_WAIT_SEC: "2"
      MOLT_SESSION_ID: wasm-ci-${{ github.run_id }}-${{ github.run_attempt }}
      MOLT_BUILD_LOCK_TIMEOUT: "120"
      CARGO_INCREMENTAL: "1"
      TMPDIR: /tmp/molt-ext/tmp
      UV_CACHE_DIR: /tmp/molt-ext/uv-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6.3.0
        with:
          python-version-file: ".python-version"

      - name: Prepare portable artifact root
        run: |
          mkdir -p /tmp/molt-ext/tmp
          mkdir -p /tmp/molt-ext/diff
          mkdir -p /tmp/molt-ext/molt_cache
          mkdir -p /tmp/molt-ext/uv-cache
          mkdir -p "$CARGO_TARGET_DIR"
          mkdir -p /tmp/molt-ext/wasm

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.24"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up project Python
        run: uv python install "$(cat .python-version)"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-wasip1

      - name: Configure adaptive Rust parallelism
        run: python3 tools/ci_resource_env.py --github-env "$GITHUB_ENV"

      - name: Install WASM validator
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: wasm-tools@1.253.0
          fallback: none

      - name: Setup canonical native and WASM linker SDK
        uses: ./.github/actions/setup-llvm

      - name: Install WASI libc
        run: |
          sudo apt-get update
          sudo apt-get install -y wasi-libc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/sessions/wasm-ci"

      - name: Execute WASM, Luau, and parity partitions
        run: python3 tools/proof_plan.py --run-family wasm --receipt proof-receipts/wasm.json

      - name: Upload WASM receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-receipt-wasm
          path: proof-receipts/wasm.json
          if-no-files-found: error

      - name: Summarize guarded command hotspots
        if: always()
        run: python3 tools/profile_hotspots.py --limit 20
