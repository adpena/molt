# Keeps every locked dependency at its newest release that has been public
# for 7 days (owner directive: latest everywhere, under the release-age rule).
# `cooldown` holds each version update until the release is 7 days old.
# Security updates skip cooldown, but uv and npm apply the same rule themselves
# (pyproject's [tool.uv] exclude-newer, each npm project's .npmrc), so a fix
# younger than 7 days cannot lock: it enters through a hand-written, dated
# exemption (docs/DEVELOPER_GUIDE.md, "Release-age rule"), and
# `tools/pin_freshness.py --audit` reports the advisory. Toolchain pins in
# config/ and rust-toolchain.toml move through `tools/pin_freshness.py`, whose
# weekly `security.pin-freshness` family fails when a pin falls behind; it
# also checks the ages of these Action pins.
# tests/test_dependabot_config.py keeps these directories equal to the
# tracked manifests and the cooldown equal to the tool's rule.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directories:
      - "/"
      - "/deploy/browser/simd-ops-rs"
      - "/fuzz"
      - "/runtime/molt-backend-mlir"
      - "/runtime/molt-backend/fuzz"
      - "/runtime/molt-runtime/fuzz"
      - "/tools/proof_supervisor"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - "/deploy/cloudflare"
      - "/examples/edgebox/packages/edgebox-cloudflare"
      - "/tools/browser_asset_graph"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]
