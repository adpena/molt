# Keeps every locked dependency at its newest release (owner directive:
# latest everywhere, kept current by automation). Toolchain pins in config/
# and rust-toolchain.toml move through `tools/pin_freshness.py`, whose weekly
# `security.pin-freshness` family fails when a pin falls behind.
# tests/test_dependabot_config.py keeps these directories equal to the
# tracked manifests.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directories:
      - "/"
      - "/deploy/browser/simd-ops-rs"
      - "/fuzz"
      - "/runtime/molt-backend-mlir"
      - "/runtime/molt-backend/fuzz"
      - "/runtime/molt-runtime/fuzz"
      - "/tools/proof_supervisor"
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      uv:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - "/deploy/cloudflare"
      - "/examples/edgebox/packages/edgebox-cloudflare"
      - "/tools/browser_asset_graph"
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
