name: Setup exact Lean toolchain
description: Install elan and provision the repository-pinned Lean toolchain

runs:
  using: composite
  steps:
    - name: Install elan launcher
      shell: bash
      run: |
        set -euo pipefail
        installer_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/molt-elan.XXXXXX")"
        installer_archive="$installer_dir/elan.tar.gz"
        python3 -m tools.release.fetch_pinned_tool \
          --tool elan \
          --target x86_64-unknown-linux-gnu \
          --output "$installer_archive"
        tar -xzf "$installer_archive" -C "$installer_dir" elan-init
        "$installer_dir/elan-init" -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    - name: Provision exact Lean toolchain
      shell: bash
      run: |
        set -euo pipefail
        toolchain="$(tr -d '\r\n' < formal/lean/lean-toolchain)"
        if [[ ! "$toolchain" =~ ^leanprover/lean4:v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "invalid formal/lean/lean-toolchain authority: $toolchain" >&2
          exit 2
        fi
        elan="$HOME/.elan/bin/elan"
        if ! "$elan" run "$toolchain" lean --version >/dev/null 2>&1; then
          "$elan" toolchain install "$toolchain"
        fi
        expected_version="${toolchain##*:v}"
        exact_version="$("$elan" run "$toolchain" lean --version)"
        if [[ "$exact_version" != "Lean (version $expected_version,"* ]]; then
          echo "Lean toolchain identity mismatch: expected $toolchain, got $exact_version" >&2
          exit 3
        fi
        selected_version="$(cd formal/lean && "$HOME/.elan/bin/lean" --version)"
        if [[ "$selected_version" != "$exact_version" ]]; then
          echo "formal/lean selected $selected_version instead of $exact_version" >&2
          exit 4
        fi
        printf '%s\n' "$selected_version"
