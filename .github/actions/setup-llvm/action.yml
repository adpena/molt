name: Setup canonical LLVM and WASI SDK
description: Install and verify Molt's manifest-owned LLVM profile and host wasi-sdk

inputs:
  profile:
    description: Full Linux LLVM/MLIR SDK, or the wasi-sdk-only WebAssembly profile
    required: false
    default: full
  wasi:
    description: Provision and verify the manifest-owned host wasi-sdk
    required: false
    default: "false"

outputs:
  major:
    description: Required LLVM major version
    value: ${{ steps.contract.outputs.major }}
  env_var:
    description: llvm-sys prefix environment variable
    value: ${{ steps.contract.outputs.env_var }}
  wasi_sdk:
    description: Verified identity-addressed wasi-sdk install prefix when wasi=true
    value: ${{ steps.wasi-sdk.outputs.install }}
  wasi_sysroot:
    description: WASI sysroot inside that verified wasi-sdk when wasi=true
    value: ${{ steps.wasi-sdk.outputs.sysroot }}

runs:
  using: composite
  steps:
    - name: Validate SDK profile
      shell: bash
      env:
        LLVM_PROFILE: ${{ inputs.profile }}
        PROVISION_WASI: ${{ inputs.wasi }}
      run: |
        set -euo pipefail
        case "$LLVM_PROFILE" in
          full|wasm) ;;
          *) printf 'unsupported LLVM SDK profile: %s\n' "$LLVM_PROFILE" >&2; exit 2 ;;
        esac
        case "$PROVISION_WASI" in
          true|false) ;;
          *) printf 'wasi input must be true or false: %s\n' "$PROVISION_WASI" >&2; exit 2 ;;
        esac
        if [ "$LLVM_PROFILE" = "wasm" ] && [ "$PROVISION_WASI" != "true" ]; then
          printf 'the wasm SDK profile requires wasi=true\n' >&2
          exit 2
        fi

    - name: Resolve SDK contract
      id: contract
      shell: bash
      run: |
        set -euo pipefail
        PYTHONPATH=src python -m molt.llvm_toolchain \
          --github-output "$GITHUB_OUTPUT"

    - name: Provision full LLVM SDK packages
      if: inputs.profile == 'full'
      shell: bash
      env:
        LLVM_MAJOR: ${{ steps.contract.outputs.major }}
        LLVM_APT_PACKAGES: ${{ steps.contract.outputs.apt_packages }}
        LLVM_APT_INSTALLER_URL: ${{ steps.contract.outputs.apt_installer_url }}
        LLVM_APT_INSTALLER_SHA256: ${{ steps.contract.outputs.apt_installer_sha256 }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" != "Linux" ]; then
          printf 'the full LLVM SDK package profile is Linux-only: %s\n' "$RUNNER_OS" >&2
          exit 2
        fi
        installer="$RUNNER_TEMP/molt-llvm-apt.sh"
        curl --fail --location --proto '=https' --tlsv1.2 \
          --output "$installer" "$LLVM_APT_INSTALLER_URL"
        printf '%s  %s\n' "$LLVM_APT_INSTALLER_SHA256" "$installer" \
          | sha256sum --check --strict
        chmod +x "$installer"
        sudo "$installer" "$LLVM_MAJOR"
        read -r -a packages <<< "$LLVM_APT_PACKAGES"
        sudo apt-get install -y "${packages[@]}"

    # The archive cache is keyed by the host asset's manifest digest; the
    # provisioner still re-verifies size and SHA-256 before any reuse.
    - name: Restore verified wasi-sdk archive
      if: inputs.wasi == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/molt-wasi-sdk-downloads
        key: ${{ steps.contract.outputs.wasi_sdk_cache_key }}

    - name: Provision pinned host wasi-sdk
      if: inputs.wasi == 'true'
      id: wasi-sdk
      shell: bash
      run: |
        set -euo pipefail
        PYTHONPATH=src python -m tools.provision_wasi_sdk \
          --toolchain-root "$RUNNER_TEMP/molt-toolchains" \
          --downloads "$RUNNER_TEMP/molt-wasi-sdk-downloads" \
          --github-output "$GITHUB_OUTPUT"

    - name: Verify and project full SDK identity
      if: inputs.profile == 'full'
      shell: bash
      run: |
        set -euo pipefail
        PYTHONPATH=src python -m molt.llvm_toolchain \
          --verify \
          --format json \
          --github-env "$GITHUB_ENV"

    # Explicit WASM selectors preserve the native SDK's PATH and compiler policy.
    - name: Verify and project WebAssembly SDK identity
      if: inputs.wasi == 'true'
      shell: bash
      env:
        WASI_SDK_INSTALL: ${{ steps.wasi-sdk.outputs.install }}
      run: |
        set -euo pipefail
        test -n "$WASI_SDK_INSTALL"
        PYTHONPATH=src python -m molt.llvm_toolchain \
          --verify-wasm \
          --wasi-sdk "$WASI_SDK_INSTALL" \
          --format json \
          --github-env "$GITHUB_ENV"
