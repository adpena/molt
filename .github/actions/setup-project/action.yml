name: Setup Molt project toolchains
description: Canonical Python, uv, Node, Rust, and cache bootstrap authority

inputs:
  python:
    description: Install the repository Python toolchain
    default: "true"
  uv:
    description: Install exact uv
    default: "true"
  node-version:
    description: Optional exact Node version
    default: ""
  node-cache-dependency-path:
    description: Optional npm lockfile path
    default: ""
  rust-toolchain:
    description: Optional exact Rust toolchain
    default: ""
  rust-components:
    description: Optional Rust components
    default: ""
  rust-targets:
    description: Optional Rust targets
    default: ""
  cache-uv:
    description: Cache uv downloads
    default: "true"
  cache-cargo:
    description: Cache Cargo registry and git source downloads
    default: "false"
  cache-lean:
    description: Cache Lean lake artifacts
    default: "false"
  cache-namespace:
    description: Bounded caller cache namespace
    default: "project"
  actionlint:
    description: Provision the exact cached actionlint release
    default: "false"
  sync:
    description: Synchronize project dependencies with uv
    default: "false"
  sync-frozen:
    description: Require the lockfile to remain unchanged during sync
    default: "false"
  sync-dev:
    description: Include uv's development dependency group
    default: "false"
  sync-groups:
    description: Optional comma-separated dependency groups
    default: ""

outputs:
  rust-toolchain:
    description: Exact normalized Rust toolchain selected by this setup
    value: ${{ steps.inputs.outputs.rust-toolchain }}

runs:
  using: composite
  steps:
    - name: Normalize and validate bootstrap inputs
      id: inputs
      shell: bash
      env:
        INPUT_PYTHON: ${{ inputs.python }}
        INPUT_UV: ${{ inputs.uv }}
        INPUT_CACHE_UV: ${{ inputs.cache-uv }}
        INPUT_CACHE_CARGO: ${{ inputs.cache-cargo }}
        INPUT_CACHE_LEAN: ${{ inputs.cache-lean }}
        INPUT_CACHE_NAMESPACE: ${{ inputs.cache-namespace }}
        INPUT_ACTIONLINT: ${{ inputs.actionlint }}
        INPUT_RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        INPUT_RUST_COMPONENTS: ${{ inputs.rust-components }}
        INPUT_RUST_TARGETS: ${{ inputs.rust-targets }}
        INPUT_SYNC: ${{ inputs.sync }}
        INPUT_SYNC_FROZEN: ${{ inputs.sync-frozen }}
        INPUT_SYNC_DEV: ${{ inputs.sync-dev }}
        INPUT_SYNC_GROUPS: ${{ inputs.sync-groups }}
      run: bash .github/actions/setup-project/normalize-inputs.sh "$GITHUB_OUTPUT"

    - name: Install repository Python
      if: steps.inputs.outputs.python == 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version-file: .python-version

    - name: Install exact uv
      if: steps.inputs.outputs.uv == 'true'
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        version: "0.11.24"

    - name: Install exact Node with npm cache
      if: inputs.node-version != '' && inputs.node-cache-dependency-path != ''
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.node-cache-dependency-path }}

    - name: Install exact Node
      if: inputs.node-version != '' && inputs.node-cache-dependency-path == ''
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install exact Rust
      if: steps.inputs.outputs.rust-toolchain != ''
      shell: bash
      env:
        RUST_TOOLCHAIN: ${{ steps.inputs.outputs.rust-toolchain }}
        RUST_COMPONENTS: ${{ steps.inputs.outputs.rust-components }}
        RUST_TARGETS: ${{ steps.inputs.outputs.rust-targets }}
      run: |
        set -euo pipefail
        args=(--profile minimal)
        if [[ -n "$RUST_COMPONENTS" ]]; then
          IFS=',' read -r -a components <<< "$RUST_COMPONENTS"
          for component in "${components[@]}"; do
            args+=(--component "$component")
          done
        fi
        if [[ -n "$RUST_TARGETS" ]]; then
          IFS=',' read -r -a targets <<< "$RUST_TARGETS"
          for target in "${targets[@]}"; do
            args+=(--target "$target")
          done
        fi
        rustup toolchain install "$RUST_TOOLCHAIN" "${args[@]}"
        rustup default "$RUST_TOOLCHAIN"
        rustc --version --verbose

    - name: Cache uv downloads
      if: steps.inputs.outputs.cache-uv == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/uv
        key: >-
          uv-${{ steps.inputs.outputs.cache-namespace }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.python-version',
          'pyproject.toml', 'uv.lock') }}

    - name: Cache Cargo source downloads
      if: steps.inputs.outputs.cache-cargo == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: >-
          cargo-${{ steps.inputs.outputs.cache-namespace }}-${{ runner.os }}-${{ runner.arch }}-${{
          steps.inputs.outputs.rust-cache-token }}-${{
          hashFiles('rust-toolchain.toml',
          'Cargo.lock', 'Cargo.toml', '.cargo/config.toml',
          'config/llvm_toolchain_releases.toml', 'config/llvm_toolchain_arches.toml') }}

    - name: Cache Lean lake artifacts
      if: steps.inputs.outputs.cache-lean == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.elan/toolchains
          ~/.elan/update-hashes
          formal/lean/.lake
          formal/lean/lake-packages
        key: >-
          lean-${{ steps.inputs.outputs.cache-namespace }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal/lean/lean-toolchain',
          'formal/lean/lakefile.lean') }}

    - name: Cache actionlint toolchain
      if: steps.inputs.outputs.actionlint == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/molt/toolchains
        key: >-
          actionlint-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('config/actionlint.toml', 'tools/bootstrap_actionlint.py') }}

    - name: Provision exact actionlint
      if: steps.inputs.outputs.actionlint == 'true'
      shell: bash
      run: python3 tools/bootstrap_actionlint.py

    - name: Synchronize project dependencies
      if: steps.inputs.outputs.sync == 'true'
      shell: bash
      env:
        SYNC_FROZEN: ${{ steps.inputs.outputs.sync-frozen }}
        SYNC_DEV: ${{ steps.inputs.outputs.sync-dev }}
        SYNC_GROUPS: ${{ steps.inputs.outputs.sync-groups }}
      run: |
        set -euo pipefail
        args=(sync)
        [[ "$SYNC_FROZEN" != "true" ]] || args+=(--frozen)
        [[ "$SYNC_DEV" != "true" ]] || args+=(--dev)
        if [[ -n "$SYNC_GROUPS" ]]; then
          IFS=',' read -r -a groups <<< "$SYNC_GROUPS"
          for group in "${groups[@]}"; do
            args+=(--group "$group")
          done
        fi
        uv "${args[@]}"
