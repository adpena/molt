name: Setup Molt project toolchains
description: Canonical Python, uv, Node, Rust, and cache bootstrap authority

inputs:
  python:
    description: Install the repository Python toolchain
    default: "true"
  uv:
    description: Install exact uv
    default: "true"
  node-version:
    description: Optional exact Node version
    default: ""
  node-cache-dependency-path:
    description: Optional npm lockfile path
    default: ""
  rust-toolchain:
    description: Optional exact Rust toolchain
    default: ""
  rust-components:
    description: Optional Rust components
    default: ""
  rust-targets:
    description: Optional Rust targets
    default: ""
  cache-uv:
    description: Cache uv downloads
    default: "true"
  cache-cargo:
    description: Cache Cargo registry, git sources, and target
    default: "false"
  cache-lean:
    description: Cache Lean lake artifacts
    default: "false"
  cache-namespace:
    description: Bounded caller cache namespace
    default: "project"
  actionlint:
    description: Provision the exact cached actionlint release
    default: "false"
  sync-args:
    description: Optional arguments passed to uv sync
    default: ""

runs:
  using: composite
  steps:
    - name: Validate bootstrap inputs
      shell: bash
      run: |
        if [[ "${{ inputs.cache-uv }}" == "true" && "${{ inputs.uv }}" != "true" ]]; then
          echo "cache-uv requires uv" >&2
          exit 2
        fi
        if [[ -n "${{ inputs.sync-args }}" && "${{ inputs.uv }}" != "true" ]]; then
          echo "sync-args requires uv" >&2
          exit 2
        fi
        if [[ "${{ inputs.cache-cargo }}" == "true" && -z "${{ inputs.rust-toolchain }}" ]]; then
          echo "cache-cargo requires rust-toolchain" >&2
          exit 2
        fi
        if [[ "${{ inputs.actionlint }}" == "true" && "${{ inputs.python }}" != "true" ]]; then
          echo "actionlint requires python" >&2
          exit 2
        fi
    - name: Install repository Python
      if: inputs.python == 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version-file: .python-version

    - name: Install exact uv
      if: inputs.uv == 'true'
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        version: "0.11.24"

    - name: Install exact Node with npm cache
      if: inputs.node-version != '' && inputs.node-cache-dependency-path != ''
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.node-cache-dependency-path }}

    - name: Install exact Node
      if: inputs.node-version != '' && inputs.node-cache-dependency-path == ''
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install exact Rust
      if: inputs.rust-toolchain != ''
      uses: dtolnay/rust-toolchain@2fe4ca74464c5902a4f6e302d0a619b4ea911ccc # 1.96.1
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: ${{ inputs.rust-components }}
        targets: ${{ inputs.rust-targets }}

    - name: Cache uv downloads
      if: inputs.cache-uv == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/uv
        key: >-
          uv-${{ inputs.cache-namespace }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.python-version',
          'pyproject.toml', 'uv.lock') }}

    - name: Cache Cargo toolchain state
      if: inputs.cache-cargo == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: >-
          cargo-${{ inputs.cache-namespace }}-${{ runner.os }}-${{ runner.arch }}-${{
          inputs.rust-toolchain }}-${{ inputs.rust-components }}-${{ inputs.rust-targets }}-${{
          hashFiles('rust-toolchain.toml',
          'Cargo.lock', 'Cargo.toml', '.cargo/config.toml',
          'config/llvm_toolchain_releases.toml', 'config/llvm_toolchain_arches.toml') }}

    - name: Cache Lean lake artifacts
      if: inputs.cache-lean == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.elan/toolchains
          ~/.elan/update-hashes
          formal/lean/.lake
          formal/lean/lake-packages
        key: >-
          lean-${{ inputs.cache-namespace }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal/lean/lean-toolchain',
          'formal/lean/lakefile.lean') }}

    - name: Cache actionlint toolchain
      if: inputs.actionlint == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/molt/toolchains
        key: >-
          actionlint-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('config/actionlint.toml', 'tools/bootstrap_actionlint.py') }}

    - name: Provision exact actionlint
      if: inputs.actionlint == 'true'
      shell: bash
      run: python3 tools/bootstrap_actionlint.py

    - name: Synchronize project dependencies
      if: inputs.sync-args != ''
      shell: bash
      run: uv sync ${{ inputs.sync-args }}
