name: Setup Molt project toolchains
description: Canonical Python, uv, Node, Rust, and cache bootstrap authority

inputs:
  python:
    description: Install and verify exact uv-managed repository CPython (requires uv)
    default: "true"
  uv:
    description: Install exact uv
    default: "true"
  node-version:
    description: Optional Node; "pinned" installs the config/tool_releases.toml version
    default: ""
  node-cache-dependency-path:
    description: Optional npm lockfile path
    default: ""
  rust-toolchain:
    description: >-
      Optional Rust; "pinned" installs the complete rust-toolchain.toml manifest and
      "sanitizer-nightly" the config/rust_nightly_toolchain.txt nightly
    default: ""
  rust-components:
    description: Comma-separated Rust components added to the selected role
    default: ""
  rust-targets:
    description: Comma-separated Rust targets added to the selected role
    default: ""
  cache-uv:
    description: Cache uv downloads
    default: "true"
  cache-cargo:
    description: Cache non-incremental Cargo build artifacts and source downloads
    default: "false"
  cache-lean:
    description: Cache Lean lake artifacts
    default: "false"
  cache-namespace:
    description: Bounded caller cache namespace
    default: "project"
  actionlint:
    description: Provision the exact cached actionlint release
    default: "false"
  target-pythons:
    description: >-
      Install every supported target CPython line (molt.target_python) during
      setup; requires sync, because the authority imports project dependencies
    default: "false"
  sync:
    description: Synchronize project dependencies with uv
    default: "false"
  sync-frozen:
    description: Require the lockfile to remain unchanged during sync
    default: "false"
  sync-dev:
    description: Include uv's development dependency group
    default: "false"
  sync-groups:
    description: Optional comma-separated dependency groups
    default: ""

outputs:
  python-path:
    description: Exact verified uv-managed CPython executable
    value: ${{ steps.python.outputs.python-path }}
  rust-toolchain:
    description: Exact normalized Rust toolchain selected by this setup
    value: ${{ steps.inputs.outputs.rust-toolchain }}
  node-version:
    description: Exact Node version selected by this setup
    value: ${{ steps.inputs.outputs.node-version }}

runs:
  using: composite
  steps:
    # Every job's Molt custody root lives under RUNNER_TEMP, disjoint from the
    # checkout: dx verifies this contract and roots MOLT_EXT_ROOT, the memory
    # guard's scratch and every child's TMPDIR here. Without it a checkout not
    # named molt-src is its own custody root and test temp lands inside the
    # source tree, where runtime fixtures reject it. It runs first so uv sync
    # below uses this venv.
    - name: Configure verified ephemeral custody
      shell: pwsh
      run: |
        # Each job owns an isolated runner. OS/arch remain in the receipt;
        # avoid repeating them in every native compiler output path.
        foreach ($value in @($env:RUNNER_TEMP, $env:GITHUB_ENV)) {
          if ([string]::IsNullOrEmpty($value) -or $value -match '[\x00-\x1f\x7f]') {
            throw "Actions bootstrap paths must be nonempty single lines"
          }
          if (-not [System.IO.Path]::IsPathFullyQualified($value)) {
            throw "Actions bootstrap paths must be absolute"
          }
        }
        foreach ($value in @($env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)) {
          if ($value -notmatch '^[0-9]+$') { throw "Invalid Actions run identity" }
        }
        $name = "mp-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
        $custodyRoot = Join-Path $env:RUNNER_TEMP $name
        New-Item -ItemType Directory -Force -Path $custodyRoot | Out-Null
        "MOLT_CI_EPHEMERAL_CUSTODY_ROOT=$custodyRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "UV_PROJECT_ENVIRONMENT=$(Join-Path $custodyRoot 'venv')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "RUSTUP_AUTO_INSTALL=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Normalize and validate bootstrap inputs
      id: inputs
      shell: bash
      env:
        INPUT_PYTHON: ${{ inputs.python }}
        INPUT_UV: ${{ inputs.uv }}
        INPUT_CACHE_UV: ${{ inputs.cache-uv }}
        INPUT_CACHE_CARGO: ${{ inputs.cache-cargo }}
        INPUT_CACHE_LEAN: ${{ inputs.cache-lean }}
        INPUT_CACHE_NAMESPACE: ${{ inputs.cache-namespace }}
        INPUT_ACTIONLINT: ${{ inputs.actionlint }}
        INPUT_TARGET_PYTHONS: ${{ inputs.target-pythons }}
        INPUT_RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        INPUT_NODE_VERSION: ${{ inputs.node-version }}
        INPUT_NODE_CACHE_DEPENDENCY_PATH: ${{ inputs.node-cache-dependency-path }}
        INPUT_RUST_COMPONENTS: ${{ inputs.rust-components }}
        INPUT_RUST_TARGETS: ${{ inputs.rust-targets }}
        INPUT_SYNC: ${{ inputs.sync }}
        INPUT_SYNC_FROZEN: ${{ inputs.sync-frozen }}
        INPUT_SYNC_DEV: ${{ inputs.sync-dev }}
        INPUT_SYNC_GROUPS: ${{ inputs.sync-groups }}
      run: bash .github/actions/setup-project/normalize-inputs.sh "$GITHUB_OUTPUT"

    - name: Install exact uv
      if: steps.inputs.outputs.uv == 'true'
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.23"

    - name: Provision and bind repository Python
      id: python
      if: steps.inputs.outputs.python == 'true'
      shell: bash
      run: bash .github/actions/setup-project/provision-python.sh

    # One resource plan per job, from this runner's measured memory and CPUs,
    # sizes Cargo parallelism and the memory guard caps every later step uses.
    - name: Plan job resources
      if: steps.inputs.outputs.python == 'true'
      shell: bash
      run: python3 tools/ci_resource_env.py --github-env "$GITHUB_ENV"

    - name: Install exact Node with npm cache
      if: steps.inputs.outputs.node-version != '' && inputs.node-cache-dependency-path != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.inputs.outputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.node-cache-dependency-path }}

    - name: Install exact Node
      if: steps.inputs.outputs.node-version != '' && inputs.node-cache-dependency-path == ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.inputs.outputs.node-version }}

    - name: Install exact Rust
      if: steps.inputs.outputs.rust-toolchain != ''
      shell: bash
      env:
        RUST_TOOLCHAIN: ${{ steps.inputs.outputs.rust-toolchain }}
        RUST_COMPONENTS: ${{ steps.inputs.outputs.rust-components }}
        RUST_TARGETS: ${{ steps.inputs.outputs.rust-targets }}
        RUST_TOOLCHAIN_ROLE: ${{ inputs.rust-toolchain }}
      run: python3 -I -B .github/actions/setup-project/provision-rust.py

    - name: Cache uv downloads
      if: steps.inputs.outputs.cache-uv == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/uv
        key: >-
          uv-${{ steps.inputs.outputs.cache-namespace }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.python-version',
          'pyproject.toml', 'uv.lock') }}

    - name: Configure non-incremental Cargo cache
      id: cargo-cache
      if: steps.inputs.outputs.cache-cargo == 'true'
      shell: bash
      run: python3 tools/ci_cargo_cache.py configure

    # actions/cache is GitHub-owned, so the repository's Actions policy allows
    # it; third-party cache actions are rejected before any job step runs.
    # Restore only: every caller ends with ./.github/actions/save-cargo-cache,
    # which saves even when proofs fail (actions/cache saves only on success,
    # so red jobs never warmed their own cache). The per-run key never goes
    # stale; restore-keys pick the newest cache for the same lockfile first.
    - name: Restore Cargo dependency cache
      id: cargo-restore
      if: steps.inputs.outputs.cache-cargo == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ${{ env.MOLT_CARGO_CACHE_TARGET }}
        key: >-
          cargo-${{ steps.inputs.outputs.cache-namespace }}-${{ runner.os }}-${{
          runner.arch }}-${{ steps.inputs.outputs.rust-cache-token }}-${{
          hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml',
          '.cargo/config.toml', 'config/llvm_toolchain_releases.toml',
          'config/llvm_toolchain_arches.toml') }}-${{ github.run_id }}-${{
          github.run_attempt }}
        restore-keys: |
          cargo-${{ steps.inputs.outputs.cache-namespace }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.rust-cache-token }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'config/llvm_toolchain_releases.toml', 'config/llvm_toolchain_arches.toml') }}-
          cargo-${{ steps.inputs.outputs.cache-namespace }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.rust-cache-token }}-

    - name: Record Cargo cache save key
      if: steps.inputs.outputs.cache-cargo == 'true'
      shell: bash
      env:
        CARGO_CACHE_KEY: ${{ steps.cargo-restore.outputs.cache-primary-key }}
      run: printf 'MOLT_CARGO_CACHE_KEY=%s\n' "$CARGO_CACHE_KEY" >> "$GITHUB_ENV"

    - name: Cache Lean lake artifacts
      if: steps.inputs.outputs.cache-lean == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.elan/toolchains
          ~/.elan/update-hashes
          formal/lean/.lake
          formal/lean/lake-packages
        key: >-
          lean-${{ steps.inputs.outputs.cache-namespace }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal/lean/lean-toolchain',
          'formal/lean/lakefile.lean') }}

    - name: Cache actionlint toolchain
      if: steps.inputs.outputs.actionlint == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/molt/toolchains
        key: >-
          actionlint-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('config/actionlint.toml', 'tools/bootstrap_actionlint.py') }}

    - name: Provision exact actionlint
      if: steps.inputs.outputs.actionlint == 'true'
      shell: bash
      run: python3 tools/bootstrap_actionlint.py

    - name: Synchronize project dependencies
      if: steps.inputs.outputs.sync == 'true'
      shell: bash
      env:
        SYNC_FROZEN: ${{ steps.inputs.outputs.sync-frozen }}
        SYNC_DEV: ${{ steps.inputs.outputs.sync-dev }}
        SYNC_GROUPS: ${{ steps.inputs.outputs.sync-groups }}
      run: |
        set -euo pipefail
        args=(sync)
        [[ "$SYNC_FROZEN" != "true" ]] || args+=(--frozen)
        [[ "$SYNC_DEV" != "true" ]] || args+=(--dev)
        if [[ -n "$SYNC_GROUPS" ]]; then
          IFS=',' read -r -a groups <<< "$SYNC_GROUPS"
          for group in "${groups[@]}"; do
            args+=(--group "$group")
          done
        fi
        uv "${args[@]}"

    # Python downloads belong to setup, never to later test discovery, so the
    # target lines install here; afterwards UV_PYTHON_DOWNLOADS stays never.
    - name: Install supported target CPython lines
      if: steps.inputs.outputs.target-pythons == 'true'
      shell: bash
      run: |
        set -euo pipefail
        read -r -a versions <<< "$(uv run --no-sync python3 -c 'from molt.target_python import SUPPORTED_TARGET_PYTHON_SHORT_VERSIONS as versions; print(" ".join(versions))')"
        UV_PYTHON_DOWNLOADS=manual uv python install "${versions[@]}"
